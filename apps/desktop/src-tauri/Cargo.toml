[package]
name = "snug-desktop"
version = "0.1.1"
description = "Snug desktop hub — the playground in a native shell (TASK-20260812-desktop-hub-scaffold)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "snug_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# ---- `lan_fetch` (ADR-0023 D3) ------------------------------------------
# Every one of these ALREADY rides in via tauri-plugin-http's default
# `rustls-tls` feature (verified with `cargo tree`: reqwest 0.12.28,
# rustls 0.23.43, rustls-pki-types 1.15.1, sha2 0.10.9). They are named here
# because this crate now uses them DIRECTLY — a transitive dependency is not an
# API contract, and a plugin upgrade that dropped one would otherwise break the
# build with a mystifying error rather than a resolution failure.
#
# `default-features = false` on reqwest keeps native-tls out: the custom
# verifier is a rustls type, and a build that quietly linked the OS trust store
# instead would ignore it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
url = "2"
futures-util = "0.3"
# ---- `sidecar_fetch` (ADR-0032 §4) --------------------------------------
# The unix-socket transport in `sidecar.rs` is PRODUCTION code, not a test
# helper: `send_over_unix_socket` hand-rolls its HTTP/1.1 exchange so the
# response cap can be enforced WHILE READING. It therefore needs `net`
# (UnixStream) and `io-util` (AsyncReadExt/AsyncWriteExt) as real dependencies.
# These features previously rode in under [dev-dependencies] only, which left
# `cargo check --lib` — and every release build — unable to compile the crate
# while `cargo test` was never run to notice.
tokio = { version = "1", default-features = false, features = ["net", "io-util"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# ---- `helper_install` (ADR-0060) --------------------------------------------
# All four ALREADY ride in via tauri-plugin-updater (minisign-verify, tar, flate2, webpki-roots)
# and are named here for the same reason reqwest is above: this crate now calls them
# directly. minisign-verify checks the helper archive against the SAME updater pubkey
# (ADR-0060 §5); tar+flate2 unpack it under the shell's own admission rules (§7);
# webpki-roots gives the GitHub download a real root store — the LAN client above is
# built with NO roots on purpose (custom pin verifier), so it cannot be reused here.
minisign-verify = "0.2"
tar = "0.4"
flate2 = "1"
webpki-roots = "1"
base64 = "0.22"

# The sidecar reap sends SIGTERM before SIGKILL (ADR-0037 §1: the helper's TERM handler
# runs the thread cache's final flush; `Child::kill` alone is SIGKILL, which runs no
# handlers). Already in the tree transitively; named because this crate calls it directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Certificate fixtures for the pin verifier's Rust-boundary test (amendment 13):
# the host-class check refuses loopback, so a 127.0.0.1 stub server cannot reach
# this path — the verifier is fed a real DER certificate directly instead.
rcgen = "0.13"
# The TEST-only half of tokio: `#[tokio::test]` needs the macro and a runtime to
# drive it. The transport features (`net`, `io-util`) are declared in
# [dependencies] above, where the production code that uses them lives — cargo
# unions the two sets, so each section states only why IT needs tokio.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
http = "1"
