[package]
name = "snug-desktop"
version = "0.1.0"
description = "Snug desktop hub — the playground in a native shell (TASK-20260812-desktop-hub-scaffold)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "snug_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
