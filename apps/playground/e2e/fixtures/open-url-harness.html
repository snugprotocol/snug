<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>snug open-url harness</title>
    <!-- Production runner dist under test: the open-url frame rides the SAME bridge the
         app uses, and the host-side handler opens the window from a REAL click — the
         one claim jsdom cannot carry (popup-blocker escape). -->
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "/shims/react.js",
          "react/jsx-runtime": "/shims/jsx-runtime.js",
          "react-dom/client": "/shims/react-dom-client.js",
          "@snugprotocol/runner": "/pkg/runner/index.js",
          "@snugprotocol/protocol": "/pkg/protocol/index.js",
          "zod": "/zod/index.js"
        }
      }
    </script>
    <style>
      body { margin: 16px; font-family: system-ui, sans-serif; background: #141210; color: #eee; }
      iframe { width: 480px; height: 360px; border: 1px solid #444; border-radius: 8px; background: #fff; }
      #confirm-surface { margin-top: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="confirm-surface"></div>
    <script type="module" src="/open-url-harness.js"></script>
  </body>
</html>
