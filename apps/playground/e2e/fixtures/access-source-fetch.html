<!DOCTYPE html>
<!--
  e2e/fixtures/access-source-fetch.html — "Bank", the SOURCE that can FETCH ON REQUEST, of the
  access-between-apps e2e (TASK-20261010-host-broker PR-3 AC28; e2e/access.spec.ts' refresh walk and
  apps/host/e2e/kit-access.spec.ts). A clone of access-source.html ("Ledger") — everything below is
  that file's, with three changes: its one naming line, a `fetches` table (one row: `n`, the count of
  fetches the host asked for, and `asked_by`, the `requestedBy` the last one carried), and the KB 85
  schedule listener (packages/knowledge/prompts/knowledge-base/app-authoring/85-scheduled-runs.md,
  "The Schedule Listener", RENDERED — the same block as schedule-app.html) whose `onScheduledRun`
  is this app's: a fetch another app asked for (`input.kind === 'refresh'`, D-PR3-17) bumps the
  counter and records who asked, then answers `schedule-result { ok: true }`. Ledger has NO
  listener — the spec's handler-less source. What follows is access-source.html's own note.

  e2e/fixtures/access-source.html — "Ledger", the SOURCE fixture of the access-between-apps e2e
  (TASK-20261010-cross-app-access AC22; e2e/access.spec.ts). Not a starter. Sections 1–4 below are
  the copy-exactly hooks block of packages/knowledge/prompts/knowledge-base/app-authoring/
  20-html-template.md, RENDERED (getKnowledgeBase() of @snugprotocol/knowledge — byte-identical to
  the same sections of schedule-app.html); SYNC RULE: when the template's hooks change, re-render
  and paste them here again — never edit them in place.
  The app's one job: on its first open, create two tables through useAppDB and seed a few rows —
    transactions (amount, category, date, note) — what a budget would ask to read;
    accounts (name, balance, api_key)           — a credential-named column the consent sheet
                                                  must mark *never shared*, in a table the user
                                                  never ticks (the reader must find it ABSENT);
  then print "ready" with the counts. A second open finds the rows and seeds nothing.
  ONE line names the app (`SOURCE` below): the spec rewrites it to install a second source
  ("Pantry") from the same document — the app the reader must never learn exists.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <style>
    :root { --bg: #ffffff; --fg: #17171f; --muted: #6b7280; --card: #f4f4f8; --border: #e2e2ea; --accent: #6c5ce7; }
    :root[data-theme="dark"] { --bg: #15151d; --fg: #ececf4; --muted: #9a9aad; --card: #20202c; --border: #32323f; --accent: #8b7cf7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    button { min-width: 44px; min-height: 44px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ============================================================
    // 1. SNUG BRIDGE RUNTIME (MANDATORY — copy exactly, never edit)
    // ============================================================
    const SnugBridge = {
      instanceId: null,
      theme: 'light',
      capabilities: {},
      ready: false,
      pending: new Map(),    // requestId -> { resolve, onStream }
      dbPending: new Map(),  // requestId -> resolve
      netPending: new Map(), // requestId -> resolve
      listeners: new Set(),  // re-render triggers for hooks

      post(frame) {
        window.parent.postMessage({ v: 1, instanceId: this.instanceId, ...frame }, '*');
      },
      notify() { for (const fn of this.listeners) fn(); },
    };

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.v !== 1) return;

      if (data.type === 'snug:host-ready') {
        SnugBridge.instanceId = data.instanceId;
        if (data.theme) SnugBridge.theme = data.theme;
        if (data.capabilities) SnugBridge.capabilities = data.capabilities;
        SnugBridge.ready = true;
        SnugBridge.notify();
        return;
      }

      if (data.type === 'snug:app-response') {
        const entry = SnugBridge.pending.get(data.requestId);
        if (!entry) return; // unknown or superseded requestId — ignore
        if (data.streaming) {
          // Cumulative provisional text — display only. NEVER resolve here.
          if (entry.onStream && typeof data.text === 'string') entry.onStream(data.text);
          return;
        }
        SnugBridge.pending.delete(data.requestId); // terminal — exactly one per requestId
        entry.resolve(data.ok ? { ok: true, data: data.data } : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:db-response') {
        const resolve = SnugBridge.dbPending.get(data.requestId);
        if (!resolve) return;
        SnugBridge.dbPending.delete(data.requestId);
        // Result fields (rows/columns/value/bytesBase64) live at the TOP LEVEL of the frame.
        resolve(data.ok
          ? { ok: true, rows: data.rows, columns: data.columns, value: data.value, bytesBase64: data.bytesBase64 }
          : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:net-response') {
        const resolve = SnugBridge.netPending.get(data.requestId);
        if (!resolve) return;
        SnugBridge.netPending.delete(data.requestId);
        // Result fields (status/headers/body/truncated) live at the TOP LEVEL of the frame.
        resolve(data.ok
          ? { ok: true, status: data.status, headers: data.headers, body: data.body, truncated: data.truncated }
          : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:host-event') {
        if (data.event === 'theme-change' && data.data && data.data.theme) {
          SnugBridge.theme = data.data.theme;
          SnugBridge.notify();
        }
        // Unknown host events MUST be ignored (the protocol is additive).
      }
    });

    function snugDbRequest(op, args) {
      return new Promise((resolve) => {
        const requestId = crypto.randomUUID();
        SnugBridge.dbPending.set(requestId, resolve);
        SnugBridge.post({ type: 'snug:db-request', requestId, op, ...args });
      });
    }

    function snugNetRequest(fields) {
      if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
      return new Promise((resolve) => {
        const requestId = crypto.randomUUID();
        SnugBridge.netPending.set(requestId, resolve);
        SnugBridge.post({ type: 'snug:net-request', requestId, ...fields });
      });
    }

    // ============================================================
    // 2. useSnugApp (MANDATORY — copy exactly, never edit)
    // ============================================================
    function useSnugApp(meta) {
      const [, setTick] = useState(0);
      const [isWaiting, setIsWaiting] = useState(false);
      const [lastResponse, setLastResponse] = useState(null);
      const inFlight = useRef(0);
      const metaRef = useRef(meta);

      useEffect(() => {
        const rerender = () => setTick((n) => n + 1);
        SnugBridge.listeners.add(rerender);
        const m = metaRef.current;
        SnugBridge.post({
          type: 'snug:app-announce',
          appId: m.appId,
          displayName: m.displayName,
          description: m.description,
          iconEmoji: m.iconEmoji,
          iconColor: m.iconColor,
        });
        return () => SnugBridge.listeners.delete(rerender);
      }, []);

      const sendMessage = useCallback((action, payload, opts) => {
        if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
        const requestId = crypto.randomUUID(); // fresh per request — multiple in flight are legal
        inFlight.current += 1;
        setIsWaiting(true);
        return new Promise((resolve) => {
          SnugBridge.pending.set(requestId, {
            onStream: opts && opts.onStream,
            resolve: (result) => {
              inFlight.current -= 1;
              if (inFlight.current === 0) setIsWaiting(false);
              setLastResponse(result);
              resolve(result);
            },
          });
          SnugBridge.post({
            type: 'snug:app-message',
            requestId,
            appId: metaRef.current.appId,
            action,
            payload,
            state: opts && opts.state,
            responseSchema: opts && opts.responseSchema,
          });
        });
      }, []);

      return {
        isReady: SnugBridge.ready,
        theme: SnugBridge.theme,
        isWaiting,
        lastResponse,
        sendMessage,
      };
    }

    // ============================================================
    // 3. usePersistedState (MANDATORY — copy exactly, never edit)
    // Storage is HOST-BROKERED key-value. The sandboxed iframe has a
    // null origin: no browser storage API works here.
    // ============================================================
    function usePersistedState(key, initialValue) {
      const [state, setState] = useState(initialValue);
      // Tracks WHICH key hydrated: a key change must re-hydrate before any write-back,
      // or the old key's state would overwrite the new key's stored value.
      const [hydratedKey, setHydratedKey] = useState(null);
      const initialRef = useRef(initialValue);

      useEffect(() => {
        let cancelled = false;
        const hydrate = async () => {
          const result = await snugDbRequest('kvGet', { key });
          if (cancelled) return;
          if (result.ok && result.value != null) {
            const stored = result.value;
            const init = initialRef.current;
            // Merge objects with defaults so fields added in newer code are never undefined.
            setState(
              stored && typeof stored === 'object' && !Array.isArray(stored) &&
              init && typeof init === 'object' && !Array.isArray(init)
                ? { ...init, ...stored }
                : stored
            );
          } else {
            setState(initialRef.current); // nothing stored under this key — back to defaults
          }
          setHydratedKey(key);
        };
        const onReady = () => {
          if (!SnugBridge.ready) return;
          SnugBridge.listeners.delete(onReady);
          hydrate();
        };
        if (SnugBridge.ready) hydrate();
        else SnugBridge.listeners.add(onReady);
        return () => { cancelled = true; SnugBridge.listeners.delete(onReady); };
      }, [key]);

      useEffect(() => {
        if (hydratedKey !== key) return;
        snugDbRequest('kvSet', { key, value: state }); // fire-and-forget; host acks via db-response
      }, [hydratedKey, key, state]);

      return [state, setState];
    }

    // ============================================================
    // 4. useAppDB (copy exactly when the app needs SQL; omit otherwise)
    // ============================================================
    function useAppDB() {
      return useMemo(() => ({
        async exec(sql, params) {
          const result = await snugDbRequest('exec', { sql, params });
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db exec failed');
          return { rows: result.rows, columns: result.columns }; // { rows: unknown[][], columns: string[] }
        },
        async exportDb() {
          const result = await snugDbRequest('export', {});
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db export failed');
          return result.bytesBase64;
        },
        async importDb(bytesBase64) {
          const result = await snugDbRequest('import', { bytesBase64 });
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db import failed');
        },
      }), []);
    }

    // ============================================================
    // 6. RESPONSE SCHEMA — this app never thinks; kept for the template's shape
    // ============================================================
    const RESPONSE_SCHEMA = { message: 'string' };

    // ============================================================
    // 7. YOUR APP
    // ============================================================
    const SOURCE = { appId: 'e2e-access-bank', displayName: 'Bank', iconEmoji: '🏦', iconColor: '#3b6fa3' };

    const SCHEMA = [
      'CREATE TABLE IF NOT EXISTS transactions (amount REAL NOT NULL, category TEXT NOT NULL, date TEXT NOT NULL, note TEXT)',
      'CREATE TABLE IF NOT EXISTS accounts (name TEXT NOT NULL, balance REAL NOT NULL, api_key TEXT)',
      // How many fetches another app asked for, and who asked last — bumped by onScheduledRun below.
      'CREATE TABLE IF NOT EXISTS fetches (n INTEGER NOT NULL, asked_by TEXT)',
    ];
    const TRANSACTIONS = [
      [120, 'rent', '2026-10-01', 'october share'],
      [42.5, 'groceries', '2026-10-02', 'market'],
      [15.25, 'groceries', '2026-10-04', 'bakery'],
      [9.99, 'music', '2026-10-05', 'monthly plan'],
    ];
    const ACCOUNTS = [
      ['checking', 1200, 'not-a-real-key-1'],
      ['savings', 5000, 'not-a-real-key-2'],
    ];

    /** First open: the tables, then the seed — only into an empty table, so a reopen changes nothing. */
    async function prepare(db) {
      for (const statement of SCHEMA) await db.exec(statement);
      const counted = await db.exec('SELECT (SELECT count(*) FROM transactions), (SELECT count(*) FROM accounts)');
      const [transactions, accounts] = counted.rows[0];
      if (transactions === 0) {
        for (const row of TRANSACTIONS) await db.exec('INSERT INTO transactions (amount, category, date, note) VALUES (?, ?, ?, ?)', row);
      }
      if (accounts === 0) {
        for (const row of ACCOUNTS) await db.exec('INSERT INTO accounts (name, balance, api_key) VALUES (?, ?, ?)', row);
      }
      const fetched = await db.exec('SELECT count(*) FROM fetches');
      if (fetched.rows[0][0] === 0) await db.exec('INSERT INTO fetches (n, asked_by) VALUES (0, NULL)');
      const after = await db.exec('SELECT (SELECT count(*) FROM transactions), (SELECT count(*) FROM accounts), (SELECT n FROM fetches)');
      return { transactions: after.rows[0][0], accounts: after.rows[0][1], fetches: after.rows[0][2] };
    }

    /**
     * This app's work for a run the host started: a fetch another app asked for (`input.kind ===
     * 'refresh'`; `input.requestedBy` is the asking app's name) — "fetch" here is the counter, so the
     * spec can see the run happened and who asked. Answers ok; its summary never reaches the asker.
     */
    async function onScheduledRun({ runId, taskId, input }) {
      const wants = input && typeof input === 'object' ? input : {};
      if (wants.kind !== 'refresh') return { ok: true, summary: 'ran with no fetch asked' };
      const askedBy = typeof wants.requestedBy === 'string' ? wants.requestedBy : null;
      const bumped = await snugDbRequest('exec', { sql: 'UPDATE fetches SET n = n + 1, asked_by = ?', params: [askedBy] });
      if (!bumped.ok) return { ok: false, summary: 'could not count the fetch' };
      return { ok: true, summary: 'fetched for ' + (askedBy || 'another app') };
    }

    // ============================================================
    // SCHEDULED RUNS — the host's scheduler wakes this app; see "Scheduled Runs"
    // ============================================================
    const SCHEDULE_HANDLED = new Set(); // runIds already answered on this page

    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (event.source !== window.parent || !data || data.v !== 1) return;
      if (data.type !== 'snug:host-event' || data.event !== 'schedule-run') return;
      const hint = data.data;
      if (!hint || typeof hint.runId !== 'string' || typeof hint.taskId !== 'string') return;
      if (SCHEDULE_HANDLED.has(hint.runId)) return; // a repeated hint: the first answer stands
      SCHEDULE_HANDLED.add(hint.runId);
      const stored = await snugDbRequest('kvGet', { key: 'snug:schedule:' + hint.runId });
      const input = stored.ok && stored.value && typeof stored.value === 'object' ? stored.value.input : undefined;
      let result;
      try {
        result = await onScheduledRun({ runId: hint.runId, taskId: hint.taskId, input });
      } catch (err) {
        result = { ok: false, summary: (err && err.message) || 'the scheduled run failed' };
      }
      const answer = { ok: !!(result && result.ok) };
      if (result && typeof result.summary === 'string' && result.summary) answer.summary = result.summary;
      if (result && result.notify && result.notify.title && result.notify.body) {
        answer.notify = { title: String(result.notify.title), body: String(result.notify.body) };
      }
      SnugBridge.post({ type: 'snug:app-event', event: 'schedule-result', data: answer });
    });

    function App() {
      const { isReady, theme } = useSnugApp({
        appId: SOURCE.appId,
        displayName: SOURCE.displayName,
        description: 'Keeps transactions and accounts, and fetches new ones when asked.',
        iconEmoji: SOURCE.iconEmoji,
        iconColor: SOURCE.iconColor,
      });
      const db = useAppDB();
      const [counts, setCounts] = useState(null);
      const [failure, setFailure] = useState(null);
      useEffect(() => {
        document.documentElement.dataset.theme = theme;
      }, [theme]);
      useEffect(() => {
        if (!isReady) return;
        let cancelled = false;
        prepare(db)
          .then((next) => { if (!cancelled) setCounts(next); })
          .catch((err) => { if (!cancelled) setFailure((err && err.message) || 'could not prepare the tables'); });
        return () => { cancelled = true; };
      }, [isReady, db]);

      if (!isReady) return <div id="status">connecting</div>;
      if (failure) return <div id="status">failed: {failure}</div>;
      if (!counts) return <div id="status">preparing</div>;
      return (
        <main>
          <h1>{SOURCE.displayName}</h1>
          <div id="status">ready</div>
          <div id="counts">{'transactions: ' + counts.transactions + ' · accounts: ' + counts.accounts + ' · fetches: ' + counts.fetches}</div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
