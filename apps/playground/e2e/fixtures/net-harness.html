<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>snug net harness</title>
    <!-- Production runner + auth dist under test, wired through the SAME bridge the app
         uses. @snugprotocol/db maps to the sql-free auth-secrets module (the only db
         surface auth needs — the key-shape constants), so no sql.js/wasm loads here. -->
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "/shims/react.js",
          "react/jsx-runtime": "/shims/jsx-runtime.js",
          "react-dom/client": "/shims/react-dom-client.js",
          "@snugprotocol/runner": "/pkg/runner/index.js",
          "@snugprotocol/protocol": "/pkg/protocol/index.js",
          "@snugprotocol/auth": "/pkg/auth/index.js",
          "@snugprotocol/db": "/pkg/db/userdb/auth-secrets.js",
          "zod": "/zod/index.js"
        }
      }
    </script>
    <style>
      body { margin: 16px; font-family: system-ui, sans-serif; background: #141210; color: #eee; }
      iframe { width: 480px; height: 360px; border: 1px solid #444; border-radius: 8px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/net-harness.js"></script>
  </body>
</html>
