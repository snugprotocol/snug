<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>snug runner harness</title>
    <!-- UMD react first, then an import map so the runner's PRODUCTION dist (which
         imports bare "react" / "react/jsx-runtime") resolves against those globals.
         No bundler: what executes here is byte-for-byte the workspace dist output. -->
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "/shims/react.js",
          "react/jsx-runtime": "/shims/jsx-runtime.js",
          "react-dom/client": "/shims/react-dom-client.js",
          "@snugprotocol/runner": "/pkg/runner/index.js",
          "@snugprotocol/protocol": "/pkg/protocol/index.js",
          "zod": "/zod/index.js"
        }
      }
    </script>
    <style>
      body { margin: 16px; font-family: system-ui, sans-serif; background: #141210; color: #eee; }
      iframe { width: 420px; height: 320px; border: 1px solid #444; border-radius: 8px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/harness.js"></script>
  </body>
</html>
