<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-label="The trust boundary: what crosses into the sandboxed app and what never crosses">
  <defs>
    <marker id="f4-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f7d58"/>
    </marker>
    <marker id="f4-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b04a4a"/>
    </marker>
  </defs>

  <!-- trusted zone -->
  <rect x="16" y="44" width="330" height="300" rx="10" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.5"/>
  <text x="32" y="68" class="f-title">Trusted — host page origin</text>

  <rect x="36" y="84" width="290" height="38" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.1"/>
  <text x="181" y="101" text-anchor="middle" class="f-label">Credential store</text>
  <text x="181" y="115" text-anchor="middle" class="f-mono-sm">snug_secrets — API keys, OAuth tokens</text>

  <rect x="36" y="132" width="290" height="38" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.1"/>
  <text x="181" y="149" text-anchor="middle" class="f-label">Fetch caller / model client</text>
  <text x="181" y="163" text-anchor="middle" class="f-tiny">injection is host-bound and always strict — never a flag</text>

  <rect x="36" y="180" width="290" height="38" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.1"/>
  <text x="181" y="197" text-anchor="middle" class="f-label">Envelope validator</text>
  <text x="181" y="211" text-anchor="middle" class="f-tiny">strips authorization, cookie, set-cookie, x-api-key,</text>
  <text x="181" y="223" text-anchor="middle" class="f-tiny">proxy-authorization from app-originated requests</text>

  <rect x="36" y="238" width="290" height="38" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.1"/>
  <text x="181" y="255" text-anchor="middle" class="f-label">User database</text>
  <text x="181" y="269" text-anchor="middle" class="f-tiny">single source of truth in every mode</text>

  <!-- the boundary -->
  <line x1="374" y1="30" x2="374" y2="358" stroke="#b04a4a" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="374" y="22" text-anchor="middle" class="f-title" fill="#b04a4a">Trust boundary</text>

  <!-- untrusted zone -->
  <rect x="402" y="44" width="302" height="300" rx="10" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="418" y="68" class="f-title">Untrusted — sandboxed iframe</text>
  <text x="418" y="86" class="f-mono-sm">sandbox="allow-scripts"</text>
  <text x="418" y="102" class="f-tiny">null origin · no same-origin · no top navigation</text>
  <text x="418" y="118" class="f-mono-sm">connect-src 'none'</text>
  <text x="418" y="134" class="f-tiny">no network egress of any kind; fixed CDN allowlist</text>

  <rect x="422" y="150" width="262" height="52" rx="6" fill="#fff" stroke="#a8712a" stroke-width="1.2"/>
  <text x="553" y="172" text-anchor="middle" class="f-label">LLM-authored app code</text>
  <text x="553" y="188" text-anchor="middle" class="f-tiny">treated as hostile input at all times</text>

  <!-- crossings -->
  <path d="M346 226 L430 226" fill="none" stroke="#3f7d58" stroke-width="1.6" marker-end="url(#f4-ok)"/>
  <text x="553" y="222" text-anchor="middle" class="f-edge" fill="#3f7d58">frames · model answers · scrubbed responses</text>
  <text x="553" y="236" text-anchor="middle" class="f-tiny">structured JSON only, size-capped</text>

  <path d="M430 262 L346 262" fill="none" stroke="#3f7d58" stroke-width="1.6" marker-end="url(#f4-ok)"/>
  <text x="553" y="258" text-anchor="middle" class="f-edge" fill="#3f7d58">requests · db operations</text>
  <text x="553" y="272" text-anchor="middle" class="f-tiny">validated at the boundary before any effect</text>

  <!-- blocked -->
  <rect x="402" y="290" width="302" height="54" rx="6" fill="#fdf2f2" stroke="#b04a4a" stroke-width="1.3"/>
  <text x="553" y="310" text-anchor="middle" class="f-label" fill="#b04a4a">Never crosses</text>
  <text x="553" y="326" text-anchor="middle" class="f-tiny">credentials · raw tokens · direct network access ·</text>
  <text x="553" y="338" text-anchor="middle" class="f-tiny">host storage · another app's data</text>
  <path d="M374 317 L398 317" fill="none" stroke="#b04a4a" stroke-width="1.8" marker-end="url(#f4-no)"/>

  <text x="16" y="372" class="f-note">C1 and C2 hold identically in every execution mode. Model calls originate from the host page only — never from the iframe.</text>
</svg>
