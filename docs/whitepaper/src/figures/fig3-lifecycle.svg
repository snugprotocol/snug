<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Frame lifecycle sequence: announce, host-ready, app-message, agent turn, streaming frames, terminal response, and the cancel and supersede paths">
  <defs>
    <marker id="f3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="f3-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8712a"/>
    </marker>
    <marker id="f3-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa1ab"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <rect x="40" y="20" width="132" height="30" rx="5" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.4"/>
  <text x="106" y="40" text-anchor="middle" class="f-label">App (iframe)</text>
  <rect x="294" y="20" width="132" height="30" rx="5" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.4"/>
  <text x="360" y="40" text-anchor="middle" class="f-label">Host runner</text>
  <rect x="548" y="20" width="132" height="30" rx="5" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.4"/>
  <text x="614" y="40" text-anchor="middle" class="f-label">Agent endpoint</text>

  <line x1="106" y1="50" x2="106" y2="440" stroke="#c9ced6" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="360" y1="50" x2="360" y2="440" stroke="#c9ced6" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="614" y1="50" x2="614" y2="440" stroke="#c9ced6" stroke-width="1.1" stroke-dasharray="3 3"/>

  <!-- 1 announce -->
  <path d="M106 76 L356 76" fill="none" stroke="#a8712a" stroke-width="1.4" marker-end="url(#f3-b)"/>
  <text x="231" y="70" text-anchor="middle" class="f-mono-sm">snug:app-announce</text>

  <!-- 2 host-ready -->
  <path d="M360 104 L110 104" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#f3-a)"/>
  <text x="235" y="98" text-anchor="middle" class="f-mono-sm">snug:host-ready</text>
  <text x="235" y="118" text-anchor="middle" class="f-tiny">instanceId · protocolVersions · capabilities · theme</text>

  <!-- 3 app-message -->
  <path d="M106 152 L356 152" fill="none" stroke="#a8712a" stroke-width="1.4" marker-end="url(#f3-b)"/>
  <text x="231" y="146" text-anchor="middle" class="f-mono-sm">snug:app-message</text>
  <text x="231" y="166" text-anchor="middle" class="f-tiny">requestId · action · payload? · state? · responseSchema?</text>

  <!-- 4 envelope to agent -->
  <path d="M360 196 L610 196" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#f3-a)"/>
  <text x="485" y="190" text-anchor="middle" class="f-mono-sm">[SNUG_APP_REQUEST]\n{"snug":1,…}</text>
  <text x="485" y="210" text-anchor="middle" class="f-tiny">credential headers stripped here (C1)</text>

  <!-- 5 streaming -->
  <path d="M614 240 L364 240" fill="none" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f3-c)"/>
  <path d="M360 262 L110 262" fill="none" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f3-c)"/>
  <text x="235" y="256" text-anchor="middle" class="f-mono-sm">snug:app-response  (streaming: true)</text>
  <text x="235" y="276" text-anchor="middle" class="f-tiny">cumulative prose · display-provisional · zero or more</text>

  <!-- 6 terminal -->
  <path d="M614 306 L364 306" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#f3-a)"/>
  <text x="489" y="300" text-anchor="middle" class="f-tiny">JSON-only reply</text>
  <path d="M360 330 L110 330" fill="none" stroke="#5b6472" stroke-width="1.7" marker-end="url(#f3-a)"/>
  <text x="235" y="324" text-anchor="middle" class="f-mono-sm">snug:app-response  (terminal)</text>
  <text x="235" y="344" text-anchor="middle" class="f-tiny">ok:true, streaming:false — or ok:false with error.code</text>

  <!-- R3 bracket -->
  <path d="M690 152 L702 152 L702 330 L690 330" fill="none" stroke="#a8712a" stroke-width="1.2"/>
  <text x="708" y="248" text-anchor="middle" class="f-edge-alt" transform="rotate(90 708 248)">R3 — exactly one terminal frame</text>

  <!-- alternate paths -->
  <rect x="40" y="366" width="640" height="88" rx="7" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1.1"/>
  <text x="56" y="386" class="f-label">Alternate paths</text>

  <path d="M106 404 L286 404" fill="none" stroke="#a8712a" stroke-width="1.2" marker-end="url(#f3-b)"/>
  <text x="196" y="399" text-anchor="middle" class="f-mono-sm">snug:app-cancel</text>
  <text x="196" y="418" text-anchor="middle" class="f-tiny">→ terminal ok:false, CANCELLED</text>

  <path d="M370 404 L560 404" fill="none" stroke="#a8712a" stroke-width="1.2" marker-end="url(#f3-b)"/>
  <text x="465" y="399" text-anchor="middle" class="f-mono-sm">re-announce</text>
  <text x="465" y="418" text-anchor="middle" class="f-tiny">→ in-flight work invalidated, SUPERSEDED</text>

  <text x="360" y="440" text-anchor="middle" class="f-tiny">Unparseable reply → PARSE_FAILED with rawExcerpt and attemptsRemaining; 3 consecutive failures require an explicit user reset.</text>
</svg>
