<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" role="img" aria-label="The connected-fetch executor: an app network request passes ten ordered gates; the user's confirmation precedes any credential read, and local transports depart only after it">
  <defs>
    <marker id="f9-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="f9-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8712a"/>
    </marker>
  </defs>

  <!-- entry -->
  <rect x="16" y="42" width="118" height="40" rx="6" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.4"/>
  <text x="75" y="59" text-anchor="middle" class="f-mono-sm">snug:net-request</text>
  <text x="75" y="74" text-anchor="middle" class="f-tiny">from the sandbox</text>
  <path d="M134 62 L156 62" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#f9-a)"/>

  <!-- row 1: gates 1-5 -->
  <g>
    <rect x="160" y="38" width="100" height="48" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="210" y="56" text-anchor="middle" class="f-label">1 · Shape</text>
    <text x="210" y="70" text-anchor="middle" class="f-tiny">strict, fail closed</text>
    <text x="210" y="81" text-anchor="middle" class="f-tiny">slot URLs resolve here</text>

    <rect x="272" y="38" width="100" height="48" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="322" y="56" text-anchor="middle" class="f-label">2 · Binding</text>
    <text x="322" y="70" text-anchor="middle" class="f-tiny">appId host-assigned,</text>
    <text x="322" y="81" text-anchor="middle" class="f-tiny">never claimed</text>

    <rect x="384" y="38" width="100" height="48" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="434" y="56" text-anchor="middle" class="f-label">3 · Grant</text>
    <text x="434" y="70" text-anchor="middle" class="f-tiny">approved + unique;</text>
    <text x="434" y="81" text-anchor="middle" class="f-tiny">imported rows refuse</text>

    <rect x="496" y="38" width="100" height="48" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="546" y="56" text-anchor="middle" class="f-label">4 · Ceiling</text>
    <text x="546" y="70" text-anchor="middle" class="f-tiny">https + exact host ∈</text>
    <text x="546" y="81" text-anchor="middle" class="f-tiny">frozen allowed_hosts</text>

    <rect x="608" y="38" width="96" height="48" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="656" y="56" text-anchor="middle" class="f-label">5 · SSRF</text>
    <text x="656" y="70" text-anchor="middle" class="f-tiny">private literals refused</text>
    <text x="656" y="81" text-anchor="middle" class="f-tiny">even inside a ceiling</text>

    <path d="M260 62 L268 62" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
    <path d="M372 62 L380 62" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
    <path d="M484 62 L492 62" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
    <path d="M596 62 L604 62" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
  </g>

  <!-- wrap arrow -->
  <path d="M656 86 C 656 118, 600 118, 400 118 C 240 118, 210 122, 210 138" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>

  <!-- row 2: gate 6 (human), 6a, 7, 8 -->
  <g>
    <rect x="150" y="142" width="120" height="56" rx="6" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.8"/>
    <text x="210" y="160" text-anchor="middle" class="f-label">6 · Confirm</text>
    <text x="210" y="174" text-anchor="middle" class="f-tiny">every mutating call:</text>
    <text x="210" y="185" text-anchor="middle" class="f-tiny">the USER sees host,</text>
    <text x="210" y="196" text-anchor="middle" class="f-tiny">method, URL — first</text>

    <rect x="282" y="142" width="120" height="56" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="342" y="160" text-anchor="middle" class="f-label">7 · Strip</text>
    <text x="342" y="174" text-anchor="middle" class="f-tiny">app credential-shaped</text>
    <text x="342" y="185" text-anchor="middle" class="f-tiny">headers removed (C1)</text>

    <rect x="414" y="142" width="120" height="56" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="474" y="160" text-anchor="middle" class="f-label">8 · Inject</text>
    <text x="474" y="174" text-anchor="middle" class="f-tiny">credential read + attached</text>
    <text x="474" y="185" text-anchor="middle" class="f-tiny">host-side · always strict —</text>
    <text x="474" y="196" text-anchor="middle" class="f-tiny">no bypass flag exists</text>

    <rect x="546" y="142" width="76" height="56" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="584" y="160" text-anchor="middle" class="f-label">9 · Fetch</text>
    <text x="584" y="174" text-anchor="middle" class="f-tiny">redirects never</text>
    <text x="584" y="185" text-anchor="middle" class="f-tiny">followed</text>

    <rect x="634" y="142" width="70" height="56" rx="6" fill="#fff" stroke="#5b6472" stroke-width="1.2"/>
    <text x="669" y="160" text-anchor="middle" class="f-label">10 · Read</text>
    <text x="669" y="174" text-anchor="middle" class="f-tiny">1 MiB cap ·</text>
    <text x="669" y="185" text-anchor="middle" class="f-tiny">value scrub ·</text>
    <text x="669" y="196" text-anchor="middle" class="f-tiny">header filter</text>

    <path d="M270 170 L278 170" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
    <path d="M402 170 L410 170" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
    <path d="M534 170 L542 170" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
    <path d="M622 170 L630 170" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f9-a)"/>
  </g>

  <!-- 6a branch -->
  <path d="M210 198 L210 226" fill="none" stroke="#a8712a" stroke-width="1.4" marker-end="url(#f9-b)"/>
  <rect x="120" y="230" width="180" height="48" rx="6" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="210" y="248" text-anchor="middle" class="f-label">6a · Local transport</text>
  <text x="210" y="262" text-anchor="middle" class="f-tiny">a helper send departs here — AFTER the</text>
  <text x="210" y="273" text-anchor="middle" class="f-tiny">confirm; transport shape never excuses consent</text>

  <!-- credential boundary annotation -->
  <path d="M414 208 L414 138" fill="none" stroke="#b04a4a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="414" y="220" text-anchor="middle" class="f-edge" fill="#b04a4a">no credential is readable left of this line</text>

  <!-- exit -->
  <rect x="586" y="230" width="118" height="40" rx="6" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.4"/>
  <text x="645" y="247" text-anchor="middle" class="f-mono-sm">snug:net-response</text>
  <text x="645" y="262" text-anchor="middle" class="f-tiny">scrubbed, size-capped</text>
  <path d="M669 198 L662 226" fill="none" stroke="#5b6472" stroke-width="1.3" marker-end="url(#f9-a)"/>

  <!-- invariant -->
  <rect x="16" y="296" width="688" height="26" rx="4" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1"/>
  <text x="360" y="313" text-anchor="middle" class="f-note">One seat in the entire system both reads credential values and calls fetch — and this is it. Any failure at any gate is terminal and fail-closed.</text>
</svg>
