<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" role="img" aria-label="Linked-device connections: the governed host reaches a local helper over a unix socket behind a symbolic host; the provider's session keys never leave the helper; only hints are pushed; identities are pseudonymised before any model call">
  <defs>
    <marker id="f10-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="f10-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8712a"/>
    </marker>
  </defs>

  <!-- host -->
  <rect x="16" y="34" width="300" height="330" rx="10" fill="#fbfbfc" stroke="#5b6472" stroke-width="1.6"/>
  <text x="32" y="56" class="f-title">Governed host</text>

  <rect x="36" y="70" width="260" height="58" rx="7" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="166" y="90" text-anchor="middle" class="f-label">Sandboxed app</text>
  <text x="166" y="105" text-anchor="middle" class="f-mono-sm">snug-connection://&lt;slot&gt;/…</text>
  <text x="166" y="119" text-anchor="middle" class="f-tiny">never sees the socket, the token, or an address</text>

  <rect x="36" y="146" width="260" height="66" rx="7" fill="#fff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="166" y="166" text-anchor="middle" class="f-label">Connected-fetch executor</text>
  <text x="166" y="181" text-anchor="middle" class="f-tiny">all ten gates apply — confirm before every send;</text>
  <text x="166" y="193" text-anchor="middle" class="f-tiny">only the SSRF gate stands down for the</text>
  <text x="166" y="205" text-anchor="middle" class="f-tiny">symbolic host, and only that gate</text>
  <path d="M166 128 L166 142" fill="none" stroke="#a8712a" stroke-width="1.4" marker-end="url(#f10-b)"/>

  <rect x="36" y="230" width="260" height="52" rx="7" fill="#fff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="166" y="249" text-anchor="middle" class="f-label">Egress pseudonymisation</text>
  <text x="166" y="263" text-anchor="middle" class="f-tiny">harvested identities + dialable numbers redacted</text>
  <text x="166" y="275" text-anchor="middle" class="f-tiny">from every model-bound payload · fails closed</text>

  <rect x="36" y="298" width="260" height="52" rx="7" fill="#fff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="166" y="317" text-anchor="middle" class="f-label">snug_secrets</text>
  <text x="166" y="331" text-anchor="middle" class="f-mono-sm">helper access token — minted once</text>
  <text x="166" y="344" text-anchor="middle" class="f-tiny">a key to the helper, never to the account</text>

  <!-- socket seam -->
  <line x1="352" y1="34" x2="352" y2="364" stroke="#b04a4a" stroke-width="2" stroke-dasharray="7 4"/>
  <rect x="322" y="164" width="60" height="30" rx="5" fill="#fff" stroke="#b04a4a" stroke-width="1.3"/>
  <text x="352" y="177" text-anchor="middle" class="f-tiny">unix socket</text>
  <text x="352" y="189" text-anchor="middle" class="f-mono-sm">0600</text>
  <text x="352" y="26" text-anchor="middle" class="f-edge" fill="#b04a4a">no TCP port exists</text>

  <path d="M296 179 L322 179" fill="none" stroke="#5b6472" stroke-width="1.5" marker-end="url(#f10-a)"/>
  <path d="M382 179 L408 179" fill="none" stroke="#5b6472" stroke-width="1.5" marker-end="url(#f10-a)"/>
  <rect x="300" y="200" width="104" height="56" fill="#fff"/>
  <text x="352" y="212" text-anchor="middle" class="f-edge-alt">ceiling holds</text>
  <text x="352" y="225" text-anchor="middle" class="f-mono-sm">*.sidecar.localhost</text>
  <text x="352" y="238" text-anchor="middle" class="f-tiny">an identity,</text>
  <text x="352" y="250" text-anchor="middle" class="f-tiny">never dialled</text>

  <!-- helper -->
  <rect x="412" y="34" width="292" height="330" rx="10" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.6"/>
  <text x="428" y="56" class="f-title">Helper process (LLM-free)</text>
  <text x="428" y="72" class="f-tiny">transport + custody, never a second brain</text>

  <rect x="432" y="84" width="252" height="64" rx="7" fill="#fff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="558" y="103" text-anchor="middle" class="f-label">Closed route table</text>
  <text x="558" y="117" text-anchor="middle" class="f-tiny">method-pinned · app subset DERIVED, never retyped</text>
  <text x="558" y="129" text-anchor="middle" class="f-tiny">pairing routes wizard-only, guarded by a spawn nonce</text>
  <text x="558" y="141" text-anchor="middle" class="f-tiny">every route requires a credential — none is open</text>

  <rect x="432" y="164" width="252" height="62" rx="7" fill="#fdf2f2" stroke="#b04a4a" stroke-width="1.3"/>
  <text x="558" y="183" text-anchor="middle" class="f-label" fill="#b04a4a">Device-session key store</text>
  <text x="558" y="197" text-anchor="middle" class="f-tiny">the keys to the user's ACCOUNT — serialized on</text>
  <text x="558" y="209" text-anchor="middle" class="f-tiny">no route: not scrubbed, not redacted — simply</text>
  <text x="558" y="221" text-anchor="middle" class="f-tiny">never in a response in the first place</text>

  <rect x="432" y="242" width="252" height="52" rx="7" fill="#fff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="558" y="261" text-anchor="middle" class="f-label">Event ring — hints only</text>
  <text x="558" y="275" text-anchor="middle" class="f-mono-sm">{jid, kind, ts}</text>
  <text x="558" y="288" text-anchor="middle" class="f-tiny">no bodies, no names — a doorbell, never a delivery</text>

  <rect x="432" y="310" width="252" height="42" rx="7" fill="#fff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="558" y="327" text-anchor="middle" class="f-label">Lifecycle: one writer per session</text>
  <text x="558" y="341" text-anchor="middle" class="f-tiny">stale helper reaped before spawn · graceful-first exit</text>

  <!-- pump loop -->
  <path d="M432 268 C 380 268, 330 268, 296 262" fill="none" stroke="#a8712a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f10-b)"/>
  <rect x="304" y="272" width="116" height="52" fill="#fff"/>
  <text x="362" y="282" text-anchor="middle" class="f-edge-alt">host pump long-polls,</text>
  <text x="362" y="294" text-anchor="middle" class="f-edge-alt">forwards hints (R7);</text>
  <text x="362" y="306" text-anchor="middle" class="f-tiny">the app answers with its</text>
  <text x="362" y="318" text-anchor="middle" class="f-tiny">own governed reads</text>

  <!-- provider -->
  <rect x="412" y="382" width="292" height="34" rx="7" fill="#fff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="558" y="403" text-anchor="middle" class="f-label">Provider network — the linked device session</text>
  <path d="M558 364 L558 378" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#f10-a)"/>

  <!-- consent note -->
  <rect x="16" y="382" width="300" height="34" rx="5" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1"/>
  <text x="166" y="396" text-anchor="middle" class="f-note">Disclosed before linking: provider-ToS risk, and the</text>
  <text x="166" y="409" text-anchor="middle" class="f-note">third-party-consent residual no scrub removes.</text>

  <text x="16" y="440" class="f-note">Compromising everything the host stores yields a key to a helper — not the keys to the user's account.</text>
</svg>
