<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" role="img" aria-label="The connection lifecycle: three proposers write credential-free requirements; only the user's approval writes a grant and freezes the host ceiling; revocation leaves a tombstone">
  <defs>
    <marker id="f8-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="f8-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8712a"/>
    </marker>
    <marker id="f8-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b04a4a"/>
    </marker>
  </defs>

  <!-- proposers -->
  <rect x="16" y="34" width="150" height="34" rx="6" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.2"/>
  <text x="91" y="49" text-anchor="middle" class="f-label">The user</text>
  <text x="91" y="62" text-anchor="middle" class="f-tiny">manual entry</text>

  <rect x="16" y="76" width="150" height="34" rx="6" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.2"/>
  <text x="91" y="91" text-anchor="middle" class="f-label">The builder assistant</text>
  <text x="91" y="104" text-anchor="middle" class="f-tiny">directive · strong review</text>

  <rect x="16" y="118" width="150" height="34" rx="6" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.2"/>
  <text x="91" y="133" text-anchor="middle" class="f-label">The install act</text>
  <text x="91" y="146" text-anchor="middle" class="f-tiny">starter manifest, vouched</text>

  <!-- the excluded proposer -->
  <rect x="16" y="166" width="150" height="34" rx="6" fill="#fdf2f2" stroke="#b04a4a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="91" y="181" text-anchor="middle" class="f-label" fill="#b04a4a">A running app</text>
  <text x="91" y="194" text-anchor="middle" class="f-tiny">no frame exists — ever</text>
  <line x1="30" y1="199" x2="152" y2="169" stroke="#b04a4a" stroke-width="1.6"/>

  <!-- declared -->
  <rect x="216" y="76" width="150" height="76" rx="8" fill="#fff" stroke="#5b6472" stroke-width="1.4"/>
  <text x="291" y="98" text-anchor="middle" class="f-title">Requirement</text>
  <text x="291" y="114" text-anchor="middle" class="f-mono-sm">status: declared</text>
  <text x="291" y="130" text-anchor="middle" class="f-tiny">credential-free · schema-strict</text>
  <text x="291" y="143" text-anchor="middle" class="f-tiny">network calls fail closed</text>

  <path d="M166 51 C 196 54, 196 88, 212 100" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f8-a)"/>
  <path d="M166 93 L212 105" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f8-a)"/>
  <path d="M166 135 C 196 132, 196 120, 212 112" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#f8-a)"/>
  <text x="189" y="76" text-anchor="middle" class="f-edge">declared rows only</text>

  <!-- review + approval -->
  <path d="M366 114 L448 114" fill="none" stroke="#a8712a" stroke-width="1.8" marker-end="url(#f8-b)"/>
  <text x="407" y="102" text-anchor="middle" class="f-edge-alt">verbatim review</text>
  <text x="407" y="128" text-anchor="middle" class="f-tiny">every field, every host,</text>
  <text x="407" y="140" text-anchor="middle" class="f-tiny">templates uncollapsed</text>

  <!-- approved -->
  <rect x="452" y="70" width="160" height="88" rx="8" fill="#fdf7ee" stroke="#a8712a" stroke-width="1.6"/>
  <text x="532" y="92" text-anchor="middle" class="f-title">Grant</text>
  <text x="532" y="108" text-anchor="middle" class="f-mono-sm">status: approved</text>
  <text x="532" y="124" text-anchor="middle" class="f-tiny">allowed_hosts FROZEN at approval</text>
  <text x="532" y="137" text-anchor="middle" class="f-tiny">declared ∪ endpoint ∪ userLayer hosts</text>
  <text x="532" y="150" text-anchor="middle" class="f-tiny">credentials live in snug_secrets only</text>

  <!-- staged edit loop -->
  <path d="M612 84 C 656 84, 656 116, 612 116" fill="none" stroke="#5b6472" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f8-a)"/>
  <rect x="620" y="122" width="96" height="42" fill="#fff"/>
  <text x="668" y="132" text-anchor="middle" class="f-edge">edit stages a pending diff</text>
  <text x="668" y="146" text-anchor="middle" class="f-tiny">old ceiling serves until</text>
  <text x="668" y="158" text-anchor="middle" class="f-tiny">re-approval re-freezes</text>

  <!-- revoke -->
  <path d="M532 158 L532 208" fill="none" stroke="#b04a4a" stroke-width="1.5" marker-end="url(#f8-r)"/>
  <text x="586" y="186" text-anchor="middle" class="f-edge" fill="#b04a4a">revoke</text>

  <rect x="440" y="212" width="184" height="60" rx="8" fill="#fdf2f2" stroke="#b04a4a" stroke-width="1.3"/>
  <text x="532" y="232" text-anchor="middle" class="f-title">Tombstone</text>
  <text x="532" y="248" text-anchor="middle" class="f-mono-sm">status: revoked</text>
  <text x="532" y="263" text-anchor="middle" class="f-tiny">credential slice wiped · row kept · counts against the cap</text>

  <!-- import note -->
  <rect x="216" y="196" width="150" height="76" rx="8" fill="#f5f7fa" stroke="#5b6472" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="291" y="216" text-anchor="middle" class="f-label">Imported file</text>
  <text x="291" y="232" text-anchor="middle" class="f-tiny">byte-identical grant → restored;</text>
  <text x="291" y="245" text-anchor="middle" class="f-tiny">anything else demotes to declared,</text>
  <text x="291" y="258" text-anchor="middle" class="f-tiny">ceiling recomputed, re-review owed</text>
  <path d="M291 196 L291 156" fill="none" stroke="#5b6472" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f8-a)"/>

  <!-- invariant -->
  <rect x="16" y="292" width="688" height="26" rx="4" fill="#fbfbfc" stroke="#c9ced6" stroke-width="1"/>
  <text x="360" y="309" text-anchor="middle" class="f-note">Exactly five writers exist, each the sole author of one transition. Approval is the only writer of grants; no edit widens a ceiling without a human seeing the diff.</text>
</svg>
