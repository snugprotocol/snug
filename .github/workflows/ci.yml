# Snug CI — first workflow in the repo (TASK-20260812-desktop-hub-scaffold, P5).
#
# Three legs:
#   linux    — the whole workspace build + tsc-gated test fan-out (uncached).
#   macos    — Rust unit tests + desktop web build; the in-shell hard gate
#              (AC7/AC8) runs via the shell-gate harness.
#   windows  — the same, proving the WebView2 leg of the hard gate. Desktop is
#              not "first-class" until this leg is green (roadmap A6 vs L6).
#
# High-tier surface (CI config): changes here need the full process gates.
#
# ────────────────────────────────────────────────────────────────────────────
# HISTORY — DORMANT 2026-08-20 → 2026-08-26. Kept because it explains why the local
# gate exists and why it must stay a superset; see the `on:` block for today's state.
#
# GitHub Actions is billing-blocked: since ~2026-08-18 every run failed in ~2 s
# with ZERO steps executed and the annotation "The job was not started because
# recent account payments have failed or your spending limit needs to be
# increased". The owner has decided NOT to restore billing before launch; as the
# solo developer he runs the equivalent locally via `pnpm run gate:local`.
#
# WHY THE TRIGGERS ARE REMOVED RATHER THAN THE FILE. A blocked run renders as an
# ordinary red X on the PR page — indistinguishable from a real break without
# opening the check annotation. That is worse than no gate: it trains the one
# person reading it to merge past reds. Note it never actually BLOCKED anything —
# this repo is private on a free org plan, so branch protection / required status
# checks were never available (the API returns 403 "Upgrade to GitHub Pro").
# The red X was pure noise with no enforcement behind it.
#
# THIS FILE IS STILL LOAD-BEARING. `scripts/gate-local.mjs` derives its leg list
# from the jobs below and a test FAILS if a step here has no local counterpart
# (AC3) — so this stays the contract the local gate is graded against, not dead
# weight. Keeping it also makes restoration a one-line revert.
#
# TO RESTORE — DONE 2026-08-26, recorded because each step resolved differently
# than this list predicted:
#   1. ~~Fix billing~~ — never needed. Going public made Actions free, so the
#      "restore billing first" premise dissolved rather than being satisfied.
#   2. ~~Restore the `on:` block~~ — done, but NOT the one-line revert predicted
#      above: it took fixing what the first live run exposed (PR #141) and putting
#      the Windows leg on hold, because triggers over a red leg would have been
#      worse than dormancy.
#   3. ~~Re-run recent PRs' workflows~~ — superseded. A fresh run on `main` is
#      better evidence than re-running stale ones, and Windows was never going to
#      be machine-verified: it has been unbuildable since TASK-20260820.
# ────────────────────────────────────────────────────────────────────────────

name: ci

# LIVE AGAIN 2026-08-26. The dormancy above is history; here is what actually holds now.
#
# Billing stopped being the constraint the moment the repos went public — public repos get
# unlimited free Actions minutes on standard runners. Confirmed empirically, not assumed:
# a dispatch run on `main` executed its steps instead of dying in ~2 s with zero steps
# (run 32931999710), which is what the billing block looked like.
#
# That same run exposed two real failures the local gate had been absorbing, both now
# fixed rather than waived:
#   - workspace: two CPU-bound suites crossed vitest's 5000 ms default on 4-core shared
#     runners (PR #141 sized them from measurement — they are 12-16x slower there).
#   - windows:   dead since TASK-20260820 removed `icons/icon.ico`; the leg is on hold
#     with Windows desktop itself (see the matrix comment in desktop-shell).
#
# `pull_request` covers outside contributors, which is the reason this matters now that
# the repo is public: their PRs cannot be gated by `gate:local`, a command that only runs
# on the maintainer's Mac. `gate:local` remains the pre-push gate and a proven SUPERSET of
# these steps (AC3 in scripts/gate-local.test.mjs fails if a step here has no local twin).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` — pnpm/action-setup reads `packageManager` in package.json
      # (pnpm@9.0.0) and ERRORS on a second source of truth. Pin the version there.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --force: the turbo cache must never vouch for this gate (lessons 2026-08-10).
      - run: pnpm exec turbo run build --force
      - run: pnpm exec turbo run test --force
      # The threat model is a public security claim, so it is graded like code: every
      # delta pinned by hash (a new or edited one fails until the model is re-read
      # against it), and every enforcement/test path it cites proven to still exist.
      # Cheap and dependency-free — it runs here rather than only on a doc-touching PR.
      - run: pnpm run check-threat-model
      # C2, workspace-wide: the runner's own source guard roots at packages/runner/src and
      # cannot see the app directories where a new iframe is most likely to appear. The
      # whitepaper tells implementers a frame carrying `allow-same-origin` fails the BUILD;
      # this is what makes that claim true across the repo rather than in one package.
      - run: pnpm run check-sandbox-guard

  desktop-shell:
    strategy:
      fail-fast: false
      matrix:
        # macOS ONLY while Windows desktop is on hold (ADR-0021 D8: macOS-only
        # through alpha, beta AND 1.0; Windows reconsidered post-1.0 as its own ADR).
        #
        # WHY THE LEG IS REMOVED RATHER THAN LEFT RED. It stopped being able to tell
        # us anything. ADR-0021 D8 wanted this leg red as live evidence of R-5 — the
        # WebView2 IPC-key leak — via a failing `keyReachable` assertion. But
        # TASK-20260820 deleted `icons/icon.ico` for the macOS-only bundle, so since
        # then the job dies at COMPILE: "`icons/icon.ico` not found; required for
        # generating a Windows Resource file during tauri-build". It never reaches
        # the assertion. A genuine R-5 regression and today's failure look identical,
        # so the red proved nothing and cost a permanent X on every PR — which is
        # precisely the "trains you to merge past reds" failure this file warns about
        # in the block above. Verified on run 32931999710 (2026-08-26).
        #
        # WHAT MUST COME BACK WITH WINDOWS, post-1.0, as ADR-0021 D8's own preconditions
        # already require: restore `windows-latest` here, restore `icon.ico` and the
        # `bundle.targets` entry (pinned by bundleTargets.test.ts, which will fail until
        # you do), then confirm the leg reaches `keyReachable` and reds THERE — plus the
        # separately-unverified `cdp_jwt` native-ECDSA check. Do NOT soften `keyReachable`
        # to make this green; a leg expected to stay red for a year is exactly the kind
        # someone "fixes".
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` — pnpm/action-setup reads `packageManager` in package.json
      # (pnpm@9.0.0) and ERRORS on a second source of truth. Pin the version there.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # `apps/server` pulls better-sqlite3, a native module that needs a Visual
      # Studio toolchain the windows runner image does not ship — node-gyp fails
      # the whole install. The desktop shell never loads it (it is BYOK/local and
      # uses sql.js/WASM), so filter the install to the desktop graph instead of
      # installing a dependency this job cannot build and does not use.
      - run: pnpm install --frozen-lockfile --filter desktop...
      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # Build BEFORE the tsc-gated tests: the desktop app resolves its workspace
      # deps through their built `dist/` (`"main": "dist/index.js"`), so on a
      # clean runner `tsc` cannot see @snugprotocol/* until this runs. Locally
      # the dists already exist, which is exactly why this ordering looked fine.
      - name: Build workspace deps + desktop web bundle
        run: pnpm exec turbo run build --filter=desktop --force
      - name: Desktop package tests (tsc-gated)
        run: pnpm --filter desktop test
      - name: In-shell hard gate (C2 CSP+IPC checks + wizard journey)
        # Always rebuild the bundle in CI: the driver otherwise reuses whatever
        # dist/ is present, which is a false-green trap when the gate is meant
        # to grade THIS commit's UI.
        env:
          SNUG_GATE_REBUILD_WEB: '1'
        run: pnpm --filter desktop gate
      # P0 amendment 4's release-inertness claim, PROVEN rather than journaled:
      # the gate commands + SNUG_SHELL_GATE must be present in the debug binary
      # (positive control — without it a broken scan passes) and absent from the
      # release binary. Separate from `gate` because a release build is slow.
      - name: Release inertness (gate surface absent from the shipped binary)
        run: pnpm --filter desktop gate:release
