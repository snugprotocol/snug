# Snug CI — first workflow in the repo (TASK-20260812-desktop-hub-scaffold, P5).
#
# Three legs:
#   linux    — the whole workspace build + tsc-gated test fan-out (uncached).
#   macos    — Rust unit tests + desktop web build; the in-shell hard gate
#              (AC7/AC8) runs via the shell-gate harness.
#   windows  — the same, proving the WebView2 leg of the hard gate. Desktop is
#              not "first-class" until this leg is green (roadmap A6 vs L6).
#
# High-tier surface (CI config): changes here need the full process gates.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` — pnpm/action-setup reads `packageManager` in package.json
      # (pnpm@9.0.0) and ERRORS on a second source of truth. Pin the version there.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --force: the turbo cache must never vouch for this gate (lessons 2026-08-10).
      - run: pnpm exec turbo run build --force
      - run: pnpm exec turbo run test --force
      # The threat model is a public security claim, so it is graded like code: every
      # delta pinned by hash (a new or edited one fails until the model is re-read
      # against it), and every enforcement/test path it cites proven to still exist.
      # Cheap and dependency-free — it runs here rather than only on a doc-touching PR.
      - run: pnpm run check-threat-model
      # C2, workspace-wide: the runner's own source guard roots at packages/runner/src and
      # cannot see the app directories where a new iframe is most likely to appear. The
      # whitepaper tells implementers a frame carrying `allow-same-origin` fails the BUILD;
      # this is what makes that claim true across the repo rather than in one package.
      - run: pnpm run check-sandbox-guard

  desktop-shell:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` — pnpm/action-setup reads `packageManager` in package.json
      # (pnpm@9.0.0) and ERRORS on a second source of truth. Pin the version there.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # `apps/server` pulls better-sqlite3, a native module that needs a Visual
      # Studio toolchain the windows runner image does not ship — node-gyp fails
      # the whole install. The desktop shell never loads it (it is BYOK/local and
      # uses sql.js/WASM), so filter the install to the desktop graph instead of
      # installing a dependency this job cannot build and does not use.
      - run: pnpm install --frozen-lockfile --filter desktop...
      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # Build BEFORE the tsc-gated tests: the desktop app resolves its workspace
      # deps through their built `dist/` (`"main": "dist/index.js"`), so on a
      # clean runner `tsc` cannot see @snugprotocol/* until this runs. Locally
      # the dists already exist, which is exactly why this ordering looked fine.
      - name: Build workspace deps + desktop web bundle
        run: pnpm exec turbo run build --filter=desktop --force
      - name: Desktop package tests (tsc-gated)
        run: pnpm --filter desktop test
      - name: In-shell hard gate (C2 CSP+IPC checks + wizard journey)
        # Always rebuild the bundle in CI: the driver otherwise reuses whatever
        # dist/ is present, which is a false-green trap when the gate is meant
        # to grade THIS commit's UI.
        env:
          SNUG_GATE_REBUILD_WEB: '1'
        run: pnpm --filter desktop gate
      # P0 amendment 4's release-inertness claim, PROVEN rather than journaled:
      # the gate commands + SNUG_SHELL_GATE must be present in the debug binary
      # (positive control — without it a broken scan passes) and absent from the
      # release binary. Separate from `gate` because a release build is slow.
      - name: Release inertness (gate surface absent from the shipped binary)
        run: pnpm --filter desktop gate:release
