          const local = await db.exec('SELECT id, author, text, ts, from_me FROM messages WHERE jid = ? ORDER BY ts ASC', [jid]);
          if (cancelled) return;
          const stored = local.rows.map((row) => ({ id: row[0], from: row[1], text: row[2], ts: row[3], fromMe: row[4] === 1 }));
          // The freshest picture: whatever the open thread already holds, merged in.
          setRows(mergeMessages(stored, messages));
        })().catch(() => setRows([]));
        return () => { cancelled = true; };
      }, [schemaReady, jid, db, messages]);

      const model = useMemo(() => {
        if (!rows || rows.length === 0) return null;
        const offset = -new Date().getTimezoneOffset() * -1; // minutes EAST of utc
        const tzOffset = -new Date().getTimezoneOffset();
        const stats = statsByParticipant(rows);
        const top = stats.slice(0, 5);
        const rest = stats.slice(5);
        const buckets = activityBuckets(rows, tzOffset);
        const responses = responseStats(rows).slice(0, 8);
        const emoji = emojiFrequency(rows).slice(0, 8);
        const months = messagesByMonth(rows);
        return { stats, top, rest, buckets, responses, emoji, months, total: rows.length, offset };
      }, [rows]);

      const doughnutRef = useRef(null);
      const hoursRef = useRef(null);
      const weekdayRef = useRef(null);
      const responseRef = useRef(null);
      const emojiRef = useRef(null);
      const trendRef = useRef(null);

      const labelFor = (author, fromMeAuthors) => displayName(author, rows && rows.some((r) => r.from === author && r.fromMe));

      // Fixed slot order (never cycled): top participants take slots 1..5, the fold is gray.
      useChart(doughnutRef, () => model && {
        type: 'doughnut',
        data: {
          labels: model.top.map((s) => labelFor(s.author)).concat(model.rest.length > 0 ? ['Other'] : []),
          datasets: [{
            data: model.top.map((s) => s.count).concat(model.rest.length > 0 ? [model.rest.reduce((a, s) => a + s.count, 0)] : []),
            backgroundColor: model.top.map((_, i) => seriesColor(i + 1)).concat(model.rest.length > 0 ? [otherColor()] : []),
            borderWidth: 2,
            borderColor: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim(),
          }],
        },
        options: {
          maintainAspectRatio: false, cutout: '55%',
          plugins: { legend: { position: 'right', labels: { color: inkSoft(), boxWidth: 12 } } },
        },
      }, [model, theme]);

      useChart(hoursRef, () => {
        if (!model) return null;
        const topAuthors = model.top.slice(0, 3);
        return {
          type: 'line',
          data: {
            labels: Array.from({ length: 24 }, (_, h) => `${h}:00`),
            datasets: [
              { label: 'everyone', data: model.buckets.hours, borderColor: inkSoft(), backgroundColor: 'transparent', borderWidth: 2, pointRadius: 0, tension: 0.3 },
              ...topAuthors.map((s, i) => ({
                label: labelFor(s.author),
                data: (model.buckets.perAuthor.get(s.author) || { hours: [] }).hours,
                borderColor: seriesColor(i + 1), backgroundColor: 'transparent', borderWidth: 2, pointRadius: 0, tension: 0.3,
              })),
            ],
          },
          options: {
            maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
            plugins: { legend: { labels: { color: inkSoft(), boxWidth: 12 } } },
            scales: {
              x: { ticks: { color: inkSoft(), maxTicksLimit: 8 }, grid: { color: gridColor() } },
              y: { ticks: { color: inkSoft() }, grid: { color: gridColor() }, beginAtZero: true },
            },
          },
        };
      }, [model, theme]);

      useChart(weekdayRef, () => model && {
        type: 'bar',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
          datasets: [{ label: 'messages', data: model.buckets.weekdays, backgroundColor: seriesColor(1), borderRadius: 4, maxBarThickness: 34 }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: inkSoft() }, grid: { display: false } },
            y: { ticks: { color: inkSoft() }, grid: { color: gridColor() }, beginAtZero: true },
          },
        },
      }, [model, theme]);

      useChart(responseRef, () => model && model.responses.length > 0 && {
        type: 'bar',
        data: {
          labels: model.responses.map((s) => labelFor(s.author)),
          datasets: [{ label: 'median minutes to respond', data: model.responses.map((s) => s.medianMinutes), backgroundColor: seriesColor(3), borderRadius: 4, maxBarThickness: 22 }],
        },
        options: {
          indexAxis: 'y', maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: inkSoft() }, grid: { color: gridColor() }, beginAtZero: true },
            y: { ticks: { color: inkSoft() }, grid: { display: false } },
          },
        },
      }, [model, theme]);

      useChart(emojiRef, () => model && model.emoji.length > 0 && {
        type: 'bar',
        data: {
          labels: model.emoji.map((e) => e.emoji),
          datasets: [{ label: 'your emoji', data: model.emoji.map((e) => e.count), backgroundColor: seriesColor(5), borderRadius: 4, maxBarThickness: 26 }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: inkSoft(), font: { size: 16 } }, grid: { display: false } },
            y: { ticks: { color: inkSoft() }, grid: { color: gridColor() }, beginAtZero: true },
          },
        },
      }, [model, theme]);

      useChart(trendRef, () => model && model.months.length > 1 && {
        type: 'line',
        data: {
          labels: model.months.map((m) => m.month),
          datasets: [{ label: 'messages per month', data: model.months.map((m) => m.count), borderColor: seriesColor(1), backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, tension: 0.25 }],
        },
        options: {
          maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: inkSoft(), maxTicksLimit: 10 }, grid: { color: gridColor() } },
            y: { ticks: { color: inkSoft() }, grid: { color: gridColor() }, beginAtZero: true },
          },
        },
      }, [model, theme]);

      if (!model) {
        return <div className="tab-scroll"><div className="center-state"><div className="big">📊</div><div>open the chat first — charts draw from the messages this app has seen</div></div></div>;
      }

      return (
        <div className="tab-scroll">
          <div className="panel">
            <h3>who carries the conversation</h3>
            <p className="hint">{model.total.toLocaleString()} messages counted locally — nothing here left your machine</p>
            <div className="chart-box"><canvas ref={doughnutRef} role="img" aria-label="share of messages per participant" /></div>
            <button className="linklike" onClick={() => setShowNumbers((v) => !v)}>{showNumbers ? 'hide the numbers' : 'show the numbers'}</button>
            {showNumbers && (
              <table className="num-table">
                <thead><tr><th>who</th><th className="n">messages</th><th className="n">share</th></tr></thead>
                <tbody>
                  {model.stats.map((s) => (
                    <tr key={s.author}><td>{labelFor(s.author)}</td><td className="n">{s.count}</td><td className="n">{(s.share * 100).toFixed(1)}%</td></tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
          <div className="panel">
            <h3>when this chat is alive</h3>
            <p className="hint">messages by hour of day, in your timezone — everyone, plus the three most active voices</p>
            <div className="chart-box tall"><canvas ref={hoursRef} role="img" aria-label="messages by hour of day" /></div>
          </div>
          <div className="panel">
            <h3>the week's rhythm</h3>
            <div className="chart-box"><canvas ref={weekdayRef} role="img" aria-label="messages by weekday" /></div>
          </div>
          {model.responses.length > 0 && (
            <div className="panel">
              <h3>who answers fastest</h3>
              <p className="hint">median minutes from someone else's message to this person's reply (same-day replies only)</p>
              <div className="chart-box"><canvas ref={responseRef} role="img" aria-label="median response minutes per participant" /></div>
            </div>
          )}
          {model.emoji.length > 0 && (
            <div className="panel">
              <h3>your emoji signature</h3>
              <div className="chart-box"><canvas ref={emojiRef} role="img" aria-label="your most used emoji" /></div>
            </div>
          )}
          {model.months.length > 1 && (
            <div className="panel">
              <h3>the long arc</h3>
              <div className="chart-box"><canvas ref={trendRef} role="img" aria-label="messages per month over time" /></div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
