<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Twin</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f4;
      --surface: #ffffff;
      --surface-2: #eef2ee;
      --ink: #101a12;
      --ink-soft: #5a6b5e;
      --line: #d8e0d9;
      --accent: #1f8a5c;
      --accent-soft: #e3f3ea;
      --warn: #9a5a12;
      --warn-soft: #fdf1de;
      --danger: #a32b28;
      --danger-soft: #fbe9e8;
      --me: #d7f2e2;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16, 26, 18, 0.06), 0 8px 24px rgba(16, 26, 18, 0.05);
    }
    :root[data-theme="dark"] {
      --bg: #0e1411;
      --surface: #161d19;
      --surface-2: #1d2622;
      --ink: #e8efe9;
      --ink-soft: #9aa89e;
      --line: #2a352f;
      --accent: #4ecb8d;
      --accent-soft: #163023;
      --warn: #e8b871;
      --warn-soft: #33280f;
      --danger: #f08e8a;
      --danger-soft: #3a1c1b;
      --me: #1c3a2b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 940px; margin: 0 auto; padding: 20px 16px 64px; }
    .topbar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .topbar h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
    .topbar .sub { color: var(--ink-soft); font-size: 13px; }
    .connecting { padding: 48px 16px; text-align: center; color: var(--ink-soft); }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 16px; }
    .tab {
      min-width: 44px; min-height: 44px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--ink-soft);
      font: inherit; font-size: 13px; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .surface { display: grid; gap: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .panel h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: -0.01em; }
    .panel .hint { margin: 0 0 12px; color: var(--ink-soft); font-size: 13px; }

    button { min-width: 44px; min-height: 44px; font: inherit; cursor: pointer; }
    .btn {
      padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface-2); color: var(--ink);
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.danger { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.small { min-height: 34px; padding: 0 10px; font-size: 13px; }

    input[type="text"], input[type="search"], textarea, select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit;
    }
    textarea { min-height: 84px; resize: vertical; }
    label.field { display: block; margin-bottom: 10px; }
    label.field span { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

    .notice { border-radius: 10px; padding: 10px 12px; font-size: 13px; border: 1px solid; }
    .notice.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
    .notice.danger { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .notice.info { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .threads { display: grid; gap: 8px; }
    .thread {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      width: 100%; text-align: left; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink);
    }
    .thread[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .thread .name { font-weight: 600; font-size: 14px; }
    .thread .meta { color: var(--ink-soft); font-size: 12px; }

    .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }
    .chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .chip.off { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

    .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface-2); }
    .card h3 { margin: 0 0 6px; font-size: 13px; }
    .card p { margin: 0; font-size: 13px; color: var(--ink-soft); }
    .traits { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

    .stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .stat:last-child { border-bottom: 0; }
    .stat .v { font-weight: 600; }

    .msgs { display: grid; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
    .msg { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--surface-2); }
    .msg.mine { background: var(--me); }
    .msg .who { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; display: flex; justify-content: space-between; gap: 8px; }
    .msg .body { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg .translated { margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; }

    .skeleton { height: 14px; border-radius: 6px; background: var(--surface-2); margin: 7px 0; }
    .journal { display: grid; gap: 6px; font-size: 12px; }
    .journal .entry { border-left: 3px solid var(--accent); padding: 5px 9px; background: var(--surface-2); border-radius: 0 8px 8px 0; }
    .empty { color: var(--ink-soft); font-size: 13px; padding: 8px 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ============================================================
    // 1. SNUG BRIDGE RUNTIME (MANDATORY — copy exactly, never edit)
    // ============================================================
    const SnugBridge = {
      instanceId: null,
      theme: 'light',
      capabilities: {},
      ready: false,
      pending: new Map(),    // requestId -> { resolve, onStream }
      dbPending: new Map(),  // requestId -> resolve
      netPending: new Map(), // requestId -> resolve
      listeners: new Set(),  // re-render triggers for hooks

      post(frame) {
        window.parent.postMessage({ v: 1, instanceId: this.instanceId, ...frame }, '*');
      },
      notify() { for (const fn of this.listeners) fn(); },
    };

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.v !== 1) return;

      if (data.type === 'snug:host-ready') {
        SnugBridge.instanceId = data.instanceId;
        if (data.theme) SnugBridge.theme = data.theme;
        if (data.capabilities) SnugBridge.capabilities = data.capabilities;
        SnugBridge.ready = true;
        SnugBridge.notify();
        return;
      }

      if (data.type === 'snug:app-response') {
        const entry = SnugBridge.pending.get(data.requestId);
        if (!entry) return; // unknown or superseded requestId — ignore
        if (data.streaming) {
          // Cumulative provisional text — display only. NEVER resolve here.
          if (entry.onStream && typeof data.text === 'string') entry.onStream(data.text);
          return;
        }
        SnugBridge.pending.delete(data.requestId); // terminal — exactly one per requestId
        entry.resolve(data.ok ? { ok: true, data: data.data } : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:db-response') {
        const resolve = SnugBridge.dbPending.get(data.requestId);
        if (!resolve) return;
        SnugBridge.dbPending.delete(data.requestId);
        // Result fields (rows/columns/value/bytesBase64) live at the TOP LEVEL of the frame.
        resolve(data.ok
          ? { ok: true, rows: data.rows, columns: data.columns, value: data.value, bytesBase64: data.bytesBase64 }
          : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:net-response') {
        const resolve = SnugBridge.netPending.get(data.requestId);
        if (!resolve) return;
        SnugBridge.netPending.delete(data.requestId);
        // Result fields (status/headers/body/truncated) live at the TOP LEVEL of the frame.
        resolve(data.ok
          ? { ok: true, status: data.status, headers: data.headers, body: data.body, truncated: data.truncated }
          : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:host-event') {
        if (data.event === 'theme-change' && data.data && data.data.theme) {
          SnugBridge.theme = data.data.theme;
          SnugBridge.notify();
        }
        // Unknown host events MUST be ignored (the protocol is additive).
      }
    });

    function snugDbRequest(op, args) {
      return new Promise((resolve) => {
        const requestId = crypto.randomUUID();
        SnugBridge.dbPending.set(requestId, resolve);
        SnugBridge.post({ type: 'snug:db-request', requestId, op, ...args });
      });
    }

    function snugNetRequest(fields) {
      if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
      return new Promise((resolve) => {
        const requestId = crypto.randomUUID();
        SnugBridge.netPending.set(requestId, resolve);
        SnugBridge.post({ type: 'snug:net-request', requestId, ...fields });
      });
    }

    // ============================================================
    // 2. useSnugApp (MANDATORY — copy exactly, never edit)
    // ============================================================
    function useSnugApp(meta) {
      const [, setTick] = useState(0);
      const [isWaiting, setIsWaiting] = useState(false);
      const [lastResponse, setLastResponse] = useState(null);
      const inFlight = useRef(0);
      const metaRef = useRef(meta);

      useEffect(() => {
        const rerender = () => setTick((n) => n + 1);
        SnugBridge.listeners.add(rerender);
        const m = metaRef.current;
        SnugBridge.post({
          type: 'snug:app-announce',
          appId: m.appId,
          displayName: m.displayName,
          description: m.description,
          iconEmoji: m.iconEmoji,
          iconColor: m.iconColor,
        });
        return () => SnugBridge.listeners.delete(rerender);
      }, []);

      const sendMessage = useCallback((action, payload, opts) => {
        if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
        const requestId = crypto.randomUUID(); // fresh per request — multiple in flight are legal
        inFlight.current += 1;
        setIsWaiting(true);
        return new Promise((resolve) => {
          SnugBridge.pending.set(requestId, {
            onStream: opts && opts.onStream,
            resolve: (result) => {
              inFlight.current -= 1;
              if (inFlight.current === 0) setIsWaiting(false);
              setLastResponse(result);
              resolve(result);
            },
          });
          SnugBridge.post({
            type: 'snug:app-message',
            requestId,
            appId: metaRef.current.appId,
            action,
            payload,
            state: opts && opts.state,
            responseSchema: opts && opts.responseSchema,
          });
        });
      }, []);

      return {
        isReady: SnugBridge.ready,
        theme: SnugBridge.theme,
        isWaiting,
        lastResponse,
        sendMessage,
      };
    }

    // ============================================================
    // 3. usePersistedState (MANDATORY — copy exactly, never edit)
    // Storage is HOST-BROKERED key-value. The sandboxed iframe has a
    // null origin: no browser storage API works here.
    // ============================================================
    function usePersistedState(key, initialValue) {
      const [state, setState] = useState(initialValue);
      // Tracks WHICH key hydrated: a key change must re-hydrate before any write-back,
      // or the old key's state would overwrite the new key's stored value.
      const [hydratedKey, setHydratedKey] = useState(null);
      const initialRef = useRef(initialValue);

      useEffect(() => {
        let cancelled = false;
        const hydrate = async () => {
          const result = await snugDbRequest('kvGet', { key });
          if (cancelled) return;
          if (result.ok && result.value != null) {
            const stored = result.value;
            const init = initialRef.current;
            // Merge objects with defaults so fields added in newer code are never undefined.
            setState(
              stored && typeof stored === 'object' && !Array.isArray(stored) &&
              init && typeof init === 'object' && !Array.isArray(init)
                ? { ...init, ...stored }
                : stored
            );
          } else {
            setState(initialRef.current); // nothing stored under this key — back to defaults
          }
          setHydratedKey(key);
        };
        const onReady = () => {
          if (!SnugBridge.ready) return;
          SnugBridge.listeners.delete(onReady);
          hydrate();
        };
        if (SnugBridge.ready) hydrate();
        else SnugBridge.listeners.add(onReady);
        return () => { cancelled = true; SnugBridge.listeners.delete(onReady); };
      }, [key]);

      useEffect(() => {
        if (hydratedKey !== key) return;
        snugDbRequest('kvSet', { key, value: state }); // fire-and-forget; host acks via db-response
      }, [hydratedKey, key, state]);

      return [state, setState];
    }

    // ============================================================
    // 4. useAppDB (copy exactly when the app needs SQL; omit otherwise)
    // ============================================================
    function useAppDB() {
      return useMemo(() => ({
        async exec(sql, params) {
          const result = await snugDbRequest('exec', { sql, params });
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db exec failed');
          return { rows: result.rows, columns: result.columns }; // { rows: unknown[][], columns: string[] }
        },
        async exportDb() {
          const result = await snugDbRequest('export', {});
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db export failed');
          return result.bytesBase64;
        },
        async importDb(bytesBase64) {
          const result = await snugDbRequest('import', { bytesBase64 });
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db import failed');
        },
      }), []);
    }

    // ============================================================
    // 5. useConnectedFetch (copy exactly when the app calls an approved API; omit otherwise)
    // The sandboxed app has NO network of its own. This reaches ONLY your app's APPROVED
    // hosts THROUGH the host, which injects your saved credentials, caps sizes, asks you
    // before any write, and scrubs the response. You never see a token.
    // A connection whose host only the USER knows (a device on their network): address it as
    // snug-connection://<slot>/<path> — the host resolves the approved address; you never learn it.
    // ALWAYS resolves: { ok:true, status, headers, body } or { ok:false, error }.
    // ============================================================
    function useConnectedFetch() {
      return useMemo(() => ({
        fetch(url, opts) {
          return snugNetRequest({
            url,
            method: (opts && opts.method) || 'GET',
            headers: opts && opts.headers,
            body: opts && opts.body,
          });
        },
      }), []);
    }

    // ============================================================
    // 5. RESPONSE SCHEMA — describe the JSON the agent must return
    // ============================================================
    // Four actions share one schema object: the model is told which shape to use by the action
    // it was called with, and every reply is validated locally before it touches state. A model
    // reply is untrusted input — here more than usual, because a "profile" is about real people.
    const RESPONSE_SCHEMA = {
      kind: "string: 'profile' | 'answer' | 'draft' | 'translation' — which action you are answering",
      people: [
        {
          label: "string: EXACTLY one of the labels from state.messages (P1, P2, … or YOU) — never a real name",
          summary: 'string: two or three sentences on how this person shows up in the thread',
          traits: ['string: two to five short observed habits, e.g. "answers within minutes"'],
        },
      ],
      dynamics: "string: (kind 'profile') how the group relates — who leads, who jokes, who goes quiet",
      voice: {
        tone: "string: (kind 'profile') how YOU write — register, warmth, formality",
        typicalLength: "string: 'short' | 'medium' | 'long'",
        emoji: ['string: emoji YOU actually use, most frequent first (may be empty)'],
        language: 'string: the language YOU usually reply in for this thread, e.g. "English"',
      },
      message: "string: (kind 'answer') the answer, grounded ONLY in the rows you were given",
      text: "string: (kind 'draft') the reply written AS the user; (kind 'translation') the translated text",
      language: "string: (kind 'draft') the language you wrote the draft in",
    };

    // ===== ANALYSIS-CORE-BEGIN =====
    // Extracted and tested directly by `examples/whatsapp-analysis.test.mjs`. Everything between
    // these markers is pure: no React, no bridge, no host. Two functions carry consequences that
    // no UI test would catch, so they are exercised against hostile fixtures instead.

    /**
     * WhatsApp export line shapes, as WhatsApp actually writes them.
     *
     * Anchored at the START of a line and required to end in the `Author: ` separator, because
     * the ONLY reliable way to tell a new message from a continuation line is a well-formed
     * header — a body line can contain anything, including something timestamp-shaped.
     *
     * `[\u200e\u200f\u202a-\u202e]*` leads every pattern: WhatsApp's iOS export writes bidi
     * control characters before the bracket and a narrow no-break space (U+202F) before AM/PM.
     * They are invisible in every editor, so a parser anchored on a literal '[' silently matches
     * NOTHING and reports an empty export — the user sees "no messages" and never learns why.
     */
    var BIDI = '[\\u200e\\u200f\\u202a-\\u202e\\u2066-\\u2069]*';
    var DATE = '\\d{1,4}[./-]\\d{1,2}[./-]\\d{2,4}';
    var TIME = '\\d{1,2}:\\d{2}(?::\\d{2})?(?:[\\s\\u202f\\u00a0]*[APap]\\.?[Mm]\\.?)?';
    // iOS: [12/03/2025, 21:04:11] Author: body      Android: 12/03/2025, 21:04 - Author: body
    var EXPORT_HEADERS = [
      new RegExp('^' + BIDI + '\\[(' + DATE + '),\\s*(' + TIME + ')\\]' + BIDI + '\\s*([^:]{1,80}):\\s?([\\s\\S]*)$'),
      new RegExp('^' + BIDI + '(' + DATE + '),\\s*(' + TIME + ')\\s+-\\s+([^:]{1,80}):\\s?([\\s\\S]*)$'),
    ];

    /**
     * Lines WhatsApp writes that are NOT messages. Counting these as messages would inflate
     * every per-person statistic and put words in someone's mouth that they never typed.
     */
    var SYSTEM_MARKERS = [
      /end-to-end encrypted/i,
      /^\s*Messages and calls are/i,
      /created group/i,
      /added you$/i,
      /joined using this group's invite link/i,
      /changed the subject to/i,
      /changed this group's icon/i,
      /left$/i,
      /removed /i,
      /security code changed/i,
      /You deleted this message/i,
      /^\s*This message was deleted\s*$/i,
      /<Media omitted>/i,
      /image omitted|video omitted|audio omitted|sticker omitted|document omitted|GIF omitted/i,
      /^\s*null\s*$/i,
    ];

    var isSystemLine = function (text) {
      for (var i = 0; i < SYSTEM_MARKERS.length; i += 1) if (SYSTEM_MARKERS[i].test(text)) return true;
      return false;
    };

    /**
     * Parse a WhatsApp `Export chat` .txt into messages.
     *
     * THE RELIABILITY BACKSTOP. History sync is pushed by WhatsApp in chunks and its completion
     * is sometimes only INFERRED (see `WaHistoryState.explicit`), so a full analysis must remain
     * possible when sync stalls. This path is how that happens — it is not a nice-to-have.
     *
     * Never throws: the user WILL upload the wrong file eventually, and an exception here would
     * take the whole app down instead of saying "that doesn't look like an export".
     */
    function parseWhatsAppExport(raw) {
      var out = { messages: [], authors: new Set(), systemLines: 0, skipped: 0, unparsedLines: 0 };
      if (typeof raw !== 'string' || raw.length === 0) return out;
      var lines = raw.split(/\r?\n/);
      var current = null;

      // A completed message is only pushed once we know no more continuation lines follow.
      var flush = function () {
        if (current === null) return;
        var text = current.text.replace(/\s+$/, '');
        if (text.length === 0 || isSystemLine(text)) {
          out.skipped += 1;
        } else {
          out.messages.push({
            author: current.author,
            // An export line carries a DISPLAY NAME and nothing else. Inventing a JID here would
            // let two different people who share a display name merge into one profile — one
            // person's words, and psychology, attributed to another.
            authorJid: undefined,
            source: 'export',
            text: text,
            ts: current.ts,
          });
          out.authors.add(current.author);
        }
        current = null;
      };

      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i];
        var matched = null;
        for (var p = 0; p < EXPORT_HEADERS.length && matched === null; p += 1) matched = EXPORT_HEADERS[p].exec(line);

        if (matched !== null) {
          flush();
          var author = matched[3].trim();
          var body = matched[4];
          if (isSystemLine(line) && author.length === 0) { out.systemLines += 1; continue; }
          current = { author: author, text: body, ts: parseExportStamp(matched[1], matched[2]) };
          continue;
        }

        if (current !== null) {
          // A continuation line. Attaching it to its parent is what keeps one multiline message
          // from becoming four, which would silently multiply this person's message count.
          current.text += '\n' + line;
          continue;
        }

        if (line.trim().length === 0) continue;
        if (isSystemLine(line)) { out.systemLines += 1; continue; }
        out.unparsedLines += 1;
      }
      flush();

      // A header line whose whole body is a system notice ("Messages and calls are…") parses as
      // a message with a system author; count it honestly rather than dropping it silently.
      var kept = [];
      for (var m = 0; m < out.messages.length; m += 1) {
        if (isSystemLine(out.messages[m].text)) { out.systemLines += 1; continue; }
        kept.push(out.messages[m]);
      }
      if (kept.length !== out.messages.length) {
        out.authors = new Set(kept.map(function (msg) { return msg.author; }));
      }
      out.messages = kept;
      return out;
    }

    /** Best-effort timestamp. An unparseable stamp yields 0 rather than NaN poisoning every sort. */
    function parseExportStamp(date, time) {
      try {
        var parts = String(date).split(/[./-]/);
        if (parts.length !== 3) return 0;
        var a = parseInt(parts[0], 10);
        var b = parseInt(parts[1], 10);
        var c = parseInt(parts[2], 10);
        if (!isFinite(a) || !isFinite(b) || !isFinite(c)) return 0;
        var year = c < 100 ? 2000 + c : c;
        var day = a;
        var month = b;
        // A first field above 12 can only be a day; otherwise assume the export's own locale is
        // day-first, which is WhatsApp's default outside the US. Only ordering depends on this.
        if (a > 12 && b <= 12) { day = a; month = b; } else if (b > 12) { day = b; month = a; }
        var t = String(time).toLowerCase();
        var hm = /(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(t);
        if (hm === null) return 0;
        var hour = parseInt(hm[1], 10);
        var min = parseInt(hm[2], 10);
        var sec = hm[3] ? parseInt(hm[3], 10) : 0;
        if (/p\.?m/.test(t) && hour < 12) hour += 12;
        if (/a\.?m/.test(t) && hour === 12) hour = 0;
        var ms = Date.UTC(year, month - 1, day, hour, min, sec);
        return isFinite(ms) ? Math.floor(ms / 1000) : 0;
      } catch (e) {
        return 0;
      }
    }

    /**
     * Anything that identifies a real human being, as a pattern.
     *
     * Phone numbers are matched on the PRIMITIVE — a run of digits long enough to be dialable,
     * however it is spaced, dotted, dashed or bracketed — rather than on one spelling. The
     * attacker here is not adversarial, it is FORMATTING: '+91 98765 43210', '+919876543210'
     * and '(555) 123-4567' are the same fact, and a scrub that catches one spelling and misses
     * the others has not protected anybody (lessons.md 2026-08-11: neutralize the primitive).
     */
    var JID_PATTERN = /\b[\w.-]+@(?:s\.whatsapp\.net|g\.us|c\.us|lid|broadcast)\b/gi;
    var PHONE_PATTERN = /\+?\d[\d\s().\u00a0-]{6,}\d/g;

    /**
     * Build the stable per-thread pseudonym map: real identity -> label.
     *
     * STABLE because the model is asked to reason about relationships ("who answers whom"), and
     * labels that shuffled between turns would make that impossible AND leak information as the
     * same person appeared under new names. Sorted, so the order the messages happened to arrive
     * in cannot change anybody's label.
     */
    function buildPseudonymMap(parsed) {
      var map = new Map();
      var authors = [];
      var seen = new Set();
      var list = (parsed && parsed.messages) || [];
      for (var i = 0; i < list.length; i += 1) {
        var msg = list[i];
        var identity = msg.authorJid || msg.author;
        if (identity === undefined || identity === null) continue;
        if (msg.fromMe === true) { map.set(identity, 'YOU'); seen.add(identity); continue; }
        if (!seen.has(identity)) { seen.add(identity); authors.push(identity); }
      }
      authors.sort();
      var n = 0;
      for (var a = 0; a < authors.length; a += 1) {
        if (map.has(authors[a])) continue;
        n += 1;
        map.set(authors[a], 'P' + n);
      }
      return map;
    }

    /**
     * THE NEW-READER SCRUB (AC12 / blocker B4).
     *
     * Twin sends other people's private messages to a third-party model provider under the
     * user's own key. Those people never consented and are not Snug users. `scrubAuthValues`
     * does not help: it scrubs injected CREDENTIALS on the way INTO the iframe — a different
     * reader, at a different altitude. So the scrub is re-derived here for THIS reader.
     *
     * Applied to the BODY as well as the author seat, because a phone number shared in a message
     * is the common case and scrubbing only the author field would protect nothing that matters.
     */
    function pseudonymizeForLlm(messages, map) {
      var list = messages || [];
      var out = [];
      for (var i = 0; i < list.length; i += 1) {
        var msg = list[i];
        var identity = msg.authorJid || msg.author;
        var label = map.get(identity);
        if (label === undefined) label = msg.fromMe === true ? 'YOU' : 'P?';
        out.push({
          author: label,
          text: redactIdentifiers(String(msg.text === undefined || msg.text === null ? '' : msg.text), map),
          ts: typeof msg.ts === 'number' ? msg.ts : 0,
          fromMe: msg.fromMe === true,
        });
      }
      return out;
    }

    /** Replace every identifier in free text: known participants by label, then the primitives. */
    function redactIdentifiers(text, map) {
      var result = text;
      if (map) {
        // Longest first, so a name that contains another name cannot leave a fragment behind.
        var identities = Array.from(map.keys()).sort(function (a, b) { return String(b).length - String(a).length; });
        for (var i = 0; i < identities.length; i += 1) {
          var identity = String(identities[i]);
          if (identity.length < 3) continue;
          result = result.split(identity).join(map.get(identities[i]));
        }
      }
      result = result.replace(JID_PATTERN, '[contact]');
      result = result.replace(PHONE_PATTERN, function (hit) {
        var digits = hit.replace(/\D/g, '');
        // Short digit runs are quantities, prices and times — redacting them would gut the text
        // the analysis exists to read. Seven digits is the shortest dialable number.
        return digits.length >= 7 ? '[number]' : hit;
      });
      return result;
    }
    // ===== ANALYSIS-CORE-END =====

    // ============================================================
    // 6. YOUR APP — WhatsApp Twin (one thread, read closely, answered in your own voice)
    // ============================================================

    // Schema, run once against real sql.js. `persona` holds one row per thread per kind, so a
    // re-analysis replaces rather than accumulates; `translations` is a per-message cache keyed
    // by (thread, message) so a tapped translation is paid for once.
    const DDL = [
      'CREATE TABLE IF NOT EXISTS threads (jid TEXT PRIMARY KEY, name TEXT NOT NULL, is_group INTEGER NOT NULL, analysed_at TEXT)',
      'CREATE TABLE IF NOT EXISTS persona (jid TEXT NOT NULL, kind TEXT NOT NULL, label TEXT, payload TEXT NOT NULL, created_at TEXT NOT NULL, PRIMARY KEY (jid, kind, label))',
      'CREATE TABLE IF NOT EXISTS translations (jid TEXT NOT NULL, message_id TEXT NOT NULL, language TEXT NOT NULL, text TEXT NOT NULL, PRIMARY KEY (jid, message_id, language))',
      'CREATE TABLE IF NOT EXISTS activity (id INTEGER PRIMARY KEY AUTOINCREMENT, jid TEXT NOT NULL, at TEXT NOT NULL, incoming TEXT, outgoing TEXT NOT NULL, mode TEXT NOT NULL)',
    ];

    const parseBody = (body) => {
      if (body == null) return null;
      if (typeof body === 'object') return body;
      if (typeof body === 'string') { try { return JSON.parse(body); } catch (e) { return null; } }
      return null;
    };

    // Connection errors, mapped to states the UI can actually explain. A desktop-only connection
    // reached from a browser is the common case and deserves its own words, not "failed".
    const mapNetError = (error) => {
      const code = error && error.code;
      if (code === 'NET_NOT_APPROVED') return 'unconnected';
      if (code === 'NET_AMBIGUOUS_CONNECTION') return 'ambiguous';
      if (code === 'NET_FETCH_FAILED' || code === 'NET_SSRF_BLOCKED') return 'unreachable';
      if (code === 'HOST_ERROR') return 'loading';
      return 'error';
    };

    const LANGUAGES = ['English', 'Hindi', 'Spanish', 'French', 'German', 'Portuguese', 'Arabic', 'Norwegian'];

    /** Rough per-message language signal. Script detection only — enough to offer a translation. */
    const looksNonDefault = (text, defaultLanguage) => {
      if (typeof text !== 'string' || text.trim().length === 0) return false;
      const nonLatin = /[؀-ۿऀ-ॿ一-鿿぀-ヿЀ-ӿ가-힯]/.test(text);
      if (defaultLanguage === 'English') return nonLatin;
      return !nonLatin;
    };

    const fmtTime = (ts) => {
      if (!ts) return '';
      try { return new Date(ts * 1000).toLocaleString(); } catch (e) { return ''; }
    };

    function App() {
      const { isReady, theme, sendMessage } = useSnugApp({
        appId: 'whatsapp-twin',
        displayName: 'WhatsApp Twin',
        description: 'Link your personal WhatsApp, pick one thread, and study it: who everyone is, how the group behaves, and replies drafted in your own voice.',
        iconEmoji: '🪞',
        iconColor: '#1f8a5c',
      });
      const net = useConnectedFetch();
      const db = useAppDB();

      const [ui, setUi] = usePersistedState('whatsapp-twin-ui', {
        tab: 'threads',
        threadJid: null,
        defaultLanguage: 'English',
      });
      const tab = ui.tab || 'threads';
      const setTab = (t) => setUi((prev) => ({ ...prev, tab: t }));

      const [conn, setConn] = useState('loading');
      const [chats, setChats] = useState([]);
      const [messages, setMessages] = useState([]);
      const [sync, setSync] = useState(null);
      const [profiles, setProfiles] = useState([]);
      const [dynamics, setDynamics] = useState('');
      const [voice, setVoice] = useState(null);
      const [busy, setBusy] = useState('');
      const [notice, setNotice] = useState(null);
      const [exportText, setExportText] = useState('');
      const [exportReport, setExportReport] = useState(null);
      const [question, setQuestion] = useState('');
      const [answer, setAnswer] = useState(null);
      const [draft, setDraft] = useState(null);
      const [activity, setActivity] = useState([]);
      const [translations, setTranslations] = useState({});

      useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);

      const thread = useMemo(
        () => chats.find((c) => c.jid === ui.threadJid) || null,
        [chats, ui.threadJid],
      );

      // ---------------------------------------------------------------- data loading

      const loadChats = useCallback(async () => {
        const res = await net.fetch('snug-connection://whatsapp/chats');
        if (!res.ok) { setConn(mapNetError(res.error)); return; }
        if (res.status === 401 || res.status === 403) { setConn('rejected'); return; }
        if (res.status >= 400) { setConn('error'); return; }
        const parsed = parseBody(res.body);
        setChats((parsed && Array.isArray(parsed.chats) ? parsed.chats : []));
        setConn('ready');
      }, [net]);

      const loadThread = useCallback(async (jid) => {
        if (!jid) return;
        setBusy('history');
        try {
          const res = await net.fetch('snug-connection://whatsapp/chats/' + encodeURIComponent(jid) + '/history');
          if (!res.ok) { setConn(mapNetError(res.error)); return; }
          if (res.status >= 400) { setNotice({ tone: 'warn', text: 'that thread could not be read (status ' + res.status + ').' }); return; }
          const parsed = parseBody(res.body);
          setMessages(parsed && Array.isArray(parsed.messages) ? parsed.messages : []);
          setSync(parsed ? parsed.sync : null);
        } finally { setBusy(''); }
      }, [net]);

      const loadPersona = useCallback(async (jid) => {
        try {
          const { rows } = await db.exec('SELECT kind, label, payload FROM persona WHERE jid = ?', [jid]);
          const people = [];
          let dyn = '';
          let v = null;
          rows.forEach((r) => {
            let payload = null;
            try { payload = JSON.parse(r[2]); } catch (e) { return; }
            if (r[0] === 'person') people.push(Object.assign({ label: r[1] }, payload));
            else if (r[0] === 'dynamics') dyn = payload.text || '';
            else if (r[0] === 'voice') v = payload;
          });
          setProfiles(people);
          setDynamics(dyn);
          setVoice(v);
        } catch (e) { setProfiles([]); setDynamics(''); setVoice(null); }
      }, [db]);

      const loadActivity = useCallback(async (jid) => {
        try {
          const { rows } = await db.exec('SELECT at, incoming, outgoing, mode FROM activity WHERE jid = ? ORDER BY id DESC LIMIT 40', [jid]);
          setActivity(rows.map((r) => ({ at: r[0], incoming: r[1], outgoing: r[2], mode: r[3] })));
        } catch (e) { setActivity([]); }
      }, [db]);

      const loadTranslations = useCallback(async (jid) => {
        try {
          const { rows } = await db.exec('SELECT message_id, text FROM translations WHERE jid = ? AND language = ?', [jid, ui.defaultLanguage]);
          const next = {};
          rows.forEach((r) => { next[r[0]] = r[1]; });
          setTranslations(next);
        } catch (e) { setTranslations({}); }
      }, [db, ui.defaultLanguage]);

      useEffect(() => {
        if (!isReady) return;
        let cancelled = false;
        (async () => {
          try { for (const stmt of DDL) await db.exec(stmt, []); } catch (e) { /* schema is best-effort; reads degrade to empty */ }
          if (!cancelled) await loadChats();
        })();
        return () => { cancelled = true; };
      }, [isReady]); // eslint-disable-line react-hooks/exhaustive-deps

      useEffect(() => {
        if (!isReady || !ui.threadJid) return;
        loadThread(ui.threadJid);
        loadPersona(ui.threadJid);
        loadActivity(ui.threadJid);
        loadTranslations(ui.threadJid);
      }, [isReady, ui.threadJid]); // eslint-disable-line react-hooks/exhaustive-deps

      // ---------------------------------------------------------------- analysis

      // The merge: exported .txt lines plus whatever history sync delivered. Dedup on
      // (author, minute, text) because the two sources describe the same messages differently —
      // one by display name, one by JID — and a duplicated message would double-count its author.
      const corpus = useMemo(() => {
        const live = messages.map((m) => ({
          author: m.from, authorJid: m.from, text: m.text, ts: m.ts, fromMe: m.fromMe === true, source: 'live',
        }));
        const exported = exportReport ? exportReport.messages : [];
        const seen = new Set();
        const merged = [];
        live.concat(exported).forEach((m) => {
          const key = String(m.text).trim() + '|' + Math.floor((m.ts || 0) / 60);
          if (seen.has(key)) return;
          seen.add(key);
          merged.push(m);
        });
        merged.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        return merged;
      }, [messages, exportReport]);

      const analyse = useCallback(async () => {
        if (!thread || corpus.length === 0) return;
        setBusy('analyse');
        setNotice(null);
        try {
          // AC12: pseudonymise BEFORE the turn. Real names, numbers and JIDs never leave here.
          const map = buildPseudonymMap({ messages: corpus });
          const scrubbed = pseudonymizeForLlm(corpus.slice(-400), map);
          const result = await sendMessage('profile_thread', { threadKind: thread.isGroup ? 'group' : 'dm' }, {
            state: { messages: scrubbed },
            responseSchema: RESPONSE_SCHEMA,
          });
          if (!result.ok) {
            setNotice({ tone: 'warn', text: (result.error && result.error.message) || 'the analysis did not come back — try again.' });
            return;
          }
          const data = result.data || {};
          const people = Array.isArray(data.people) ? data.people.filter((p) => p && typeof p.label === 'string') : [];
          if (people.length === 0 && !data.voice) {
            setNotice({ tone: 'warn', text: 'the model answered off-script, so nothing was saved — try again.' });
            return;
          }
          const now = new Date().toISOString();
          try {
            await db.exec('DELETE FROM persona WHERE jid = ?', [thread.jid]);
            for (const person of people) {
              await db.exec(
                'INSERT INTO persona (jid, kind, label, payload, created_at) VALUES (?, ?, ?, ?, ?)',
                [thread.jid, 'person', person.label, JSON.stringify({ summary: person.summary || '', traits: Array.isArray(person.traits) ? person.traits : [] }), now],
              );
            }
            if (typeof data.dynamics === 'string' && data.dynamics.length > 0) {
              await db.exec('INSERT INTO persona (jid, kind, label, payload, created_at) VALUES (?, ?, ?, ?, ?)', [thread.jid, 'dynamics', '-', JSON.stringify({ text: data.dynamics }), now]);
            }
            if (data.voice && typeof data.voice === 'object') {
              await db.exec('INSERT INTO persona (jid, kind, label, payload, created_at) VALUES (?, ?, ?, ?, ?)', [thread.jid, 'voice', '-', JSON.stringify(data.voice), now]);
            }
            await db.exec('INSERT OR REPLACE INTO threads (jid, name, is_group, analysed_at) VALUES (?, ?, ?, ?)', [thread.jid, thread.name || thread.jid, thread.isGroup ? 1 : 0, now]);
          } catch (e) { setNotice({ tone: 'warn', text: 'the analysis came back but could not be saved.' }); }
          await loadPersona(thread.jid);
          setTab('persona');
        } finally { setBusy(''); }
      }, [thread, corpus, sendMessage, db, loadPersona]); // eslint-disable-line react-hooks/exhaustive-deps

      const stats = useMemo(() => {
        const perAuthor = new Map();
        corpus.forEach((m) => {
          const key = m.fromMe ? 'you' : (m.authorJid || m.author);
          const row = perAuthor.get(key) || { count: 0, chars: 0 };
          row.count += 1;
          row.chars += String(m.text || '').length;
          perAuthor.set(key, row);
        });
        const busiest = [...perAuthor.entries()].sort((a, b) => b[1].count - a[1].count)[0];
        return {
          total: corpus.length,
          people: perAuthor.size,
          busiest: busiest ? busiest[1].count : 0,
          avgLength: corpus.length ? Math.round(corpus.reduce((n, m) => n + String(m.text || '').length, 0) / corpus.length) : 0,
        };
      }, [corpus]);

      const ask = useCallback(async () => {
        const q = question.trim();
        if (q.length === 0 || !thread) return;
        setBusy('ask');
        setAnswer(null);
        try {
          const result = await sendMessage('answer_question', { question: q }, {
            state: { profiles: profiles, dynamics: dynamics, stats: stats },
            responseSchema: RESPONSE_SCHEMA,
          });
          if (!result.ok) { setAnswer({ error: (result.error && result.error.message) || 'no answer came back.' }); return; }
          const text = result.data && typeof result.data.message === 'string' ? result.data.message : '';
          setAnswer(text.length > 0 ? { text } : { error: 'the model answered off-script — ask again.' });
        } finally { setBusy(''); }
      }, [question, thread, profiles, dynamics, stats, sendMessage]);

      // ---------------------------------------------------------------- reply surfaces

      const composeDraft = useCallback(async (incoming) => {
        if (!thread) return null;
        const map = buildPseudonymMap({ messages: corpus });
        const result = await sendMessage('draft_reply', {
          incoming: incoming ? redactIdentifiers(String(incoming.text || ''), map) : '',
        }, {
          state: {
            voice: voice || { tone: 'neutral', typicalLength: 'short', emoji: [], language: ui.defaultLanguage },
            recent: pseudonymizeForLlm(corpus.slice(-30), map),
          },
          responseSchema: RESPONSE_SCHEMA,
        });
        if (!result.ok) return { error: (result.error && result.error.message) || 'no draft came back.' };
        const text = result.data && typeof result.data.text === 'string' ? result.data.text.trim() : '';
        if (text.length === 0) return { error: 'the model answered off-script — nothing was drafted.' };
        return { text, language: (result.data && result.data.language) || (voice && voice.language) || ui.defaultLanguage };
      }, [thread, corpus, voice, ui.defaultLanguage, sendMessage]);

      const startDraft = useCallback(async () => {
        setBusy('draft');
        setDraft(null);
        try {
          const incoming = [...corpus].reverse().find((m) => !m.fromMe) || null;
          const result = await composeDraft(incoming);
          setDraft(result ? Object.assign({ incoming: incoming }, result) : null);
        } finally { setBusy(''); }
      }, [corpus, composeDraft]);

      // THE SEND. Every path — manual confirm and armed alike — goes through here, so the
      // journal cannot be bypassed by adding a caller: there is one place that talks to the
      // connection, and it writes the activity row itself.
      const sendReply = useCallback(async (text, mode, incoming) => {
        if (!thread) return false;
        const res = await net.fetch('snug-connection://whatsapp/chats/' + encodeURIComponent(thread.jid) + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) {
          setNotice({ tone: 'danger', text: mapNetError(res.error) === 'unconnected' ? 'that send was not approved.' : 'the message could not be sent.' });
          return false;
        }
        if (res.status >= 400) { setNotice({ tone: 'danger', text: 'WhatsApp refused that message (status ' + res.status + ').' }); return false; }
        try {
          await db.exec(
            'INSERT INTO activity (jid, at, incoming, outgoing, mode) VALUES (?, ?, ?, ?, ?)',
            [thread.jid, new Date().toISOString(), incoming ? String(incoming.text || '').slice(0, 400) : null, String(text).slice(0, 400), mode],
          );
          await loadActivity(thread.jid);
        } catch (e) { /* the send happened; a missing journal row must not look like a failed send */ }
        return true;
      }, [thread, net, db, loadActivity]);

      const confirmDraft = useCallback(async () => {
        if (!draft || !draft.text) return;
        setBusy('send');
        try {
          const sent = await sendReply(draft.text, 'manual', draft.incoming);
          if (sent) { setDraft(null); setNotice({ tone: 'info', text: 'sent.' }); await loadThread(thread.jid); }
        } finally { setBusy(''); }
      }, [draft, sendReply, loadThread, thread]);

      // ---------------------------------------------------------------- translate

      const translate = useCallback(async (msg) => {
        if (!thread) return;
        const id = msg.id || String(msg.ts);
        setBusy('translate:' + id);
        try {
          const map = buildPseudonymMap({ messages: corpus });
          const result = await sendMessage('translate', {
            text: redactIdentifiers(String(msg.text || ''), map),
            targetLanguage: ui.defaultLanguage,
          }, { responseSchema: RESPONSE_SCHEMA });
          if (!result.ok) { setNotice({ tone: 'warn', text: 'that translation did not come back.' }); return; }
          const text = result.data && typeof result.data.text === 'string' ? result.data.text : '';
          if (text.length === 0) { setNotice({ tone: 'warn', text: 'the model answered off-script — nothing was translated.' }); return; }
          setTranslations((prev) => Object.assign({}, prev, { [id]: text }));
          try {
            await db.exec('INSERT OR REPLACE INTO translations (jid, message_id, language, text) VALUES (?, ?, ?, ?)', [thread.jid, id, ui.defaultLanguage, text]);
          } catch (e) { /* the translation shows; the cache is an optimisation */ }
        } finally { setBusy(''); }
      }, [thread, corpus, ui.defaultLanguage, sendMessage, db]);

      // ---------------------------------------------------------------- data dignity

      const forgetThread = useCallback(async () => {
        if (!thread) return;
        setBusy('forget');
        try {
          // Cascades across every table that holds anything derived from this thread. A
          // "forget" that left the profiles behind would be a lie told to someone who asked
          // for their data to be gone.
          await db.exec('DELETE FROM persona WHERE jid = ?', [thread.jid]);
          await db.exec('DELETE FROM translations WHERE jid = ?', [thread.jid]);
          await db.exec('DELETE FROM activity WHERE jid = ?', [thread.jid]);
          await db.exec('DELETE FROM threads WHERE jid = ?', [thread.jid]);
          setProfiles([]); setDynamics(''); setVoice(null); setActivity([]); setTranslations({});
          setExportReport(null);
          setNotice({ tone: 'info', text: 'everything derived from this thread has been deleted.' });
        } catch (e) {
          setNotice({ tone: 'danger', text: 'some of that could not be deleted — try again.' });
        } finally { setBusy(''); }
      }, [thread, db]);

      const ingestExport = useCallback(() => {
        const report = parseWhatsAppExport(exportText);
        setExportReport(report);
        if (report.messages.length === 0) {
          setNotice({ tone: 'warn', text: 'no messages were found in that text — is it a WhatsApp "Export chat" file?' });
        } else {
          setNotice({ tone: 'info', text: report.messages.length + ' messages read from the export.' });
        }
      }, [exportText]);

      if (!isReady) return <div className="connecting">warming the mirror…</div>;

      return (
        <div className="shell">
          <div className="topbar">
            <h1>WhatsApp Twin</h1>
            <span className="sub">{thread ? (thread.name || thread.jid) : 'one thread, read closely'}</span>
          </div>

          <div className="notice warn" style={{ marginTop: 8 }}>
            Linking an automation tool to a personal WhatsApp account is against WhatsApp's terms
            of service, and accounts have been banned for it. Messages you analyse here — including
            other people's — are sent to your configured model provider under your own key.
          </div>

          <nav className="tabs" role="tablist" aria-label="Twin surfaces">
            {[['threads', 'threads'], ['persona', 'persona lab'], ['insights', 'insights'], ['reply', 'reply desk'], ['settings', 'settings']].map(([id, label]) => (
              <button key={id} className="tab" role="tab" aria-selected={tab === id} onClick={() => setTab(id)}>{label}</button>
            ))}
          </nav>

          {notice && <div className={'notice ' + notice.tone} style={{ marginBottom: 12 }}>{notice.text}</div>}

          {conn !== 'ready' && conn !== 'loading' && (
            <div className="notice danger" style={{ marginBottom: 12 }}>
              {conn === 'unconnected' && 'this app is not connected to WhatsApp yet — connect it from the connections card.'}
              {conn === 'unreachable' && 'the WhatsApp helper is not running. Twin works in the Snug desktop app, with the helper started.'}
              {conn === 'rejected' && 'the helper refused that key — re-link the connection.'}
              {conn === 'ambiguous' && 'more than one connection matches — pick one in settings.'}
              {conn === 'error' && 'the helper answered with an error.'}
            </div>
          )}

          {tab === 'threads' && (
            <section className="surface">
              <div className="panel">
                <div className="spread">
                  <h2>pick one thread</h2>
                  <button className="btn small" onClick={loadChats}>refresh</button>
                </div>
                <p className="hint">Twin studies a single conversation at a time — a group or a DM.</p>
                {conn === 'loading' && <div><div className="skeleton" /><div className="skeleton" /><div className="skeleton" /></div>}
                {conn === 'ready' && chats.length === 0 && <p className="empty">no conversations yet — the helper may still be syncing.</p>}
                <div className="threads">
                  {chats.map((c) => (
                    <button
                      key={c.jid}
                      className="thread"
                      aria-pressed={ui.threadJid === c.jid}
                      onClick={() => setUi((prev) => ({ ...prev, threadJid: c.jid }))}
                    >
                      <span>
                        <span className="name">{c.name || c.jid}</span>
                        <br />
                        <span className="meta">{c.isGroup ? 'group' : 'direct message'}{c.participants ? ' · ' + c.participants.length + ' people' : ''}</span>
                      </span>
                      {ui.threadJid === c.jid && <span className="chip on">selected</span>}
                    </button>
                  ))}
                </div>
              </div>

              {thread && (
                <div className="panel">
                  <h2>history</h2>
                  {sync && (
                    <p className="hint">
                      {sync.complete && sync.explicit && 'WhatsApp confirms this is the full history it will send.'}
                      {sync.complete && !sync.explicit && 'History looks complete, but WhatsApp never confirmed it — treat this as PARTIAL. Paste an export below for the full picture.'}
                      {!sync.complete && ('history is still arriving (' + Math.round((sync.progress || 0)) + '%) — analysis now would read a partial thread.')}
                    </p>
                  )}
                  <div className="stat"><span>messages loaded</span><span className="v">{messages.length}</span></div>
                  {exportReport && <div className="stat"><span>from your export</span><span className="v">{exportReport.messages.length}</span></div>}
                  <div className="stat"><span>after merge</span><span className="v">{corpus.length}</span></div>
                </div>
              )}

              {thread && (
                <div className="panel">
                  <h2>add an export (recommended)</h2>
                  <p className="hint">
                    On your phone: the chat → menu → More → Export chat → Without media. Paste the
                    .txt here. This is the reliable path — history sync can stall or arrive partial.
                  </p>
                  <textarea
                    value={exportText}
                    onChange={(e) => setExportText(e.target.value)}
                    placeholder="[12/03/2025, 21:04:11] Priya: paste the exported chat here…"
                  />
                  <div className="row" style={{ marginTop: 8 }}>
                    <button className="btn" onClick={ingestExport} disabled={exportText.trim().length === 0}>read the export</button>
                    {exportReport && (
                      <span className="meta">
                        {exportReport.messages.length} messages · {exportReport.systemLines} system lines skipped
                        {exportReport.unparsedLines > 0 ? ' · ' + exportReport.unparsedLines + ' lines not understood' : ''}
                      </span>
                    )}
                  </div>
                </div>
              )}

              {thread && (
                <div className="panel">
                  <div className="spread">
                    <h2>analyse this thread</h2>
                    <button className="btn primary" onClick={analyse} disabled={busy === 'analyse' || corpus.length === 0}>
                      {busy === 'analyse' ? 'reading…' : 'analyse'}
                    </button>
                  </div>
                  <p className="hint">
                    Participants are replaced with labels (P1, P2 …) before anything is sent to the
                    model — no names, numbers or WhatsApp IDs leave this machine.
                  </p>
                </div>
              )}
            </section>
          )}

          {tab === 'persona' && (
            <section className="surface">
              {!thread && <div className="panel"><p className="empty">pick a thread first.</p></div>}
              {thread && voice && (
                <div className="panel">
                  <h2>your voice in this thread</h2>
                  <p className="hint">This is the profile a drafted reply imitates.</p>
                  <div className="stat"><span>tone</span><span className="v">{voice.tone || '—'}</span></div>
                  <div className="stat"><span>typical length</span><span className="v">{voice.typicalLength || '—'}</span></div>
                  <div className="stat"><span>replies in</span><span className="v">{voice.language || '—'}</span></div>
                  {Array.isArray(voice.emoji) && voice.emoji.length > 0 && (
                    <div className="stat"><span>signature</span><span className="v">{voice.emoji.join(' ')}</span></div>
                  )}
                </div>
              )}
              {thread && profiles.length > 0 && (
                <div className="panel">
                  <h2>the people here</h2>
                  <p className="hint">Built from this thread's messages only — labels, never names.</p>
                  <div className="cards">
                    {profiles.map((p) => (
                      <div className="card" key={p.label}>
                        <h3>{p.label}</h3>
                        <p>{p.summary}</p>
                        <div className="traits">{(p.traits || []).map((t, i) => <span className="chip" key={i}>{t}</span>)}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {thread && dynamics && (
                <div className="panel"><h2>how this group behaves</h2><p className="hint" style={{ margin: 0 }}>{dynamics}</p></div>
              )}
              {thread && profiles.length === 0 && !voice && (
                <div className="panel"><p className="empty">nothing analysed yet — run the analysis from the threads tab.</p></div>
              )}
              {thread && (
                <div className="panel">
                  <h2>forget this thread</h2>
                  <p className="hint">
                    Deletes every profile, translation and activity row derived from this
                    conversation. The people in it never agreed to be studied.
                  </p>
                  <button className="btn danger" onClick={forgetThread} disabled={busy === 'forget'}>delete everything for this thread</button>
                </div>
              )}
            </section>
          )}

          {tab === 'insights' && (
            <section className="surface">
              {!thread && <div className="panel"><p className="empty">pick a thread first.</p></div>}
              {thread && (
                <div className="panel">
                  <h2>the shape of this thread</h2>
                  <div className="stat"><span>messages analysed</span><span className="v">{stats.total}</span></div>
                  <div className="stat"><span>people</span><span className="v">{stats.people}</span></div>
                  <div className="stat"><span>busiest person's messages</span><span className="v">{stats.busiest}</span></div>
                  <div className="stat"><span>average message length</span><span className="v">{stats.avgLength} chars</span></div>
                </div>
              )}
              {thread && (
                <div className="panel">
                  <h2>ask about this thread</h2>
                  <p className="hint">Answered from the saved analysis — try "who is the funniest?" or "who goes quiet when things get tense?"</p>
                  <input
                    type="text"
                    value={question}
                    onChange={(e) => setQuestion(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') ask(); }}
                    placeholder="who carries the conversation?"
                  />
                  <div className="row" style={{ marginTop: 8 }}>
                    <button className="btn" onClick={ask} disabled={busy === 'ask' || question.trim().length === 0 || profiles.length === 0}>ask</button>
                    {profiles.length === 0 && <span className="meta">analyse the thread first.</span>}
                  </div>
                  {busy === 'ask' && <div className="skeleton" style={{ marginTop: 12 }} />}
                  {answer && answer.text && <p className="hint" style={{ marginTop: 12, marginBottom: 0 }}>{answer.text}</p>}
                  {answer && answer.error && <div className="notice warn" style={{ marginTop: 12 }}>{answer.error}</div>}
                </div>
              )}
            </section>
          )}

          {tab === 'reply' && (
            <section className="surface">
              {!thread && <div className="panel"><p className="empty">pick a thread first.</p></div>}
              {thread && (
                <div className="panel">
                  <div className="spread">
                    <h2>reply as you</h2>
                    <button className="btn primary" onClick={startDraft} disabled={busy === 'draft' || corpus.length === 0}>
                      {busy === 'draft' ? 'writing…' : 'draft a reply'}
                    </button>
                  </div>
                  <p className="hint">
                    A draft is never sent on its own — you read it and press send.
                    {voice && voice.language ? ' Drafts are written in ' + voice.language + ', the language you usually reply in here.' : ''}
                  </p>
                  {draft && draft.error && <div className="notice warn">{draft.error}</div>}
                  {draft && draft.text && (
                    <div>
                      {draft.incoming && (
                        <div className="msg"><div className="who"><span>replying to</span></div><div className="body">{draft.incoming.text}</div></div>
                      )}
                      <div className="msg mine" style={{ marginTop: 8 }}>
                        <div className="who"><span>your draft{draft.language ? ' · ' + draft.language : ''}</span></div>
                        <div className="body">{draft.text}</div>
                      </div>
                      <div className="row" style={{ marginTop: 10 }}>
                        <button className="btn primary" onClick={confirmDraft} disabled={busy === 'send'}>send it</button>
                        <button className="btn" onClick={() => setDraft(null)}>discard</button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {thread && (
                <div className="panel">
                  <div className="spread">
                    <h2>auto-reply</h2>
                    <span className="chip">not available yet</span>
                  </div>
                  {/*
                    NO ARM SWITCH HERE, DELIBERATELY (owner decision, 2026-08-17).

                    The host-side approval gate this feature needs is built and enforced
                    (ADR-0033, `StandingApprovalGate`), but an app cannot reach it: arming has to
                    be a recorded, scoped approval the HOST holds, and the frame vocabulary an
                    app can speak has no seat for that. Shipping a switch here would either be
                    theatre — a control that sets a boolean in this app and authorizes nothing —
                    or, worse, a control that LOOKS like it granted a standing write approval
                    while the host never recorded one. Either way the user would be told
                    something untrue about what Snug may send in their name.

                    So the surface says what is actually true and stops. Manual Reply below is
                    the shipped path, and it is the honest one anyway: every send is read by the
                    user first.
                  */}
                  <p className="hint">
                    Unattended replies are not enabled in this version. When they are, arming will
                    be a standing approval you grant on the connection itself and can see and
                    revoke there — {thread.isGroup ? 'for this group, only messages that tag you' : 'for this DM, every new message'},
                    capped, quiet-hours aware, and journaled below. Until then Twin drafts and you
                    send: use <strong>draft a reply</strong> above.
                  </p>
                </div>
              )}

              {thread && (
                <div className="panel">
                  <h2>activity journal</h2>
                  <p className="hint">Every message Twin has sent for you, unattended or confirmed.</p>
                  {activity.length === 0 && <p className="empty">nothing sent yet.</p>}
                  <div className="journal">
                    {activity.map((a, i) => (
                      <div className="entry" key={i}>
                        <div className="mono">{a.at} · {a.mode}</div>
                        {a.incoming && <div>in: {a.incoming}</div>}
                        <div>out: {a.outgoing}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {thread && messages.length > 0 && (
                <div className="panel">
                  <h2>recent messages</h2>
                  <p className="hint">Messages not in {ui.defaultLanguage} offer a translation.</p>
                  <div className="msgs">
                    {messages.slice(-40).map((m) => {
                      const id = m.id || String(m.ts);
                      const canTranslate = looksNonDefault(m.text, ui.defaultLanguage);
                      return (
                        <div className={'msg' + (m.fromMe ? ' mine' : '')} key={id}>
                          <div className="who">
                            <span>{m.fromMe ? 'you' : (m.from || 'them')} · {fmtTime(m.ts)}</span>
                            {canTranslate && !translations[id] && (
                              <button
                                className="btn small"
                                data-testid={'translate-' + id}
                                onClick={() => translate(m)}
                                disabled={busy === 'translate:' + id}
                                aria-label="translate this message"
                              >{busy === 'translate:' + id ? '…' : 'translate'}</button>
                            )}
                          </div>
                          <div className="body">{m.text}</div>
                          {translations[id] && <div className="translated">{translations[id]}</div>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </section>
          )}

          {tab === 'settings' && (
            <section className="surface">
              <div className="panel">
                <h2>language</h2>
                <p className="hint">
                  Messages in another language offer a translation into this one. Your replies are
                  written in the language you usually use in the thread, which may differ.
                </p>
                <label className="field">
                  <span>default language</span>
                  <select value={ui.defaultLanguage} onChange={(e) => setUi((prev) => ({ ...prev, defaultLanguage: e.target.value }))}>
                    {LANGUAGES.map((l) => <option key={l} value={l}>{l}</option>)}
                  </select>
                </label>
              </div>
              <div className="panel">
                <h2>what leaves this machine</h2>
                <p className="hint" style={{ margin: 0 }}>
                  Message text is sent to your configured model provider, under your own key, with
                  participant names, phone numbers and WhatsApp IDs replaced by labels first. Your
                  WhatsApp session keys stay in the helper on this computer and are never sent
                  anywhere — Snug only ever holds a key to the helper.
                </p>
              </div>
            </section>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
