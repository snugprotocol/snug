<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telepath</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f2f4f3;
      --surface: #ffffff;
      --surface-2: #eef1ef;
      --ink: #0f1a14;
      --ink-soft: #5b6b61;
      --line: #dbe2dc;
      --accent: #0f7d61;
      --accent-soft: #e0f2eb;
      --warn: #9a5a12;
      --warn-soft: #fdf1de;
      --danger: #a32b28;
      --danger-soft: #fbe9e8;
      --me-bubble: #d6f3e4;
      --them-bubble: #ffffff;
      --chat-bg: #e9edea;
      --badge: #17a06b;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(15, 26, 20, 0.06), 0 8px 24px rgba(15, 26, 20, 0.05);
      /* dataviz reference palette (validated, adjacent pairlist, light surface) */
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-5: #e87ba4;
      --series-other: #9aa5a0;
      --viz-grid: rgba(15, 26, 20, 0.08);
    }
    :root[data-theme="dark"] {
      --bg: #0d1310;
      --surface: #151c18;
      --surface-2: #1b2420;
      --ink: #e7efe9;
      --ink-soft: #96a69b;
      --line: #29342e;
      --accent: #3ec89a;
      --accent-soft: #143126;
      --warn: #e8b871;
      --warn-soft: #33280f;
      --danger: #f08e8a;
      --danger-soft: #3a1c1b;
      --me-bubble: #1a3a2c;
      --them-bubble: #1d2621;
      --chat-bg: #10171308;
      --badge: #2fbd83;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
      /* the same eight hues stepped for the dark surface (dataviz reference palette) */
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-other: #5d6a64;
      --viz-grid: rgba(231, 239, 233, 0.1);
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { min-width: 40px; min-height: 40px; font: inherit; cursor: pointer; }
    .btn {
      padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--surface-2); color: var(--ink);
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .icon-btn {
      width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 999px; background: transparent; color: var(--accent); font-size: 19px;
    }
    .icon-btn:hover { background: var(--accent-soft); }
    .icon-btn:disabled { opacity: 0.45; }

    .frame { display: flex; height: 100%; }

    /* ---------------- chat list (the left pane / the landing page) ---------------- */
    .list-pane {
      width: 100%; max-width: 100%; display: flex; flex-direction: column;
      background: var(--surface); border-right: 1px solid var(--line);
    }
    @media (min-width: 760px) { .list-pane { width: 340px; min-width: 300px; } }
    .list-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 8px;
    }
    .list-head h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    .list-head .brand-sub { color: var(--ink-soft); font-size: 12px; }
    .chatlist { flex: 1; overflow-y: auto; }
    .chat-row {
      display: flex; gap: 12px; width: 100%; padding: 10px 14px; border: none; text-align: left;
      background: transparent; color: inherit; align-items: center; border-bottom: 1px solid var(--line);
    }
    .chat-row:hover { background: var(--surface-2); }
    .chat-row[aria-current="true"] { background: var(--accent-soft); }
    .chat-row .mid { flex: 1; min-width: 0; }
    .chat-row .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-row .preview { color: var(--ink-soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .chat-row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .chat-row .when { color: var(--ink-soft); font-size: 11px; }
    .chat-row[data-unread="true"] .when { color: var(--badge); font-weight: 600; }
    .unread-badge {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--badge);
      color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; flex: none; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 17px;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ---------------- thread pane ---------------- */
    .thread-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--chat-bg); }
    .thread-head {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .thread-head .avatar { width: 38px; height: 38px; font-size: 14px; }
    .thread-head .who { flex: 1; min-width: 0; }
    .thread-head .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-head .who .sub { color: var(--ink-soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .back-btn { display: inline-flex; }
    @media (min-width: 760px) { .back-btn { display: none; } }

    .thread-tabs { display: flex; gap: 4px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .thread-tab {
      min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid transparent;
      background: transparent; color: var(--ink-soft); font-size: 13px;
    }
    .thread-tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }

    .msgs { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 3px; }
    .day-sep { align-self: center; margin: 10px 0 6px; padding: 3px 12px; border-radius: 999px; background: var(--surface); color: var(--ink-soft); font-size: 11px; box-shadow: var(--shadow); }
    .bubble {
      max-width: min(76%, 560px); padding: 7px 11px 5px; border-radius: 12px; box-shadow: var(--shadow);
      background: var(--them-bubble); align-self: flex-start; overflow-wrap: break-word;
    }
    .bubble.me { background: var(--me-bubble); align-self: flex-end; }
    .bubble .sender { font-size: 12px; font-weight: 700; margin-bottom: 1px; }
    .bubble .body { white-space: pre-wrap; }
    .bubble .stamp { display: block; text-align: right; color: var(--ink-soft); font-size: 10px; margin-top: 2px; }
    .bubble .thumb { display: block; border: none; background: none; padding: 0; margin: 2px 0 4px; cursor: zoom-in; }
    .bubble .thumb img { max-width: 260px; max-height: 260px; border-radius: 8px; display: block; }
    .media-note { color: var(--ink-soft); font-size: 12px; font-style: italic; }

    .composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px 10px; background: var(--surface); border-top: 1px solid var(--line); }
    .composer textarea {
      flex: 1; resize: none; min-height: 40px; max-height: 130px; padding: 9px 12px;
      border-radius: 18px; border: 1px solid var(--line); background: var(--surface-2);
      color: var(--ink); font: inherit;
    }
    .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    /* ---------------- insights + charts ---------------- */
    .tab-scroll { flex: 1; overflow-y: auto; padding: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .panel h3 { margin: 0 0 4px; font-size: 15px; }
    .panel .hint { margin: 0 0 10px; color: var(--ink-soft); font-size: 12.5px; }
    .person { border-top: 1px solid var(--line); padding: 10px 0; }
    .person:first-of-type { border-top: none; }
    .person .p-name { font-weight: 700; }
    .person .p-summary { margin: 3px 0 6px; }
    .trait { display: inline-block; margin: 0 6px 6px 0; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); }
    .headline { font-size: 15px; font-weight: 600; color: var(--accent); }
    .chart-box { position: relative; height: 240px; }
    .chart-box.tall { height: 280px; }
    .num-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .num-table th, .num-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
    .num-table td.n { text-align: right; font-variant-numeric: tabular-nums; }
    .linklike { border: none; background: none; color: var(--accent); font-size: 12.5px; padding: 4px 0; min-height: 28px; min-width: 0; }

    /* ---------------- overlays & states ---------------- */
    .center-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: var(--ink-soft); }
    .center-state .big { font-size: 40px; }
    .center-state .title { color: var(--ink); font-weight: 600; font-size: 16px; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; align-items: center; justify-content: center; z-index: 30; cursor: zoom-out; border: none; padding: 20px; width: 100%; }
    .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
    .tos-note { padding: 6px 14px 10px; color: var(--ink-soft); font-size: 11px; border-top: 1px solid var(--line); background: var(--surface); }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 40; box-shadow: var(--shadow); }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ============================================================
    // 1. SNUG BRIDGE RUNTIME (MANDATORY — copy exactly, never edit)
    // ============================================================
    const SnugBridge = {
      instanceId: null,
      theme: 'light',
      capabilities: {},
      ready: false,
      pending: new Map(),    // requestId -> { resolve, onStream }
      dbPending: new Map(),  // requestId -> resolve
      netPending: new Map(), // requestId -> resolve
      listeners: new Set(),  // re-render triggers for hooks

      post(frame) {
        window.parent.postMessage({ v: 1, instanceId: this.instanceId, ...frame }, '*');
      },
      notify() { for (const fn of this.listeners) fn(); },
    };

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.v !== 1) return;

      if (data.type === 'snug:host-ready') {
        SnugBridge.instanceId = data.instanceId;
        if (data.theme) SnugBridge.theme = data.theme;
        if (data.capabilities) SnugBridge.capabilities = data.capabilities;
        SnugBridge.ready = true;
        SnugBridge.notify();
        return;
      }

      if (data.type === 'snug:app-response') {
        const entry = SnugBridge.pending.get(data.requestId);
        if (!entry) return; // unknown or superseded requestId — ignore
        if (data.streaming) {
          // Cumulative provisional text — display only. NEVER resolve here.
          if (entry.onStream && typeof data.text === 'string') entry.onStream(data.text);
          return;
        }
        SnugBridge.pending.delete(data.requestId); // terminal — exactly one per requestId
        entry.resolve(data.ok ? { ok: true, data: data.data } : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:db-response') {
        const resolve = SnugBridge.dbPending.get(data.requestId);
        if (!resolve) return;
        SnugBridge.dbPending.delete(data.requestId);
        // Result fields (rows/columns/value/bytesBase64) live at the TOP LEVEL of the frame.
        resolve(data.ok
          ? { ok: true, rows: data.rows, columns: data.columns, value: data.value, bytesBase64: data.bytesBase64 }
          : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:net-response') {
        const resolve = SnugBridge.netPending.get(data.requestId);
        if (!resolve) return;
        SnugBridge.netPending.delete(data.requestId);
        // Result fields (status/headers/body/truncated) live at the TOP LEVEL of the frame.
        resolve(data.ok
          ? { ok: true, status: data.status, headers: data.headers, body: data.body, truncated: data.truncated }
          : { ok: false, error: data.error });
        return;
      }

      if (data.type === 'snug:host-event') {
        if (data.event === 'theme-change' && data.data && data.data.theme) {
          SnugBridge.theme = data.data.theme;
          SnugBridge.notify();
        }
        // Unknown host events MUST be ignored (the protocol is additive).
      }
    });

    function snugDbRequest(op, args) {
      return new Promise((resolve) => {
        const requestId = crypto.randomUUID();
        SnugBridge.dbPending.set(requestId, resolve);
        SnugBridge.post({ type: 'snug:db-request', requestId, op, ...args });
      });
    }

    function snugNetRequest(fields) {
      if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
      return new Promise((resolve) => {
        const requestId = crypto.randomUUID();
        SnugBridge.netPending.set(requestId, resolve);
        SnugBridge.post({ type: 'snug:net-request', requestId, ...fields });
      });
    }

    // ============================================================
    // 2. useSnugApp (MANDATORY — copy exactly, never edit)
    // ============================================================
    function useSnugApp(meta) {
      const [, setTick] = useState(0);
      const [isWaiting, setIsWaiting] = useState(false);
      const [lastResponse, setLastResponse] = useState(null);
      const inFlight = useRef(0);
      const metaRef = useRef(meta);

      useEffect(() => {
        const rerender = () => setTick((n) => n + 1);
        SnugBridge.listeners.add(rerender);
        const m = metaRef.current;
        SnugBridge.post({
          type: 'snug:app-announce',
          appId: m.appId,
          displayName: m.displayName,
          description: m.description,
          iconEmoji: m.iconEmoji,
          iconColor: m.iconColor,
        });
        return () => SnugBridge.listeners.delete(rerender);
      }, []);

      const sendMessage = useCallback((action, payload, opts) => {
        if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
        const requestId = crypto.randomUUID(); // fresh per request — multiple in flight are legal
        inFlight.current += 1;
        setIsWaiting(true);
        return new Promise((resolve) => {
          SnugBridge.pending.set(requestId, {
            onStream: opts && opts.onStream,
            resolve: (result) => {
              inFlight.current -= 1;
              if (inFlight.current === 0) setIsWaiting(false);
              setLastResponse(result);
              resolve(result);
            },
          });
          SnugBridge.post({
            type: 'snug:app-message',
            requestId,
            appId: metaRef.current.appId,
            action,
            payload,
            state: opts && opts.state,
            responseSchema: opts && opts.responseSchema,
          });
        });
      }, []);

      return {
        isReady: SnugBridge.ready,
        theme: SnugBridge.theme,
        isWaiting,
        lastResponse,
        sendMessage,
      };
    }

    // ============================================================
    // 3. usePersistedState (MANDATORY — copy exactly, never edit)
    // Storage is HOST-BROKERED key-value. The sandboxed iframe has a
    // null origin: no browser storage API works here.
    // ============================================================
    function usePersistedState(key, initialValue) {
      const [state, setState] = useState(initialValue);
      // Tracks WHICH key hydrated: a key change must re-hydrate before any write-back,
      // or the old key's state would overwrite the new key's stored value.
      const [hydratedKey, setHydratedKey] = useState(null);
      const initialRef = useRef(initialValue);

      useEffect(() => {
        let cancelled = false;
        const hydrate = async () => {
          const result = await snugDbRequest('kvGet', { key });
          if (cancelled) return;
          if (result.ok && result.value != null) {
            const stored = result.value;
            const init = initialRef.current;
            // Merge objects with defaults so fields added in newer code are never undefined.
            setState(
              stored && typeof stored === 'object' && !Array.isArray(stored) &&
              init && typeof init === 'object' && !Array.isArray(init)
                ? { ...init, ...stored }
                : stored
            );
          } else {
            setState(initialRef.current); // nothing stored under this key — back to defaults
          }
          setHydratedKey(key);
        };
        const onReady = () => {
          if (!SnugBridge.ready) return;
          SnugBridge.listeners.delete(onReady);
          hydrate();
        };
        if (SnugBridge.ready) hydrate();
        else SnugBridge.listeners.add(onReady);
        return () => { cancelled = true; SnugBridge.listeners.delete(onReady); };
      }, [key]);

      useEffect(() => {
        if (hydratedKey !== key) return;
        snugDbRequest('kvSet', { key, value: state }); // fire-and-forget; host acks via db-response
      }, [hydratedKey, key, state]);

      return [state, setState];
    }

    // ============================================================
    // 4. useAppDB (copy exactly when the app needs SQL; omit otherwise)
    // ============================================================
    function useAppDB() {
      return useMemo(() => ({
        async exec(sql, params) {
          const result = await snugDbRequest('exec', { sql, params });
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db exec failed');
          return { rows: result.rows, columns: result.columns }; // { rows: unknown[][], columns: string[] }
        },
        async exportDb() {
          const result = await snugDbRequest('export', {});
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db export failed');
          return result.bytesBase64;
        },
        async importDb(bytesBase64) {
          const result = await snugDbRequest('import', { bytesBase64 });
          if (!result.ok) throw new Error((result.error && result.error.message) || 'db import failed');
        },
      }), []);
    }

    // ============================================================
    // 5. useConnectedFetch (copy exactly when the app calls an approved API; omit otherwise)
    // The sandboxed app has NO network of its own. This reaches ONLY your app's APPROVED
    // hosts THROUGH the host, which injects your saved credentials, caps sizes, asks you
    // before any write, and scrubs the response. You never see a token.
    // A connection whose host only the USER knows (a device on their network): address it as
    // snug-connection://<slot>/<path> — the host resolves the approved address; you never learn it.
    // ALWAYS resolves: { ok:true, status, headers, body } or { ok:false, error }.
    // ============================================================
    function useConnectedFetch() {
      return useMemo(() => ({
        fetch(url, opts) {
          return snugNetRequest({
            url,
            method: (opts && opts.method) || 'GET',
            headers: opts && opts.headers,
            body: opts && opts.body,
          });
        },
      }), []);
    }

    // ============================================================
    // 5. RESPONSE SCHEMA — describe the JSON the agent must return
    // ============================================================
    // Three actions share one schema object: the model is told which shape to use by the
    // action it was called with, and every reply is validated locally before it touches
    // state. A model reply is untrusted input — here more than usual, because a "profile"
    // is about real people.
    const RESPONSE_SCHEMA = {
      kind: "string: 'profile' | 'draft' — which action you are answering",
      headline: "string: (kind 'profile') one sentence on what stands out — or what CHANGED, when a prior analysis was given",
      people: [
        {
          label: "string: EXACTLY one of the labels from the transcript (P1, P2, … or YOU) — never a real name",
          summary: 'string: two or three sentences on how this person shows up in the thread',
          traits: ['string: two to five short observed habits, e.g. "answers within minutes"'],
        },
      ],
      dynamics: "string: (kind 'profile') how the group relates — who leads, who jokes, who goes quiet",
      voice: {
        tone: "string: (kind 'profile') how YOU write — register, warmth, formality",
        typicalLength: "string: 'short' | 'medium' | 'long'",
        emoji: ['string: emoji YOU actually use, most frequent first (may be empty)'],
        language: 'string: the language YOU usually reply in for this thread, e.g. "English"',
      },
      text: "string: (kind 'draft') the reply written AS the user, in their register and length",
      language: "string: (kind 'draft') the language you wrote the draft in",
    };

    // ===== ANALYSIS-CORE-BEGIN =====
    // Extracted and tested directly by `examples/whatsapp-analysis.test.mjs`. Everything
    // between these markers is pure: no React, no bridge, no host. These functions carry
    // the privacy boundary and every statistic a chart draws, and their failure modes are
    // silent — so they are exercised against hostile fixtures instead of trusted.

    /**
     * Anything that identifies a real human being, as a pattern.
     *
     * Phone numbers are matched on the PRIMITIVE — a run of digits long enough to be
     * dialable, however it is spaced, dotted, dashed or bracketed — rather than on one
     * spelling. The attacker here is not adversarial, it is FORMATTING: '+91 98765 43210'
     * and '(555) 123-4567' are the same fact, and a scrub that catches one spelling and
     * misses the others has not protected anybody.
     */
    var JID_PATTERN = /\b[\w.-]+@(?:s\.whatsapp\.net|g\.us|c\.us|lid|broadcast)\b/gi;
    var PHONE_PATTERN = /\+?\d[\d\s(). -]{6,}\d/g;

    /**
     * Extend the PERSISTED pseudonym map: prior labels survive verbatim, new people take
     * the next free number. Stability is the property everything else leans on — a stored
     * profile keyed to P2 must keep meaning the same human being across every incremental
     * re-analysis, or the analysis quietly reassigns personalities between real people.
     * Each person maps by BOTH jid and display name, so either spelling scrubs to one label.
     */
    function extendPseudonymMap(priorEntries, people) {
      var map = new Map();
      var maxN = 0;
      if (priorEntries) {
        var entries = Array.from(priorEntries instanceof Map ? priorEntries.entries() : priorEntries);
        for (var i = 0; i < entries.length; i += 1) {
          map.set(entries[i][0], entries[i][1]);
          var m = /^P(\d+)$/.exec(entries[i][1]);
          if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
        }
      }
      var list = people || [];
      var pending = [];
      for (var p = 0; p < list.length; p += 1) {
        var person = list[p];
        if (!person || (person.jid === undefined && person.name === undefined)) continue;
        var known =
          (person.jid !== undefined ? map.get(person.jid) : undefined) ||
          (person.name !== undefined ? map.get(person.name) : undefined);
        var label = person.isMe === true ? 'YOU' : known;
        if (label === undefined) { pending.push(person); continue; }
        if (person.jid !== undefined) map.set(person.jid, label);
        if (person.name !== undefined && String(person.name).length >= 3) map.set(person.name, label);
      }
      // New arrivals mint in sorted order, so the batch's arrival order cannot pick labels.
      pending.sort(function (a, b) { return String(a.jid || a.name) < String(b.jid || b.name) ? -1 : 1; });
      for (var q = 0; q < pending.length; q += 1) {
        maxN += 1;
        var fresh = 'P' + maxN;
        if (pending[q].jid !== undefined) map.set(pending[q].jid, fresh);
        if (pending[q].name !== undefined && String(pending[q].name).length >= 3) map.set(pending[q].name, fresh);
      }
      return map;
    }

    /** Replace every identifier in free text: known participants by label, then the primitives. */
    function redactIdentifiers(text, map) {
      var result = text;
      if (map) {
        // Longest first, so a name that contains another name cannot leave a fragment behind.
        var identities = Array.from(map.keys()).sort(function (a, b) { return String(b).length - String(a).length; });
        for (var i = 0; i < identities.length; i += 1) {
          var identity = String(identities[i]);
          if (identity.length < 3) continue;
          result = result.split(identity).join(map.get(identities[i]));
        }
      }
      result = result.replace(JID_PATTERN, '[contact]');
      result = result.replace(PHONE_PATTERN, function (hit) {
        var digits = hit.replace(/\D/g, '');
        // Short digit runs are quantities, prices and times — redacting them would gut the
        // text the analysis exists to read. Seven digits is the shortest dialable number.
        return digits.length >= 7 ? '[number]' : hit;
      });
      return result;
    }

    /**
     * THE NEW-READER SCRUB (carried from the POC's AC12). Telepath sends other people's
     * private messages to a third-party model provider under the user's own key. Those
     * people never consented and are not Snug users. Applied to the BODY as well as the
     * author seat, because a phone number shared in a message is the common case and
     * scrubbing only the author field would protect nothing that matters.
     */
    function pseudonymizeForLlm(messages, map) {
      var list = messages || [];
      var out = [];
      for (var i = 0; i < list.length; i += 1) {
        var msg = list[i];
        var identity = msg.from !== undefined ? msg.from : (msg.authorJid || msg.author);
        var label = map ? map.get(identity) : undefined;
        if (label === undefined) label = msg.fromMe === true ? 'YOU' : 'P?';
        out.push({
          author: label,
          text: redactIdentifiers(String(msg.text === undefined || msg.text === null ? '' : msg.text), map),
          ts: typeof msg.ts === 'number' ? msg.ts : 0,
          fromMe: msg.fromMe === true,
        });
      }
      return out;
    }

    /**
     * THE REVERSE MAP, at render time only. The model speaks in labels; the user reads
     * names they already have. Whole-label word-boundary replacement — P12 must round-trip
     * as P12's person, never as P1's name with a stray digit — and an unknown label stays
     * visible rather than being guessed at.
     */
    function deanonymizeText(text, map) {
      var reverse = new Map();
      if (map) {
        map.forEach(function (label, identity) {
          if (label === 'YOU') return;
          var current = reverse.get(label);
          var isName = !/@/.test(String(identity));
          if (current === undefined || (isName && /@/.test(String(current)))) reverse.set(label, String(identity));
        });
      }
      return String(text).replace(/\b(YOU|P\d+)\b/g, function (label) {
        if (label === 'YOU') return 'You';
        var name = reverse.get(label);
        return name === undefined ? label : name;
      });
    }

    /**
     * How to render an identity we have NO name for.
     *
     * A jid comes in two spellings and only ONE of them is a phone number:
     * `919876543210@s.whatsapp.net` is dialable, while `77771@lid` is an INTERNAL
     * WhatsApp address that belongs to nobody. The first version printed '+' + digits for
     * both, so unknown contacts appeared under confident, WRONG phone numbers — worse than
     * showing nothing, because a plausible number invites the user to trust it
     * (owner-reported, 2026-08-17).
     */
    function fallbackLabel(jid) {
      var raw = String(jid === undefined || jid === null ? '' : jid);
      var at = raw.indexOf('@');
      var local = at >= 0 ? raw.slice(0, at) : raw;
      var domain = at >= 0 ? raw.slice(at + 1) : '';
      if (local.length === 0) return 'Unknown';
      // Only the phone-number address space may be rendered as a number.
      if (domain === 's.whatsapp.net' || domain === 'c.us' || domain === '') {
        return /^\d{6,}$/.test(local) ? '+' + local : local;
      }
      if (domain === 'g.us') return 'Group';
      // A LID (or anything else unrecognised) is not a number and must not look like one.
      return 'Unknown contact';
    }

    /**
     * The ONE place a chat row's label comes from (owner-reported 2026-08-18: 1:1 rows
     * printed "…@s.whatsapp.net" raw). The helper names a chat by its own jid when it knows
     * nothing better — an honest placeholder for a store, but never a label for a human.
     * Order is the owner's chosen WhatsApp-Web convention: saved name → ~push name →
     * whatever fallbackLabel can honestly say (formatted number, Group, Unknown contact).
     */
    function chatDisplayName(chat) {
      var c = chat || {};
      var name = typeof c.name === 'string' ? c.name : '';
      if (name.length > 0 && name !== c.jid) {
        return c.nameKind === 'push' ? '~' + name : name;
      }
      return fallbackLabel(c.jid);
    }

    /**
     * The USER's measured emoji habits — most frequent first. Nobody else's rows count.
     * One token = one pictograph plus its own modifiers (skin tone, VS16), extended ONLY
     * through a ZWJ — adjacent separate emoji must never glue into one token, or '😂😂'
     * counts as a single unheard-of emoji instead of the user's favourite twice.
     */
    var EMOJI_PATTERN = /\p{Extended_Pictographic}(?:\uFE0F|[\u{1F3FB}-\u{1F3FF}])*(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|[\u{1F3FB}-\u{1F3FF}])*)*/gu;
    function emojiFrequency(messages) {
      var counts = new Map();
      var list = messages || [];
      for (var i = 0; i < list.length; i += 1) {
        if (list[i].fromMe !== true) continue;
        var hits = String(list[i].text || '').match(EMOJI_PATTERN) || [];
        for (var h = 0; h < hits.length; h += 1) counts.set(hits[h], (counts.get(hits[h]) || 0) + 1);
      }
      return Array.from(counts.entries())
        .map(function (entry) { return { emoji: entry[0], count: entry[1] }; })
        .sort(function (a, b) { return b.count - a.count || (a.emoji < b.emoji ? -1 : 1); });
    }

    /**
     * The LLM-bound analysis request, byte-budgeted. `snug:app-message` frames ride a
     * 256 KB class, so full history reaches the DATABASE (charts read all of it) while the
     * prompt gets a bounded recent window, trimmed from the OLDEST side, with the
     * truncation DISCLOSED rather than silent. Rows pass through the scrub here — the
     * budget path must never become a scrub bypass.
     */
    function buildAnalysisRequest(opts) {
      var rows = pseudonymizeForLlm(opts.messages || [], opts.map);
      var budget = typeof opts.byteBudget === 'number' ? opts.byteBudget : 150000;
      var transcript = rows;
      var truncated = false;
      while (transcript.length > 1 && JSON.stringify(transcript).length > budget) {
        var drop = Math.max(1, Math.floor(transcript.length * 0.1));
        transcript = transcript.slice(drop);
        truncated = true;
      }
      var request = { transcript: transcript, truncated: truncated };
      if (opts.priorAnalysis !== undefined && opts.priorAnalysis !== null) request.prior = opts.priorAnalysis;
      return request;
    }

    /** Merge live-refetched rows into what we hold: dedupe by id, keep time order. */
    function mergeMessages(existing, incoming) {
      var seen = new Set();
      var out = [];
      var all = (existing || []).concat(incoming || []);
      for (var i = 0; i < all.length; i += 1) {
        var id = all[i].id;
        if (seen.has(id)) continue;
        seen.add(id);
        out.push(all[i]);
      }
      out.sort(function (a, b) { return a.ts - b.ts || (String(a.id) < String(b.id) ? -1 : 1); });
      return out;
    }

    var authorOf = function (msg) { return msg.from !== undefined ? msg.from : (msg.authorJid || msg.author); };

    /** Message count and share per author — the part-to-whole chart's rows. */
    function statsByParticipant(messages) {
      var counts = new Map();
      var list = messages || [];
      for (var i = 0; i < list.length; i += 1) {
        var author = authorOf(list[i]);
        counts.set(author, (counts.get(author) || 0) + 1);
      }
      var total = list.length > 0 ? list.length : 1;
      return Array.from(counts.entries())
        .map(function (entry) { return { author: entry[0], count: entry[1], share: entry[1] / total }; })
        .sort(function (a, b) { return b.count - a.count; });
    }

    /**
     * Hour-of-day and weekday activity, Monday-first, in the CALLER's timezone via an
     * explicit offset (minutes east of UTC). Explicit because a chart of "when this group
     * talks" drawn in the wrong timezone is confidently wrong for every bucket.
     */
    function activityBuckets(messages, offsetMinutes) {
      var hours = new Array(24).fill(0);
      var weekdays = new Array(7).fill(0);
      var perAuthor = new Map();
      var offset = typeof offsetMinutes === 'number' ? offsetMinutes : 0;
      var list = messages || [];
      for (var i = 0; i < list.length; i += 1) {
        var shifted = new Date((list[i].ts + offset * 60) * 1000);
        var hour = shifted.getUTCHours();
        var weekday = (shifted.getUTCDay() + 6) % 7; // Monday-first
        hours[hour] += 1;
        weekdays[weekday] += 1;
        var author = authorOf(list[i]);
        var slot = perAuthor.get(author);
        if (slot === undefined) { slot = { count: 0, hours: new Array(24).fill(0) }; perAuthor.set(author, slot); }
        slot.count += 1;
        slot.hours[hour] += 1;
      }
      return { hours: hours, weekdays: weekdays, perAuthor: perAuthor };
    }

    /**
     * Median response time per author. A response is a message behind a SPEAKER CHANGE —
     * a monologue continuation is not one — and gaps beyond 24h are dropped as stale: a
     * reply to yesterday measures availability, not conversation tempo.
     */
    function responseStats(messages) {
      var CAP_SECONDS = 24 * 3600;
      var gaps = new Map();
      var list = (messages || []).slice().sort(function (a, b) { return a.ts - b.ts; });
      for (var i = 1; i < list.length; i += 1) {
        var prevAuthor = authorOf(list[i - 1]);
        var curAuthor = authorOf(list[i]);
        if (prevAuthor === curAuthor) continue;
        var gap = list[i].ts - list[i - 1].ts;
        if (gap <= 0 || gap > CAP_SECONDS) continue;
        if (!gaps.has(curAuthor)) gaps.set(curAuthor, []);
        gaps.get(curAuthor).push(gap);
      }
      return Array.from(gaps.entries())
        .map(function (entry) {
          var sorted = entry[1].slice().sort(function (a, b) { return a - b; });
          var mid = sorted.length >> 1;
          var median = sorted.length % 2 === 1 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
          return { author: entry[0], responses: sorted.length, medianMinutes: Math.round(median / 60) };
        })
        .sort(function (a, b) { return a.medianMinutes - b.medianMinutes; });
    }

    /** Month buckets for the volume trend, oldest first. */
    function messagesByMonth(messages) {
      var counts = new Map();
      var list = messages || [];
      for (var i = 0; i < list.length; i += 1) {
        var date = new Date(list[i].ts * 1000);
        var key = date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0');
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      return Array.from(counts.entries())
        .map(function (entry) { return { month: entry[0], count: entry[1] }; })
        .sort(function (a, b) { return a.month < b.month ? -1 : 1; });
    }
    // ===== ANALYSIS-CORE-END =====

    // ============================================================
    // 6. YOUR APP — Telepath (your chats, live, with insight on tap)
    // ============================================================

    const SLOT = 'snug-connection://whatsapp';
    const KV_KEY = 'telepath-ui';

    // The LLM payload budget: comfortably inside the 256 KB app-message frame class once
    // action/state framing and the prior analysis ride along.
    const LLM_BYTE_BUDGET = 150000;

    const DDL = [
      'CREATE TABLE IF NOT EXISTS threads (jid TEXT PRIMARY KEY, name TEXT NOT NULL, is_group INTEGER NOT NULL, last_activity_ts INTEGER, analysed_at TEXT, analysis_watermark_ts INTEGER)',
      'CREATE TABLE IF NOT EXISTS messages (jid TEXT NOT NULL, id TEXT NOT NULL, author TEXT NOT NULL, text TEXT NOT NULL, ts INTEGER NOT NULL, from_me INTEGER NOT NULL, kind TEXT, PRIMARY KEY (jid, id))',
      'CREATE TABLE IF NOT EXISTS pseudonyms (jid TEXT NOT NULL, identity TEXT NOT NULL, label TEXT NOT NULL, PRIMARY KEY (jid, identity))',
      'CREATE TABLE IF NOT EXISTS analyses (jid TEXT NOT NULL, run_at TEXT NOT NULL, watermark_ts INTEGER NOT NULL, payload TEXT NOT NULL, PRIMARY KEY (jid, run_at))',
      'CREATE TABLE IF NOT EXISTS activity (id INTEGER PRIMARY KEY AUTOINCREMENT, jid TEXT NOT NULL, at TEXT NOT NULL, incoming TEXT, outgoing TEXT NOT NULL, mode TEXT NOT NULL)',
    ];

    const parseBody = (body) => {
      if (body == null) return null;
      if (typeof body === 'object') return body;
      if (typeof body === 'string') { try { return JSON.parse(body); } catch (e) { return null; } }
      return null;
    };

    // ===== LIVE-DOORBELL-BEGIN =====
    // Extracted and tested by `examples/whatsapp-analysis.test.mjs` against the EXACT frame
    // shape the runner's notifyEvent posts — the seam eight-seams defect #3 existed to name.
    //
    // The host pump (ADR-0034) rings `connection-event` with LEAN HINTS ({jid, kind, ts} —
    // no content). A hint is an invalidation, never a delivery: every UI change flows from
    // a governed refetch, so a stale or malformed event can at worst cost one redundant
    // read of our own data. Shape-gated hard; everything else the channel might carry is
    // ignored (the protocol is additive). This listener lives OUTSIDE the byte-locked hooks
    // block, so it must never touch SnugBridge internals — it keeps its own subscriber set.
    var liveListeners = new Set();
    window.addEventListener('message', function (event) {
      var data = event.data;
      if (!data || data.v !== 1 || data.type !== 'snug:host-event' || data.event !== 'connection-event') return;
      var payload = data.data;
      if (!payload || payload.slot !== 'whatsapp') return;
      var jids = new Set();
      var resync = payload.resync === true;
      if (Array.isArray(payload.hints)) {
        for (var i = 0; i < payload.hints.length; i += 1) {
          var hint = payload.hints[i];
          if (hint && typeof hint.jid === 'string') jids.add(hint.jid);
        }
      }
      liveListeners.forEach(function (fn) { fn({ jids: jids, resync: resync }); });
    });
    // ===== LIVE-DOORBELL-END =====

    // ---- time formatting (list + thread), WhatsApp-style
    const WEEKDAY_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    function fmtClock(ts) {
      const d = new Date(ts * 1000);
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function dayKey(ts) {
      const d = new Date(ts * 1000);
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function fmtListTime(ts, nowTs) {
      if (!ts) return '';
      if (dayKey(ts) === dayKey(nowTs)) return fmtClock(ts);
      if (dayKey(ts) === dayKey(nowTs - 86400)) return 'Yesterday';
      const d = new Date(ts * 1000);
      if (nowTs - ts < 6 * 86400) return WEEKDAY_SHORT[(d.getDay() + 6) % 7];
      return d.getDate() + '/' + (d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2);
    }
    function fmtDayLabel(ts, nowTs) {
      if (dayKey(ts) === dayKey(nowTs)) return 'Today';
      if (dayKey(ts) === dayKey(nowTs - 86400)) return 'Yesterday';
      const d = new Date(ts * 1000);
      return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
    }

    const AVATAR_HUES = [16, 96, 152, 200, 262, 310, 348, 42];
    function avatarHue(key) {
      let h = 0;
      for (let i = 0; i < key.length; i += 1) h = (h * 31 + key.charCodeAt(i)) >>> 0;
      return AVATAR_HUES[h % AVATAR_HUES.length];
    }
    function initialsOf(name) {
      // The ~push-name mark is presentation, not a person's initial.
      const words = String(name || '?').replace(/^~/, '').trim().split(/\s+/).slice(0, 2);
      return words.map((w) => (w[0] || '').toUpperCase()).join('') || '?';
    }

    // Avatar bytes, cached per jid for the session with in-flight dedupe — a chat list of
    // forty rows must not fire forty duplicate reads on every re-render.
    const avatarCache = new Map(); // jid -> dataUrl | null | Promise
    function useAvatar(api, jid) {
      const [url, setUrl] = useState(() => (typeof avatarCache.get(jid) === 'string' ? avatarCache.get(jid) : null));
      useEffect(() => {
        let cancelled = false;
        const cached = avatarCache.get(jid);
        if (typeof cached === 'string') { setUrl(cached); return undefined; }
        if (cached === null) { setUrl(null); return undefined; }
        const load = cached instanceof Promise ? cached : (async () => {
          const res = await api.fetch(`${SLOT}/chats/${encodeURIComponent(jid)}/picture`);
          const body = res.ok && res.status === 200 ? parseBody(res.body) : null;
          return body && typeof body.base64 === 'string' ? `data:${body.mime || 'image/jpeg'};base64,${body.base64}` : null;
        })();
        avatarCache.set(jid, load);
        load.then((result) => {
          // A MISS is not cached as a permanent fact: the helper answers undefined both for
          // "this contact has no picture" and for "that fetch failed", and treating a
          // transient failure as permanent means one hiccup costs every avatar until the
          // app is reopened. A hit caches; a miss simply clears the in-flight slot so a
          // later render can try again.
          if (result === null) avatarCache.delete(jid);
          else avatarCache.set(jid, result);
          if (!cancelled) setUrl(result);
        });
        return () => { cancelled = true; };
      }, [api, jid]);
      return url;
    }

    function Avatar({ api, jid, name, size }) {
      const url = useAvatar(api, jid);
      const style = url
        ? undefined
        : { background: `hsl(${avatarHue(jid)} 45% 52%)` };
      return (
        <div className="avatar" style={{ ...(style || {}), ...(size ? { width: size, height: size, fontSize: size * 0.38 } : {}) }} aria-hidden="true">
          {url ? <img src={url} alt="" /> : initialsOf(name)}
        </div>
      );
    }

    // ---- sidecar reads/writes, all through the governed seam
    function makeSidecarApi(api) {
      return {
        async chats() {
          const res = await api.fetch(`${SLOT}/chats`);
          if (!res.ok) return { error: res.error };
          if (res.status !== 200) return { error: { message: `helper answered ${res.status}` } };
          const body = parseBody(res.body);
          return { chats: (body && Array.isArray(body.chats) ? body.chats : []), sync: body && body.sync };
        },
        async history(jid) {
          const res = await api.fetch(`${SLOT}/chats/${encodeURIComponent(jid)}/history`);
          if (!res.ok || res.status !== 200) return { messages: [], sync: null };
          const body = parseBody(res.body);
          return { messages: (body && body.messages) || [], sync: body && body.sync };
        },
        async since(jid, ts) {
          const res = await api.fetch(`${SLOT}/chats/${encodeURIComponent(jid)}/messages${ts ? `?since=${ts}` : ''}`);
          if (!res.ok || res.status !== 200) return { messages: [] };
          const body = parseBody(res.body);
          return { messages: (body && body.messages) || [] };
        },
        async send(jid, text) {
          const res = await api.fetch(`${SLOT}/chats/${encodeURIComponent(jid)}/messages`, {
            method: 'POST',
            body: JSON.stringify({ text }),
          });
          if (!res.ok) return { error: (res.error && res.error.message) || 'the send was not delivered' };
          if (res.status !== 200) return { error: `the helper answered ${res.status}` };
          const body = parseBody(res.body);
          return { id: body && body.id };
        },
        async media(jid, mediaId) {
          const res = await api.fetch(`${SLOT}/chats/${encodeURIComponent(jid)}/media/${encodeURIComponent(mediaId)}`);
          if (!res.ok || res.status !== 200) return null;
          return parseBody(res.body);
        },
      };
    }

    // ---------------------------------------------------------------- the app

    function App() {
      const { isReady, theme, isWaiting, sendMessage } = useSnugApp({
        appId: 'telepath',
        displayName: 'Telepath',
        description: 'Your WhatsApp, live — with an analyst who knows the room and drafts in your voice.',
        iconEmoji: '🔮',
        iconColor: '#0f7d61',
      });
      const db = useAppDB();
      const api = useConnectedFetch();
      const sidecar = useMemo(() => makeSidecarApi(api), [api]);

      const [ui, setUi] = usePersistedState(KV_KEY, { openJid: null, tab: 'chat', readAt: {} });
      const [schemaReady, setSchemaReady] = useState(false);
      const [helper, setHelper] = useState({ phase: 'starting' }); // starting | up | down
      const [chats, setChats] = useState([]);
      const [thread, setThread] = useState({ jid: null, messages: [], sync: null, loading: false });
      const [draftText, setDraftText] = useState('');
      const [drafting, setDrafting] = useState(false);
      const [sending, setSending] = useState(false);
      const [analysing, setAnalysing] = useState(false);
      const [analysis, setAnalysis] = useState(null); // { payload, runAt, watermarkTs, nameMap }
      const [toast, setToast] = useState(null);
      const [lightbox, setLightbox] = useState(null); // dataUrl
      const msgsEndRef = useRef(null);
      const openJidRef = useRef(null);
      openJidRef.current = ui.openJid;

      useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);

      const say = useCallback((text) => {
        setToast(text);
        window.setTimeout(() => setToast((current) => (current === text ? null : current)), 3200);
      }, []);

      // Schema once, before any query.
      useEffect(() => {
        if (!isReady) return;
        let cancelled = false;
        (async () => {
          for (const stmt of DDL) await db.exec(stmt);
          if (!cancelled) setSchemaReady(true);
        })().catch(() => say('the app database could not be prepared'));
        return () => { cancelled = true; };
      }, [isReady, db, say]);

      // ---- chat list: the mount read IS the helper starter (the transport auto-starts
      // the sidecar on any governed request), and its failure is the status screen.
      const refreshChats = useCallback(async () => {
        const result = await sidecar.chats();
        if (result.error) {
          setHelper({ phase: 'down', detail: result.error.message || 'the helper is not reachable' });
          return false;
        }
        setHelper({ phase: 'up', ...(result.sync ? { sync: result.sync } : {}) });
        const sorted = result.chats.slice().sort((a, b) => (b.lastActivityTs || 0) - (a.lastActivityTs || 0));
        setChats(sorted);
        return true;
      }, [sidecar]);

      useEffect(() => {
        if (!isReady || !schemaReady) return;
        void refreshChats();
      }, [isReady, schemaReady, refreshChats]);

      // ---- open thread: render the local cache instantly, then refetch and merge.
      const loadThread = useCallback(async (jid) => {
        setThread((prev) => ({ ...prev, jid, loading: true }));
        const local = await db.exec(
          'SELECT id, author, text, ts, from_me, kind FROM messages WHERE jid = ? ORDER BY ts ASC',
          [jid],
        );
        const cached = local.rows.map((row) => ({
          id: row[0], from: row[1], text: row[2], ts: row[3], fromMe: row[4] === 1,
          ...(row[5] ? { kind: row[5] } : {}),
        }));
        setThread({ jid, messages: cached, sync: null, loading: cached.length === 0 });
        const fresh = await sidecar.history(jid);
        const merged = mergeMessages(cached, fresh.messages);
        setThread({ jid, messages: merged, sync: fresh.sync, loading: false });
        await persistMessages(jid, fresh.messages);
      }, [db, sidecar]);

      const persistMessages = useCallback(async (jid, rows) => {
        for (const row of rows) {
          await db.exec(
            'INSERT OR IGNORE INTO messages (jid, id, author, text, ts, from_me, kind) VALUES (?, ?, ?, ?, ?, ?, ?)',
            [jid, row.id, row.from || '', String(row.text || ''), row.ts || 0, row.fromMe === true ? 1 : 0, row.kind || null],
          );
        }
      }, [db]);

      const openThread = useCallback((jid) => {
        const row = chats.find((c) => c.jid === jid);
        setUi((prev) => ({
          ...prev,
          openJid: jid,
          tab: 'chat',
          // The badge clear is LOCAL display state — nothing is sent to WhatsApp, no read
          // receipt exists on this path at all.
          readAt: { ...prev.readAt, [jid]: (row && row.lastActivityTs) || Math.floor(Date.now() / 1000) },
        }));
        setAnalysis(null);
        void loadThread(jid);
      }, [chats, setUi, loadThread]);

      // ---- the doorbell: a hint means REFETCH (list always; open thread when named).
      useEffect(() => {
        if (!isReady || !schemaReady) return undefined;
        const onLive = ({ jids, resync }) => {
          void refreshChats();
          const openJid = openJidRef.current;
          if (openJid && (resync || jids.has(openJid))) {
            setThread((prev) => {
              const maxTs = prev.messages.reduce((max, row) => Math.max(max, row.ts || 0), 0);
              void (async () => {
                const fresh = await sidecar.since(openJid, Math.max(0, maxTs - 60));
                if (openJidRef.current !== openJid) return;
                setThread((current) => (current.jid === openJid
                  ? { ...current, messages: mergeMessages(current.messages, fresh.messages) }
                  : current));
                await persistMessages(openJid, fresh.messages);
                setUi((prevUi) => ({
                  ...prevUi,
                  readAt: { ...prevUi.readAt, [openJid]: Math.floor(Date.now() / 1000) },
                }));
              })();
              return prev;
            });
          }
        };
        liveListeners.add(onLive);
        return () => liveListeners.delete(onLive);
      }, [isReady, schemaReady, refreshChats, sidecar, persistMessages, setUi]);

      // Keep the newest message in view.
      useEffect(() => {
        if (ui.tab === 'chat') msgsEndRef.current?.scrollIntoView({ block: 'end' });
      }, [thread.messages, ui.tab, ui.openJid]);

      // ---- participants of the open thread, with display names (for the map and the UI).
      const openChat = chats.find((c) => c.jid === ui.openJid) || null;
      const nameByJid = useMemo(() => {
        const names = new Map();
        for (const chat of chats) {
          // A jid-placeholder is NOT a name: mapping it here fed the raw jid straight back
          // through displayName's truthiness check, bypassing fallbackLabel entirely.
          if (!chat.isGroup && chat.name && chat.name !== chat.jid) {
            names.set(chat.jid, chat.nameKind === 'push' ? '~' + chat.name : chat.name);
          }
          for (const part of chat.participants || []) {
            if (part.name && !names.has(part.jid)) {
              names.set(part.jid, part.nameKind === 'push' ? '~' + part.name : part.name);
            }
          }
        }
        return names;
      }, [chats]);
      const displayName = useCallback((jid, fromMe) => {
        if (fromMe) return 'You';
        const known = nameByJid.get(jid);
        if (known) return known;
        return fallbackLabel(jid);
      }, [nameByJid]);

      // ---- the pseudonym map for the open thread: persisted, extended, never shuffled.
      const loadMapEntries = useCallback(async (jid) => {
        const rows = await db.exec('SELECT identity, label FROM pseudonyms WHERE jid = ?', [jid]);
        return rows.rows.map((row) => [row[0], row[1]]);
      }, [db]);

      const persistMap = useCallback(async (jid, map) => {
        for (const [identity, label] of map.entries()) {
          await db.exec('INSERT OR REPLACE INTO pseudonyms (jid, identity, label) VALUES (?, ?, ?)', [jid, identity, label]);
        }
      }, [db]);

      const mapForThread = useCallback(async (jid, messages) => {
        const prior = await loadMapEntries(jid);
        const people = [];
        const seen = new Set();
        for (const row of messages) {
          const identity = row.from;
          if (!identity || seen.has(identity)) continue;
          seen.add(identity);
          people.push({ jid: identity, name: nameByJid.get(identity), isMe: row.fromMe === true });
        }
        const chat = chats.find((c) => c.jid === jid);
        for (const part of (chat && chat.participants) || []) {
          if (seen.has(part.jid)) continue;
          seen.add(part.jid);
          people.push({ jid: part.jid, name: part.name });
        }
        const map = extendPseudonymMap(prior, people);
        await persistMap(jid, map);
        return map;
      }, [loadMapEntries, persistMap, nameByJid, chats]);

      // ---- ANALYZE: first run = implicit full export → watermark → full profile;
      // after that = prior analysis + only the delta since the watermark.
      const runAnalysis = useCallback(async () => {
        const jid = ui.openJid;
        if (!jid || analysing) return;
        setAnalysing(true);
        try {
          // 1. The implicit export: full history from the helper, into the DB. Charts and
          //    future deltas read from here — the prompt gets a budgeted window.
          const fresh = await sidecar.history(jid);
          await persistMessages(jid, fresh.messages);
          const all = await db.exec('SELECT id, author, text, ts, from_me FROM messages WHERE jid = ? ORDER BY ts ASC', [jid]);
          const rows = all.rows.map((row) => ({ id: row[0], from: row[1], text: row[2], ts: row[3], fromMe: row[4] === 1 }));
          if (rows.length === 0) { say('nothing to analyse yet'); return; }
          const watermark = rows.reduce((max, row) => Math.max(max, row.ts || 0), 0);
          const map = await mapForThread(jid, rows);

          // 2. Prior run, if any — the incremental path sends it plus the delta only.
          const priorRow = await db.exec(
            'SELECT payload, watermark_ts FROM analyses WHERE jid = ? ORDER BY run_at DESC LIMIT 1', [jid],
          );
          const prior = priorRow.rows.length > 0 ? JSON.parse(priorRow.rows[0][0]) : null;
          const priorWatermark = priorRow.rows.length > 0 ? priorRow.rows[0][1] : 0;
          const delta = prior ? rows.filter((row) => (row.ts || 0) > priorWatermark) : rows;
          if (prior && delta.length === 0) { say('nothing new since the last analysis'); return; }

          const request = buildAnalysisRequest({
            messages: delta,
            map,
            priorAnalysis: prior || undefined,
            byteBudget: LLM_BYTE_BUDGET,
          });
          const stats = statsByParticipant(pseudonymizeForLlm(rows, map)).slice(0, 12);
          const action = prior ? 'reanalyse_thread' : 'profile_thread';
          const result = await sendMessage(action, { isGroup: openChat ? openChat.isGroup : jid.endsWith('@g.us') }, {
            state: {
              transcript: request.transcript,
              transcriptTruncated: request.truncated,
              ...(request.prior !== undefined ? { previousAnalysis: request.prior } : {}),
              messageStats: stats,
              sync: fresh.sync || undefined,
            },
            responseSchema: RESPONSE_SCHEMA,
          });
          if (!result.ok) { say(result.error && result.error.message ? result.error.message : 'the analysis failed'); return; }
          const payload = result.data;
          // Untrusted input: validate the shape locally before it touches the database.
          if (!payload || payload.kind !== 'profile' || !Array.isArray(payload.people)) {
            say('the model answered off-script — nothing was saved');
            return;
          }
          const runAt = new Date().toISOString();
          // Stored PSEUDONYMIZED, exactly as returned — names come back at render time.
          await db.exec('INSERT OR REPLACE INTO analyses (jid, run_at, watermark_ts, payload) VALUES (?, ?, ?, ?)',
            [jid, runAt, watermark, JSON.stringify(payload)]);
          await db.exec(
            'INSERT INTO threads (jid, name, is_group, last_activity_ts, analysed_at, analysis_watermark_ts) VALUES (?, ?, ?, ?, ?, ?) ON CONFLICT(jid) DO UPDATE SET analysed_at = excluded.analysed_at, analysis_watermark_ts = excluded.analysis_watermark_ts, name = excluded.name',
            [jid, (openChat && openChat.name) || jid, openChat && openChat.isGroup ? 1 : 0, watermark, runAt, watermark],
          );
          setAnalysis({ payload, runAt, watermarkTs: watermark, map });
          setUi((prev) => ({ ...prev, tab: 'insights' }));
        } catch (err) {
          say('the analysis hit an error — nothing was saved');
        } finally {
          setAnalysing(false);
        }
      }, [ui.openJid, analysing, sidecar, persistMessages, db, mapForThread, sendMessage, openChat, say, setUi]);

      // Load the stored analysis when a thread opens (so Insights shows the last run).
      useEffect(() => {
        const jid = ui.openJid;
        if (!jid || !schemaReady) return;
        let cancelled = false;
        (async () => {
          const row = await db.exec('SELECT payload, run_at, watermark_ts FROM analyses WHERE jid = ? ORDER BY run_at DESC LIMIT 1', [jid]);
          if (cancelled || row.rows.length === 0) { if (!cancelled) setAnalysis(null); return; }
          const entries = await loadMapEntries(jid);
          if (cancelled) return;
          setAnalysis({
            payload: JSON.parse(row.rows[0][0]),
            runAt: row.rows[0][1],
            watermarkTs: row.rows[0][2],
            map: new Map(entries),
          });
        })().catch(() => {});
        return () => { cancelled = true; };
      }, [ui.openJid, schemaReady, db, loadMapEntries]);

      // ---- DRAFT: the ✨ button — a reply in the user's own register and emoji habits.
      const runDraft = useCallback(async () => {
        const jid = ui.openJid;
        if (!jid || drafting || thread.messages.length === 0) return;
        setDrafting(true);
        try {
          const map = await mapForThread(jid, thread.messages);
          const recent = pseudonymizeForLlm(thread.messages.slice(-60), map);
          const mine = await db.exec('SELECT text, ts, from_me FROM messages WHERE jid = ? AND from_me = 1 ORDER BY ts DESC LIMIT 200', [jid]);
          const myRows = mine.rows.map((row) => ({ text: row[0], ts: row[1], fromMe: true }));
          const emoji = emojiFrequency(myRows).slice(0, 10);
          const voice = analysis && analysis.payload && analysis.payload.voice ? analysis.payload.voice : undefined;
          const samples = pseudonymizeForLlm(myRows.slice(0, 30), map).map((row) => row.text).filter((t) => t.length > 0);
          const result = await sendMessage('draft_reply', {}, {
            state: {
              recentTranscript: recent,
              myRecentMessages: samples,
              myEmojiHabits: emoji,
              ...(voice !== undefined ? { voice } : {}),
              ...(draftText.trim().length > 0 ? { userHint: draftText.trim() } : {}),
            },
            responseSchema: RESPONSE_SCHEMA,
          });
          if (!result.ok) { say(result.error && result.error.message ? result.error.message : 'the draft failed'); return; }
          const payload = result.data;
          if (!payload || payload.kind !== 'draft' || typeof payload.text !== 'string') {
            say('the model answered off-script');
            return;
          }
          // Into the composer, editable — NEVER auto-sent. Sending stays the user's tap.
          setDraftText(deanonymizeText(payload.text, map));
        } finally {
          setDrafting(false);
        }
      }, [ui.openJid, drafting, thread.messages, mapForThread, db, analysis, sendMessage, draftText, say]);

      // ---- SEND, through the one chokepoint (journaled; the host raises its confirm).
      const runSend = useCallback(async () => {
        const jid = ui.openJid;
        const text = draftText.trim();
        if (!jid || sending || text.length === 0) return;
        setSending(true);
        try {
          const result = await sidecar.send(jid, text);
          if (result.error) { say(result.error); return; }
          const nowTs = Math.floor(Date.now() / 1000);
          const optimistic = { id: result.id || `local-${nowTs}-${Math.random().toString(36).slice(2)}`, from: 'me', text, ts: nowTs, fromMe: true };
          setThread((prev) => (prev.jid === jid ? { ...prev, messages: mergeMessages(prev.messages, [optimistic]) } : prev));
          await persistMessages(jid, [optimistic]);
          await db.exec('INSERT INTO activity (jid, at, incoming, outgoing, mode) VALUES (?, ?, ?, ?, ?)',
            [jid, new Date().toISOString(), null, text, 'manual']);
          setDraftText('');
        } finally {
          setSending(false);
        }
      }, [ui.openJid, draftText, sending, sidecar, persistMessages, db, say]);

      // ---- media on tap: thumbnail rides the message row; the full image is one governed
      // read away, size-capped, never stored.
      const openMedia = useCallback(async (jid, row) => {
        if (row.thumbnailBase64 && !row.mediaId) { setLightbox(`data:image/jpeg;base64,${row.thumbnailBase64}`); return; }
        const media = await sidecar.media(jid, row.mediaId || row.id);
        if (media && typeof media.base64 === 'string') {
          setLightbox(`data:${media.mime || 'image/jpeg'};base64,${media.base64}`);
        } else if (media && media.tooLarge === true) {
          say('this photo is larger than the transport allows — showing the preview');
          if (media.thumbnailBase64 || row.thumbnailBase64) setLightbox(`data:image/jpeg;base64,${media.thumbnailBase64 || row.thumbnailBase64}`);
        } else if (row.thumbnailBase64) {
          setLightbox(`data:image/jpeg;base64,${row.thumbnailBase64}`);
        } else {
          say('this photo is no longer fetchable');
        }
      }, [sidecar, say]);

      // ---------------------------------------------------------- render

      if (!isReady) {
        return <div className="center-state" style={{ height: '100%' }}><div className="spin big">◌</div><div>connecting to Snug…</div></div>;
      }

      const badgeFor = (chat) => {
        const readTs = ui.readAt[chat.jid] || 0;
        if (chat.jid === ui.openJid) return 0;
        if ((chat.lastActivityTs || 0) <= readTs) return 0;
        return chat.unreadCount || 0;
      };
      const nowTs = Math.floor(Date.now() / 1000);

      const listPane = (
        <section className="list-pane" aria-label="chats">
          <div className="list-head">
            <div>
              <h1>Telepath</h1>
              <div className="brand-sub">your WhatsApp, with insight on tap</div>
            </div>
            <button className="icon-btn" title="refresh" aria-label="refresh chats" onClick={() => void refreshChats()}>↻</button>
          </div>
          <div className="chatlist">
            {helper.phase === 'down' && (
              <div className="center-state">
                <div className="big">📵</div>
                <div className="title">the WhatsApp helper is not reachable</div>
                <div style={{ fontSize: 13 }}>{helper.detail}</div>
                <button className="btn primary" onClick={() => void refreshChats()}>try again</button>
                <div style={{ fontSize: 12 }}>trying again also starts the helper if it is installed</div>
              </div>
            )}
            {helper.phase === 'starting' && <div className="center-state"><div className="spin big">◌</div><div>starting the helper…</div></div>}
            {helper.phase === 'up' && chats.length === 0 && (
              helper.sync && helper.sync.needsRelink ? (
                // NOT "still syncing": the helper has told us this session was scanned but
                // never finished registering, so sync will never begin. Saying "syncing"
                // here is a lie the user cannot see through (owner-reported 2026-08-17).
                <div className="center-state">
                  <div className="big">🔗</div>
                  <div className="title">this device needs linking again</div>
                  <div>the last link was interrupted before it finished, so WhatsApp never started sending your history</div>
                  <div style={{ fontSize: 13 }}>open the WhatsApp connection in Snug's settings and scan the QR again — your messages are safe on your phone</div>
                </div>
              ) : (
                <div className="center-state"><div className="big">💬</div><div>no chats yet — history is still syncing from your phone</div></div>
              )
            )}
            {helper.phase === 'up' && chats.map((chat) => {
              const badge = badgeFor(chat);
              return (
                <button key={chat.jid} className="chat-row" aria-current={chat.jid === ui.openJid} data-unread={badge > 0} onClick={() => openThread(chat.jid)}>
                  <Avatar api={api} jid={chat.jid} name={chatDisplayName(chat)} />
                  <span className="mid">
                    <span className="name">{chatDisplayName(chat)}</span>
                    <span className="preview">
                      {chat.lastMessage
                        ? `${chat.lastMessage.fromMe ? 'You: ' : ''}${chat.lastMessage.kind === 'image' ? '📷 Photo' + (chat.lastMessage.text ? ' · ' + chat.lastMessage.text : '') : chat.lastMessage.text}`
                        : (chat.isGroup ? 'group' : 'chat')}
                    </span>
                  </span>
                  <span className="side">
                    <span className="when">{fmtListTime(chat.lastActivityTs, nowTs)}</span>
                    {badge > 0 && <span className="unread-badge">{badge > 99 ? '99+' : badge}</span>}
                  </span>
                </button>
              );
            })}
          </div>
          <div className="tos-note">
            Linking automation to a personal WhatsApp account is against WhatsApp's terms and accounts have been banned.
            Analysis leaves for your configured model provider with names, numbers and contact ids replaced by neutral labels.
          </div>
        </section>
      );

      const openMessages = thread.jid === ui.openJid ? thread.messages : [];
      let lastDay = '';

      const threadPane = !ui.openJid ? (
        <section className="thread-pane center-state" aria-label="no chat open">
          <div className="big">🔮</div>
          <div className="title">Telepath</div>
          <div>pick a conversation — read it live, analyse it, answer in your own voice</div>
        </section>
      ) : (
        <section className="thread-pane" aria-label={`conversation with ${openChat ? chatDisplayName(openChat) : fallbackLabel(ui.openJid)}`}>
          <div className="thread-head">
            <button className="icon-btn back-btn" aria-label="back to chats" onClick={() => setUi((prev) => ({ ...prev, openJid: null }))}>‹</button>
            <Avatar api={api} jid={ui.openJid} name={openChat ? chatDisplayName(openChat) : '?'} size={38} />
            <div className="who">
              <div className="name">{openChat ? chatDisplayName(openChat) : fallbackLabel(ui.openJid)}</div>
              <div className="sub">
                {openChat && openChat.isGroup
                  ? `${(openChat.participants || []).length || 'group'} participants`
                  : 'direct chat'}
                {thread.sync && !thread.sync.complete ? ' · history still syncing' : ''}
                {thread.sync && thread.sync.complete && !thread.sync.explicit ? ' · history coverage inferred' : ''}
              </div>
            </div>
            <button
              className="icon-btn"
              title={analysis ? 'reanalyse (delta only)' : 'analyse this conversation'}
              aria-label="analyse this conversation"
              disabled={analysing}
              onClick={() => void runAnalysis()}
            >{analysing ? <span className="spin">◌</span> : '🧠'}</button>
          </div>

          <div className="thread-tabs" role="tablist">
            {['chat', 'insights', 'charts'].map((tab) => (
              <button key={tab} role="tab" aria-selected={ui.tab === tab} className="thread-tab" onClick={() => setUi((prev) => ({ ...prev, tab }))}>
                {tab === 'chat' ? 'Chat' : tab === 'insights' ? 'Insights' : 'Charts'}
              </button>
            ))}
          </div>

          {ui.tab === 'chat' && (
            <React.Fragment>
              <div className="msgs">
                {thread.loading && openMessages.length === 0 && <div className="center-state"><div className="spin big">◌</div></div>}
                {openMessages.map((row) => {
                  const day = dayKey(row.ts);
                  const sep = day !== lastDay ? <div className="day-sep" key={`sep-${row.id}`}>{fmtDayLabel(row.ts, nowTs)}</div> : null;
                  lastDay = day;
                  return (
                    <React.Fragment key={row.id}>
                      {sep}
                      <div className={`bubble${row.fromMe ? ' me' : ''}`}>
                        {openChat && openChat.isGroup && !row.fromMe && (
                          <div className="sender" style={{ color: `hsl(${avatarHue(row.from || '')} 55% 42%)` }}>{displayName(row.from, false)}</div>
                        )}
                        {row.kind === 'image' && (
                          row.thumbnailBase64 ? (
                            <button className="thumb" aria-label="open photo" onClick={() => void openMedia(ui.openJid, row)}>
                              <img src={`data:image/jpeg;base64,${row.thumbnailBase64}`} alt={row.text || 'photo'} />
                            </button>
                          ) : (
                            <button className="linklike" onClick={() => void openMedia(ui.openJid, row)}>📷 Photo — tap to load</button>
                          )
                        )}
                        {row.text && <div className="body">{row.text}</div>}
                        {row.kind === 'image' && !row.text && !row.thumbnailBase64 && <div className="media-note">photo</div>}
                        <span className="stamp">{fmtClock(row.ts)}</span>
                      </div>
                    </React.Fragment>
                  );
                })}
                <div ref={msgsEndRef} />
              </div>
              <div className="composer">
                <button
                  className="icon-btn"
                  title="draft a reply in my voice"
                  aria-label="draft a reply with AI"
                  disabled={drafting || isWaiting || openMessages.length === 0}
                  onClick={() => void runDraft()}
                >{drafting ? <span className="spin">◌</span> : '✨'}</button>
                <textarea
                  rows={1}
                  placeholder="Message — or tap ✨ for a draft in your voice"
                  value={draftText}
                  onChange={(e) => setDraftText(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); void runSend(); } }}
                />
                <button className="icon-btn" title="send" aria-label="send message" disabled={sending || draftText.trim().length === 0} onClick={() => void runSend()}>
                  {sending ? <span className="spin">◌</span> : '➤'}
                </button>
              </div>
            </React.Fragment>
          )}

          {ui.tab === 'insights' && (
            <InsightsTab analysis={analysis} analysing={analysing} onAnalyse={() => void runAnalysis()} displayName={displayName} />
          )}

          {ui.tab === 'charts' && (
            <ChartsTab db={db} jid={ui.openJid} theme={theme} displayName={displayName} schemaReady={schemaReady} messages={openMessages} />
          )}
        </section>
      );

      return (
        <div className="frame">
          <style>{`@media (max-width: 759px) { .list-pane { display: ${ui.openJid ? 'none' : 'flex'}; } .thread-pane { display: ${ui.openJid ? 'flex' : 'none'}; } }`}</style>
          {listPane}
          {threadPane}
          {lightbox && (
            <button className="lightbox" aria-label="close photo" onClick={() => setLightbox(null)}>
              <img src={lightbox} alt="photo" />
            </button>
          )}
          {toast && <div className="toast" role="status">{toast}</div>}
        </div>
      );
    }

    // ---------------------------------------------------------------- insights

    function InsightsTab({ analysis, analysing, onAnalyse, displayName }) {
      if (!analysis) {
        return (
          <div className="tab-scroll">
            <div className="center-state">
              <div className="big">🧠</div>
              <div className="title">no analysis yet</div>
              <div>the first run reads the whole conversation; later runs only what's new since</div>
              <button className="btn primary" disabled={analysing} onClick={onAnalyse}>{analysing ? 'analysing…' : 'analyse this conversation'}</button>
            </div>
          </div>
        );
      }
      const { payload, map, runAt } = analysis;
      const named = (text) => deanonymizeText(String(text || ''), map);
      // The label→person resolution for headings: prefer what the reverse map knows.
      return (
        <div className="tab-scroll">
          {payload.headline && <div className="panel"><div className="headline">{named(payload.headline)}</div>
            <p className="hint" style={{ marginTop: 6 }}>analysed {new Date(runAt).toLocaleString()} · names restored locally — the model only ever saw neutral labels</p>
          </div>}
          <div className="panel">
            <h3>the people</h3>
            {(payload.people || []).map((person) => (
              <div className="person" key={person.label}>
                <div className="p-name">{named(person.label)}</div>
                <div className="p-summary">{named(person.summary)}</div>
                <div>{(person.traits || []).map((trait, i) => <span className="trait" key={i}>{named(trait)}</span>)}</div>
              </div>
            ))}
          </div>
          {payload.dynamics && (
            <div className="panel">
              <h3>the room</h3>
              <p style={{ margin: 0 }}>{named(payload.dynamics)}</p>
            </div>
          )}
          {payload.voice && (
            <div className="panel">
              <h3>your voice here</h3>
              <p style={{ margin: '0 0 6px' }}>{named(payload.voice.tone || '')}</p>
              <p className="hint" style={{ margin: 0 }}>
                typical length: {payload.voice.typicalLength || '—'} · language: {payload.voice.language || '—'}
                {Array.isArray(payload.voice.emoji) && payload.voice.emoji.length > 0 ? ` · your emoji: ${payload.voice.emoji.join(' ')}` : ''}
              </p>
            </div>
          )}
        </div>
      );
    }

    // ---------------------------------------------------------------- charts

    const seriesColor = (n) => getComputedStyle(document.documentElement).getPropertyValue(`--series-${n}`).trim();
    const otherColor = () => getComputedStyle(document.documentElement).getPropertyValue('--series-other').trim();
    const inkSoft = () => getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim();
    const gridColor = () => getComputedStyle(document.documentElement).getPropertyValue('--viz-grid').trim();

    function useChart(canvasRef, buildConfig, deps) {
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || typeof Chart === 'undefined') return undefined;
        const config = buildConfig();
        if (!config) return undefined;
        const chart = new Chart(canvas, config);
        return () => chart.destroy();
        // eslint-style exhaustive deps are not available in-file; deps are threaded by hand.
      }, deps); // eslint-disable-line
    }

    function ChartsTab({ db, jid, theme, displayName, schemaReady, messages }) {
      const [rows, setRows] = useState(null);
      const [showNumbers, setShowNumbers] = useState(false);

      useEffect(() => {
        if (!schemaReady || !jid) return;
        let cancelled = false;
        (async () => {
