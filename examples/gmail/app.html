            title: 'Auto-trash future mail from ' + flagged[1].name,
            why: 'A filter stops it arriving at all — nothing already in your inbox is touched.',
            action: 'block',
            senders: [flagged[1].sender],
          });
        }
        return out;
      };

      const displayedSuggestions = agent.suggestions || LOCAL_SUGGESTIONS(flags, unsubs);

      if (!app.isReady || messages === null) {
        return (
          <div className="wrap">
            <div className="card">
              <div className="skel" style={{ height: 22, width: '45%', marginBottom: 12 }} />
              <div className="skel" style={{ height: 120 }} />
            </div>
          </div>
        );
      }

      const connected = syncState.phase === 'live';
      const busySync = syncState.phase === 'listing' || syncState.phase === 'reading';

      return (
        <div className="wrap">
          <div className="top">
            <div className="brand">
              <div className="mark">{'📬'}</div>
              <div>
                <h1>Inbox Copilot</h1>
                <div className="sub">
                  {connected
                    ? syncState.fetched + ' emails from the ' + (SYNC_WINDOWS.find((w) => w.id === windowId) || {}).label +
                      (account ? ' · ' + account : '')
                    : 'Sample inbox — connect Gmail to run this on your own mail'}
                </div>
              </div>
            </div>
            <div className="spacer" />
            {/*
              How far back Refresh reaches. Ninety days is the default because it is long
              enough for a pattern and short enough to finish; the wider windows cost real
              time (each message is its own metadata read), so the label says what it is
              rather than hiding the tradeoff behind a spinner.
            */}
            <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>
              <div className="windowpick" role="group" aria-label="How far back to read">
                {SYNC_WINDOWS.map((option) => (
                  <button
                    key={option.id}
                    className="btn small"
                    aria-pressed={windowId === option.id}
                    onClick={() => setWindowId(option.id)}
                    disabled={busySync}
                  >
                    {option.label}
                  </button>
                ))}
              </div>
              <button className="btn primary" onClick={() => sync()} disabled={busySync}>
                {busySync
                  ? <span><span className="spin">{'◌'}</span> reading {syncState.fetched}</span>
                  : connected ? 'Refresh' : 'Connect Gmail'}
              </button>
            </div>
          </div>

          {isSample ? (
            <div className="banner sample-note" data-sample-banner>
              <b>Sample data.</b>
              <span>{SAMPLE_NOTE}</span>
            </div>
          ) : null}

          {syncState.error ? (
            <div className="banner" style={{ background: 'var(--alert-soft)' }}>
              <b>Gmail did not answer.</b>
              <span>{syncState.error}</span>
            </div>
          ) : null}

          {runState.note ? (
            <div className="banner" style={{ background: 'var(--calm-soft)' }}>
              <span>{runState.note}</span>
            </div>
          ) : null}
          {runState.error ? (
            <div className="banner" style={{ background: 'var(--alert-soft)' }}>
              <b>That did not go through.</b>
              <span>{runState.error}</span>
            </div>
          ) : null}

          <div className="tabs" role="tablist">
            {[
              ['pulse', 'Pulse', null],
              ['attention', 'Needs you', flags.length],
              ['suggestions', 'Do this', displayedSuggestions.length],
              ['cleanup', 'Mass cleanup', selected.size || null],
            ].map(([key, label, pip]) => (
              <button key={key} className="tab" role="tab" aria-selected={tab === key} onClick={() => setTab(key)}>
                {label}
                {pip ? <span className="pip">{pip}</span> : null}
              </button>
            ))}
          </div>

          {pendingPlan ? (
            <div className="confirmbox" style={{ marginBottom: 14 }}>
              <div className="what"><b>Before anything happens.</b> {pendingPlan.summary}</div>
              <ul>
                <li>{pendingPlan.reversible}</li>
                {pendingPlan.chunks.length > 1
                  ? <li>Sent in {pendingPlan.chunks.length} batches — Gmail caps each one at {BATCH_MODIFY_LIMIT}.</li>
                  : null}
                <li>Your Snug host asks you again before it sends this.</li>
              </ul>
              <div className="row" style={{ gap: 9, flexWrap: 'wrap' }}>
                <button className="btn primary" onClick={runPlan} disabled={runState.busy}>
                  {runState.busy ? <span><span className="spin">{'◌'}</span> running</span> : 'Yes, do it'}
                </button>
                <button className="btn" onClick={() => setPendingPlan(null)}>Cancel</button>
              </div>
            </div>
          ) : null}

          {tab === 'pulse' ? (
            <div className="grid">
              <div className="grid g3">
                <div className="card">
                  <div className="stat">{totalThisWeek}<span className="unit">emails</span></div>
                  <div className="statlabel">arrived this week</div>
                </div>
                <div className="card">
                  <div className="stat" style={{ color: noiseShare > 40 ? 'var(--alert)' : 'var(--fg)' }}>
                    {noiseShare}<span className="unit">%</span>
                  </div>
                  <div className="statlabel">from senders you never answer</div>
                </div>
                <div className="card">
                  <div className="stat">{unsubs.filter((u) => u.channel !== 'none').length}<span className="unit">lists</span></div>
                  <div className="statlabel">you can leave in one click</div>
                </div>
              </div>

              <div className="card">
                <h2>Where your inbox is heading</h2>
                <p className="hint">
                  {weeks.length} {weeks.length === 1 ? 'week' : 'weeks'} of arrivals — the line is what a
                  person feels as "my inbox is getting worse".
                </p>
                <TrendChart weeks={weeks} />
              </div>

              <div className="grid g2">
                <div className="card">
                  <h2>Who is actually filling it</h2>
                  <p className="hint">Green means a real correspondence — you have written back at least once.</p>
                  <SenderBars senders={senders} />
                </div>
                <div className="card">
                  <h2>What it is made of</h2>
                  <p className="hint">Every message counted exactly once, so the shares add up.</p>
                  <CategoryDonut mix={mix} />
                </div>
              </div>

              <div className="card">
                <div className="row between" style={{ flexWrap: 'wrap', gap: 10 }}>
                  <div style={{ minWidth: 0 }}>
                    <h2>Ask about your inbox</h2>
                    <p className="hint" style={{ marginBottom: 0 }}>
                      The open chat lane is more powerful still — this box is for a quick question.
                    </p>
                  </div>
                  <button className="btn small" onClick={runDigest} disabled={agent.busy}>
                    {agent.busy ? 'thinking' : 'Morning briefing'}
                  </button>
                </div>
                {agent.digest ? (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ fontSize: 14.5, fontWeight: 600, marginBottom: 4 }}>{agent.digest.headline}</div>
                    <div className="hint" style={{ marginBottom: 0 }}>{agent.digest.summary}</div>
                  </div>
                ) : null}
                <div className="row" style={{ gap: 8, marginTop: 12, flexWrap: 'wrap' }}>
                  <input className="ask" style={{ flex: '1 1 240px' }} value={question}
                         placeholder="What should I clean up first?"
                         aria-label="Ask a question about your inbox"
                         onChange={(event) => setQuestion(event.target.value)}
                         onKeyDown={(event) => { if (event.key === 'Enter') runAnswer(); }} />
                  <button className="btn" onClick={runAnswer} disabled={agent.busy || !question.trim()}>Ask</button>
                </div>
                {answer ? (
                  <div className="answer">
                    {answer.pending ? <span className="spin">{'◌'}</span> : <AnswerView shape={answer.shape} />}
                  </div>
                ) : null}
                {agent.error ? <div className="hint" style={{ marginTop: 8, color: 'var(--alert)' }}>{agent.error}</div> : null}
              </div>
            </div>
          ) : null}

          {tab === 'attention' ? (
            <div className="grid g2">
              <div className="card">
                <h2>You have never written back</h2>
                <p className="hint">
                  Three or more emails, no reply from you, and not a receipt — receipts and anything
                  you have starred are left out on purpose, because nobody answers those either.
                </p>
                {flags.length === 0 ? <div className="empty">Nothing here. Your inbox is unusually well behaved.</div> : null}
                {flags.slice(0, 12).map((flag) => (
                  <div className="senderrow" key={flag.sender}>
                    <div className="avatar" style={{ background: swatchFor(flag.sender) }}>{initials(flag.name)}</div>
                    <div className="grow">
                      <div className="sname">{flag.name}</div>
                      <div className="saddr">{flag.sender}</div>
                    </div>
                    <span className="tag warn">{flag.received} emails</span>
                    <span className="tag">last {relDays(flag.daysSince)}</span>
                    <button className="btn small" onClick={() => stagePlan('trash', [flag.sender])}>Clear out</button>
                  </div>
                ))}
              </div>

              <div className="card">
                <h2>Lists you can leave</h2>
                <p className="hint">
                  These senders publish an unsubscribe route themselves. An email address is answered
                  with one confirmed send; a web link opens in your real browser, because this app
                  can only ever reach Gmail.
                </p>
                {unsubs.filter((u) => u.channel !== 'none').length === 0
                  ? <div className="empty">No unsubscribe headers found in the last 90 days.</div> : null}
                {unsubs.filter((u) => u.channel !== 'none').slice(0, 12).map((candidate) => (
                  <div className="senderrow" key={candidate.sender}>
                    <div className="avatar" style={{ background: swatchFor(candidate.sender) }}>{initials(candidate.name)}</div>
                    <div className="grow">
                      <div className="sname">{candidate.name}</div>
                      <div className="saddr">{candidate.received} emails · {candidate.channel === 'mailto' ? 'unsubscribes by email' : 'unsubscribes on the web'}</div>
                    </div>
                    <button className="btn small" onClick={() => runUnsubscribe(candidate)} disabled={runState.busy}>
                      Unsubscribe
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ) : null}

          {tab === 'suggestions' ? (
            <div className="grid">
              <div className="card">
                <div className="row between" style={{ flexWrap: 'wrap', gap: 10 }}>
                  <div style={{ minWidth: 0 }}>
                    <h2>Run these without leaving the page</h2>
                    <p className="hint" style={{ marginBottom: 0 }}>
                      Each one shows you exactly what it touches before anything happens.
                    </p>
                  </div>
                  <button className="btn small" onClick={runSuggestions} disabled={agent.busy}>
                    {agent.busy ? <span><span className="spin">{'◌'}</span> reading your inbox</span> : 'Ask the assistant'}
                  </button>
                </div>
              </div>
              <div className="grid g2">
                {displayedSuggestions.map((suggestion, index) => (
                  <div className="suggest" key={index}>
                    <div className="title">{suggestion.title}</div>
                    <div className="why">{suggestion.why}</div>
                    {suggestion.senders && suggestion.senders.length
                      ? <div className="pre">{suggestion.senders.join(', ')}</div> : null}
                    <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>
                      {suggestion.action === 'unsubscribe' ? (
                        <button className="btn small primary"
                                onClick={() => {
                                  const target = unsubs.find((candidate) => candidate.sender === (suggestion.senders || [])[0]);
                                  if (target) runUnsubscribe(target);
                                }}>
                          Unsubscribe
                        </button>
                      ) : suggestion.action !== 'none' ? (
                        <button className="btn small primary"
                                onClick={() => stagePlan(suggestion.action, suggestion.senders || [], { labelName: suggestion.labelName })}>
                          Preview it
                        </button>
                      ) : null}
                      <span className="tag">{suggestion.action}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : null}

          {tab === 'cleanup' ? (
            <div className="card">
              <h2>Pick senders, clean up everything at once</h2>
              <p className="hint">
                Select as many as you like. Whatever you choose, the plan is spelled out before it runs
                and nothing is ever deleted — mail moves to Trash, where Gmail keeps it for 30 days.
              </p>
              <div className="row" style={{ gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
                <button className="btn small" disabled={!selected.size} onClick={() => stagePlan('trash', [])}>
                  Move to Trash
                </button>
                <button className="btn small" disabled={!selected.size} onClick={() => stagePlan('label', [], { labelName: 'Snug/Sorted' })}>
                  File out of the inbox
                </button>
                <button className="btn small" disabled={!selected.size} onClick={() => stagePlan('spam', [])}>
                  Move to Spam
                </button>
                <button className="btn small danger" disabled={selected.size !== 1} onClick={() => stagePlan('block', [])}>
                  Block future mail
                </button>
                {selected.size ? <span className="tag">{selected.size} selected</span> : null}
              </div>
              {senderStats(rows)
                .sort((a, b) => b.received - a.received)
                .slice(0, 25)
                .map((stat) => (
                  <div className="senderrow" key={stat.sender}>
                    <Checkbox checked={selected.has(stat.sender)}
                              onToggle={() => toggle(stat.sender)}
                              label={'Select ' + stat.name} />
                    <div className="avatar" style={{ background: swatchFor(stat.sender) }}>{initials(stat.name)}</div>
                    <div className="grow">
                      <div className="sname">{stat.name}</div>
                      <div className="saddr">{stat.sender}</div>
                    </div>
                    <span className="tag">{stat.received}</span>
                    {stat.replied ? <span className="tag calm">you reply</span> : null}
                    {stat.transactional ? <span className="tag">receipts</span> : null}
                    {stat.endorsed ? <span className="tag calm">starred</span> : null}
                  </div>
                ))}
            </div>
          ) : null}

          <div className="foot">
            <span className="faint">
              {connected ? 'Reading metadata only — never the contents of your emails.' : 'Nothing has been connected yet.'}
            </span>
            <span className="faint">
              {isSample ? 'Sample data · ' + SAMPLE_SAVED_MINUTES + ' minutes of tidying, shown before you connect anything' : 'Your data stays in your own file.'}
            </span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
