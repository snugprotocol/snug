<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coinbase Trade Copilot</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #17171f; --muted: #6b7280;
    --card: #f4f4f8; --border: #e2e2ea; --accent: #0052FF;
    --up: #17a673; --down: #e0455a; --warn: #b8860b;
    --card2: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #10121a; --fg: #ececf4; --muted: #9a9aad;
    --card: #191c26; --border: #2b2e3a; --accent: #4d8dff;
    --up: #34d399; --down: #f87171; --warn: #eab308;
    --card2: #1f2230;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button { min-width: 44px; min-height: 44px; cursor: pointer; font-family: inherit; }
  input, select { font-family: inherit; }

  .connecting { display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); font-size:15px; }

  .shell { max-width: 1320px; margin: 0 auto; padding: 16px 16px 40px; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: 10px 4px 18px; flex-wrap: wrap;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-icon {
    width:38px; height:38px; border-radius:10px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    flex-shrink:0;
  }
  .brand-text h1 { font-size:17px; margin:0; font-weight:700; }
  .brand-text p { font-size:12px; margin:0; color:var(--muted); }

  .topbar-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .risk-select {
    background:var(--card); color:var(--fg); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:12px;
  }

  .conn-dot { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); padding:6px 10px; border:1px solid var(--border); border-radius:20px; background:var(--card); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.ok { background: var(--up); }
  .dot.bad { background: var(--down); }

  .grid {
    display:grid; gap:14px;
    grid-template-columns: 300px 1fr 340px;
    align-items:start;
  }
  @media (max-width: 1080px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px; overflow:hidden;
  }
  .panel h2 {
    font-size:13px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted);
    margin:0 0 10px; display:flex; align-items:center; justify-content:space-between;
  }
  .panel h2 .refresh-btn {
    min-width:auto; min-height:auto; background:none; border:none; color:var(--accent);
    font-size:12px; padding:2px 4px;
  }

  .empty-state {
    text-align:center; padding: 22px 10px; color:var(--muted); font-size:13px; line-height:1.5;
  }
  .empty-state .big-emoji { font-size:28px; display:block; margin-bottom:8px; }
  .connect-hint {
    background: var(--card2); border:1px dashed var(--border); border-radius:10px;
    padding:12px; font-size:12px; color:var(--muted); margin-top:8px;
  }

  .holding-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .holding-row:last-child { border-bottom:none; }
  .holding-ccy { font-weight:600; }
  .holding-sub { font-size:11px; color:var(--muted); }
  .portfolio-total { font-size:22px; font-weight:700; margin-bottom:2px; }
  .portfolio-total-label { font-size:11px; color:var(--muted); margin-bottom:10px; }

  .btn {
    background: var(--accent); color:#fff; border:none; border-radius:9px;
    padding:9px 14px; font-size:13px; font-weight:600;
  }
  .btn.secondary { background: var(--card2); color:var(--fg); border:1px solid var(--border); }
  .btn.buy { background: var(--up); }
  .btn.sell { background: var(--down); }
  .btn:disabled { opacity:0.5; cursor:default; }
  .btn-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

  .watchlist-item {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 8px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .watchlist-item:hover { background: var(--card2); }
  .watchlist-item.active { background: var(--accent); color:#fff; }
  .watchlist-item .rm { opacity:0.5; font-size:11px; }

  .asset-search {
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
    background: var(--card2); color:var(--fg); font-size:13px; margin-bottom:8px;
  }
  .search-results {
    max-height:160px; overflow-y:auto; border:1px solid var(--border); border-radius:9px;
    margin-bottom:10px; background:var(--card2);
  }
  .search-result-row {
    display:flex; justify-content:space-between; padding:7px 10px; font-size:12px;
    cursor:pointer; border-bottom:1px solid var(--border);
  }
  .search-result-row:last-child { border-bottom:none; }
  .search-result-row:hover { background: var(--card); }

  .ticker-card { display:flex; flex-direction:column; gap:2px; margin-bottom:12px; }
  .ticker-symbol { font-size:13px; color:var(--muted); }
  .ticker-price { font-size:32px; font-weight:800; letter-spacing:-0.5px; }
  .ticker-change { font-size:13px; font-weight:600; }
  .ticker-change.up { color: var(--up); }
  .ticker-change.down { color: var(--down); }
  .ticker-meta { font-size:11px; color:var(--muted); margin-top:4px; }

  .sparkline-wrap { margin: 6px 0 12px; }

  .book-cols { display:flex; gap:10px; }
  .book-col { flex:1; min-width:0; }
  .book-col h3 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .book-row {
    position:relative; display:flex; justify-content:space-between; font-size:11.5px;
    padding:3px 6px; border-radius:4px; margin-bottom:2px; overflow:hidden; font-variant-numeric: tabular-nums;
  }
  .book-row .bar { position:absolute; top:0; bottom:0; right:0; z-index:0; opacity:0.18; }
  .book-row.bid .bar { background: var(--up); }
  .book-row.ask .bar { background: var(--down); }
  .book-row span { position:relative; z-index:1; }
  .book-row.bid { color: var(--up); }
  .book-row.ask { color: var(--down); }

  .form-row { margin-bottom:10px; }
  .form-row label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .form-row input, .form-row select {
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
    background: var(--card2); color:var(--fg); font-size:13px;
  }
  .side-toggle { display:flex; gap:6px; margin-bottom:10px; }
  .side-toggle button { flex:1; border-radius:9px; border:1px solid var(--border); background:var(--card2); color:var(--fg); font-size:13px; font-weight:600; padding:9px; }
  .side-toggle button.active.buy { background: var(--up); color:#fff; border-color:var(--up); }
  .side-toggle button.active.sell { background: var(--down); color:#fff; border-color:var(--down); }
  .type-toggle { display:flex; gap:6px; margin-bottom:10px; }
  .type-toggle button { flex:1; border-radius:9px; border:1px solid var(--border); background:var(--card2); color:var(--fg); font-size:12px; padding:7px; }
  .type-toggle button.active { background: var(--accent); color:#fff; border-color:var(--accent); }

  .notice { border-radius:9px; padding:9px 11px; font-size:12px; margin-top:8px; line-height:1.4; }
  .notice.error { background: rgba(224,69,90,0.12); color: var(--down); border:1px solid rgba(224,69,90,0.3); }
  .notice.success { background: rgba(23,166,115,0.12); color: var(--up); border:1px solid rgba(23,166,115,0.3); }
  .notice.info { background: rgba(77,141,255,0.1); color: var(--accent); border:1px solid rgba(77,141,255,0.3); }

  .order-log-row { font-size:11.5px; padding:7px 0; border-bottom:1px solid var(--border); }
  .order-log-row:last-child { border-bottom:none; }
  .order-log-top { display:flex; justify-content:space-between; }
  .order-log-side { font-weight:700; }
  .order-log-side.buy { color: var(--up); }
  .order-log-side.sell { color: var(--down); }
  .order-log-status { font-size:10px; color:var(--muted); }

  .copilot-panel { grid-column: 1 / -1; margin-top:2px; }
  .copilot-feed { display:flex; flex-direction:column; gap:10px; max-height: 360px; overflow-y:auto; padding-right:4px; }
  .copilot-note {
    display:flex; gap:10px; background: var(--card2); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px;
  }
  .copilot-avatar {
    width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
  }
  .copilot-body { flex:1; min-width:0; }
  .copilot-head { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
  .copilot-name { font-weight:700; font-size:12.5px; }
  .copilot-time { font-size:10.5px; color:var(--muted); }
  .tag { font-size:10px; padding:2px 7px; border-radius:20px; border:1px solid var(--border); color:var(--muted); }
  .tag.sentiment-bullish { color: var(--up); border-color: var(--up); }
  .tag.sentiment-bearish, .tag.sentiment-cautious { color: var(--down); border-color: var(--down); }
  .tag.risk-high { color: var(--down); border-color: var(--down); }
  .tag.risk-medium { color: var(--warn); border-color: var(--warn); }
  .tag.risk-low { color: var(--up); border-color: var(--up); }
  .copilot-msg { font-size:13px; line-height:1.5; }
  .copilot-suggestion { margin-top:6px; font-size:12px; padding:7px 9px; background:var(--card); border-radius:8px; border-left:3px solid var(--accent); }
  .copilot-flags { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .flag-chip { font-size:10.5px; padding:2px 8px; border-radius:20px; background: rgba(224,69,90,0.12); color:var(--down); }

  .spinner { display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid var(--border); border-top-color: var(--accent); animation: spin 0.7s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .muted-small { font-size:11px; color:var(--muted); }
  .divider { height:1px; background:var(--border); margin:12px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ============================================================
// 1. SNUG BRIDGE RUNTIME (MANDATORY — copy exactly, never edit)
// ============================================================
const SnugBridge = {
  instanceId: null,
  theme: 'light',
  capabilities: {},
  ready: false,
  pending: new Map(),    // requestId -> { resolve, onStream }
  dbPending: new Map(),  // requestId -> resolve
  netPending: new Map(), // requestId -> resolve
  listeners: new Set(),  // re-render triggers for hooks

  post(frame) {
    window.parent.postMessage({ v: 1, instanceId: this.instanceId, ...frame }, '*');
  },
  notify() { for (const fn of this.listeners) fn(); },
};

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.v !== 1) return;

  if (data.type === 'snug:host-ready') {
    SnugBridge.instanceId = data.instanceId;
    if (data.theme) SnugBridge.theme = data.theme;
    if (data.capabilities) SnugBridge.capabilities = data.capabilities;
    SnugBridge.ready = true;
    SnugBridge.notify();
    return;
  }

  if (data.type === 'snug:app-response') {
    const entry = SnugBridge.pending.get(data.requestId);
    if (!entry) return; // unknown or superseded requestId — ignore
    if (data.streaming) {
      // Cumulative provisional text — display only. NEVER resolve here.
      if (entry.onStream && typeof data.text === 'string') entry.onStream(data.text);
      return;
    }
    SnugBridge.pending.delete(data.requestId); // terminal — exactly one per requestId
    entry.resolve(data.ok ? { ok: true, data: data.data } : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:db-response') {
    const resolve = SnugBridge.dbPending.get(data.requestId);
    if (!resolve) return;
    SnugBridge.dbPending.delete(data.requestId);
    // Result fields (rows/columns/value/bytesBase64) live at the TOP LEVEL of the frame.
    resolve(data.ok
      ? { ok: true, rows: data.rows, columns: data.columns, value: data.value, bytesBase64: data.bytesBase64 }
      : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:net-response') {
    const resolve = SnugBridge.netPending.get(data.requestId);
    if (!resolve) return;
    SnugBridge.netPending.delete(data.requestId);
    // Result fields (status/headers/body/truncated) live at the TOP LEVEL of the frame.
    resolve(data.ok
      ? { ok: true, status: data.status, headers: data.headers, body: data.body, truncated: data.truncated }
      : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:host-event') {
    if (data.event === 'theme-change' && data.data && data.data.theme) {
      SnugBridge.theme = data.data.theme;
      SnugBridge.notify();
    }
    // Unknown host events MUST be ignored (the protocol is additive).
  }
});

function snugDbRequest(op, args) {
  return new Promise((resolve) => {
    const requestId = crypto.randomUUID();
    SnugBridge.dbPending.set(requestId, resolve);
    SnugBridge.post({ type: 'snug:db-request', requestId, op, ...args });
  });
}

function snugNetRequest(fields) {
  if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
  return new Promise((resolve) => {
    const requestId = crypto.randomUUID();
    SnugBridge.netPending.set(requestId, resolve);
    SnugBridge.post({ type: 'snug:net-request', requestId, ...fields });
  });
}

// ============================================================
// 2. useSnugApp (MANDATORY — copy exactly, never edit)
// ============================================================
function useSnugApp(meta) {
  const [, setTick] = useState(0);
  const [isWaiting, setIsWaiting] = useState(false);
  const [lastResponse, setLastResponse] = useState(null);
  const inFlight = useRef(0);
  const metaRef = useRef(meta);

  useEffect(() => {
    const rerender = () => setTick((n) => n + 1);
    SnugBridge.listeners.add(rerender);
    const m = metaRef.current;
    SnugBridge.post({
      type: 'snug:app-announce',
      appId: m.appId,
      displayName: m.displayName,
      description: m.description,
      iconEmoji: m.iconEmoji,
      iconColor: m.iconColor,
    });
    return () => SnugBridge.listeners.delete(rerender);
  }, []);

  const sendMessage = useCallback((action, payload, opts) => {
    if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
    const requestId = crypto.randomUUID(); // fresh per request — multiple in flight are legal
    inFlight.current += 1;
    setIsWaiting(true);
    return new Promise((resolve) => {
      SnugBridge.pending.set(requestId, {
        onStream: opts && opts.onStream,
        resolve: (result) => {
          inFlight.current -= 1;
          if (inFlight.current === 0) setIsWaiting(false);
          setLastResponse(result);
          resolve(result);
        },
      });
      SnugBridge.post({
        type: 'snug:app-message',
        requestId,
        appId: metaRef.current.appId,
        action,
        payload,
        state: opts && opts.state,
        responseSchema: opts && opts.responseSchema,
      });
    });
  }, []);

  return {
    isReady: SnugBridge.ready,
    theme: SnugBridge.theme,
    isWaiting,
    lastResponse,
    sendMessage,
  };
}

// ============================================================
// 3. usePersistedState (MANDATORY — copy exactly, never edit)
// Storage is HOST-BROKERED key-value. The sandboxed iframe has a
// null origin: no browser storage API works here.
// ============================================================
function usePersistedState(key, initialValue) {
  const [state, setState] = useState(initialValue);
  // Tracks WHICH key hydrated: a key change must re-hydrate before any write-back,
  // or the old key's state would overwrite the new key's stored value.
  const [hydratedKey, setHydratedKey] = useState(null);
  const initialRef = useRef(initialValue);

  useEffect(() => {
    let cancelled = false;
    const hydrate = async () => {
      const result = await snugDbRequest('kvGet', { key });
      if (cancelled) return;
      if (result.ok && result.value != null) {
        const stored = result.value;
        const init = initialRef.current;
        // Merge objects with defaults so fields added in newer code are never undefined.
        setState(
          stored && typeof stored === 'object' && !Array.isArray(stored) &&
          init && typeof init === 'object' && !Array.isArray(init)
            ? { ...init, ...stored }
            : stored
        );
      } else {
        setState(initialRef.current); // nothing stored under this key — back to defaults
      }
      setHydratedKey(key);
    };
    const onReady = () => {
      if (!SnugBridge.ready) return;
      SnugBridge.listeners.delete(onReady);
      hydrate();
    };
    if (SnugBridge.ready) hydrate();
    else SnugBridge.listeners.add(onReady);
    return () => { cancelled = true; SnugBridge.listeners.delete(onReady); };
  }, [key]);

  useEffect(() => {
    if (hydratedKey !== key) return;
    snugDbRequest('kvSet', { key, value: state }); // fire-and-forget; host acks via db-response
  }, [hydratedKey, key, state]);

  return [state, setState];
}

// ============================================================
// 4. useAppDB (copy exactly when the app needs SQL; omit otherwise)
// ============================================================
function useAppDB() {
  return useMemo(() => ({
    async exec(sql, params) {
      const result = await snugDbRequest('exec', { sql, params });
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db exec failed');
      return { rows: result.rows, columns: result.columns }; // { rows: unknown[][], columns: string[] }
    },
    async exportDb() {
      const result = await snugDbRequest('export', {});
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db export failed');
      return result.bytesBase64;
    },
    async importDb(bytesBase64) {
      const result = await snugDbRequest('import', { bytesBase64 });
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db import failed');
    },
  }), []);
}

// ============================================================
// 5. useConnectedFetch (copy exactly when the app calls an approved API; omit otherwise)
// The sandboxed app has NO network of its own. This reaches ONLY your app's APPROVED
// hosts THROUGH the host, which injects your saved credentials, caps sizes, asks you
// before any write, and scrubs the response. You never see a token.
// A connection whose host only the USER knows (a device on their network): address it as
// snug-connection://<slot>/<path> — the host resolves the approved address; you never learn it.
// ALWAYS resolves: { ok:true, status, headers, body } or { ok:false, error }.
// ============================================================
function useConnectedFetch() {
  return useMemo(() => ({
    fetch(url, opts) {
      return snugNetRequest({
        url,
        method: (opts && opts.method) || 'GET',
        headers: opts && opts.headers,
        body: opts && opts.body,
      });
    },
  }), []);
}

// ============================================================
// 5. RESPONSE SCHEMA — describe the JSON the agent must return
// ============================================================
const RESPONSE_SCHEMA = {
  kind: "string: 'portfolio_review' | 'order_check' | 'market_take'",
  message: "string: human-readable commentary in the copilot's voice (ALWAYS include)",
  sentiment: "string: 'bullish' | 'bearish' | 'neutral' | 'cautious'",
  riskLevel: "string: 'low' | 'medium' | 'high'",
  suggestion: "string (optional): one concrete, non-guaranteed suggestion",
  flags: "array of strings (optional): short risk warnings e.g. 'concentration risk', 'thin book'",
};

// ============================================================
// Helpers
// ============================================================
const COINBASE_HOST = 'https://api.coinbase.com';
const POPULAR_PRODUCTS = ['BTC-USD', 'ETH-USD', 'SOL-USD', 'DOGE-USD', 'XRP-USD', 'AVAX-USD'];

function safeNum(v, fallback) {
  const n = Number(v);
  return Number.isFinite(n) ? n : (fallback === undefined ? 0 : fallback);
}

function parseBody(body) {
  if (body == null) return null;
  if (typeof body === 'object') return body;
  if (typeof body === 'string') {
    try { return JSON.parse(body); } catch (e) { return null; }
  }
  return null;
}

function fmtUSD(n, opts) {
  const num = safeNum(n, 0);
  try {
    return new Intl.NumberFormat('en-US', {
      style: 'currency', currency: 'USD',
      minimumFractionDigits: opts && opts.decimals != null ? opts.decimals : (Math.abs(num) < 1 ? 4 : 2),
      maximumFractionDigits: opts && opts.decimals != null ? opts.decimals : (Math.abs(num) < 1 ? 6 : 2),
    }).format(num);
  } catch (e) {
    return '$' + num.toFixed(2);
  }
}

function fmtPct(n) {
  const num = safeNum(n, 0);
  return (num > 0 ? '+' : '') + num.toFixed(2) + '%';
}

function fmtQty(n) {
  const num = safeNum(n, 0);
  if (num === 0) return '0';
  if (Math.abs(num) < 1) return num.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  return num.toLocaleString('en-US', { maximumFractionDigits: 4 });
}

function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return '';
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function Sparkline({ points, up }) {
  if (!points || points.length < 2) {
    return <div className="muted-small">Collecting live samples…</div>;
  }
  const w = 260, h = 44, pad = 3;
  const min = Math.min(...points), max = Math.max(...points);
  const range = (max - min) || 1;
  const step = (w - pad * 2) / (points.length - 1);
  const path = points.map((p, i) => {
    const x = pad + i * step;
    const y = h - pad - ((p - min) / range) * (h - pad * 2);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const color = up ? 'var(--up)' : 'var(--down)';
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} style={{ display: 'block' }}>
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

// APP
// ============================================================
function App() {
  const { isReady, theme, isWaiting, sendMessage } = useSnugApp({
    appId: 'coinbase-trade-copilot',
    displayName: 'Coinbase Trade Copilot',
    description: 'A live crypto dashboard: your Coinbase portfolio, real-time prices and order books, one-click trading, and an AI copilot that reviews your positions and orders.',
    iconEmoji: '📈',
    iconColor: '#0052FF',
  });
  const connectedFetch = useConnectedFetch();
  const db = useAppDB();

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
  }, [theme]);

  const [prefs, setPrefs] = usePersistedState('coinbase-copilot-prefs', {
    selectedProductId: 'BTC-USD',
    riskTolerance: 'balanced',
    orderForm: { side: 'BUY', orderType: 'MARKET', quoteSize: '25', baseSize: '', limitPrice: '' },
  });

  // Connection / data state
  const [products, setProducts] = useState([]);
  const [productsError, setProductsError] = useState(null);
  const [productsLoading, setProductsLoading] = useState(false);

  const [accounts, setAccounts] = useState([]);
  const [accountsError, setAccountsError] = useState(null);
  const [accountsLoading, setAccountsLoading] = useState(false);

  const [ticker, setTicker] = useState(null);
  const [tickerError, setTickerError] = useState(null);
  const [book, setBook] = useState({ bids: [], asks: [] });
  const [bookError, setBookError] = useState(null);
  const priceHistoryRef = useRef({});
  const [historyTick, setHistoryTick] = useState(0);

  const [watchlist, setWatchlist] = useState([]);
  const [search, setSearch] = useState('');

  const [ordersLog, setOrdersLog] = useState([]);
  const [copilotNotes, setCopilotNotes] = useState([]);

  const [placingOrder, setPlacingOrder] = useState(false);
  const [orderNotice, setOrderNotice] = useState(null);
  const [copilotBusy, setCopilotBusy] = useState(false);
  const [copilotNotice, setCopilotNotice] = useState(null);

  const pollingRef = useRef({ inFlight: false });
  const selectedProductId = prefs.selectedProductId || 'BTC-USD';
  const orderForm = prefs.orderForm || { side: 'BUY', orderType: 'MARKET', quoteSize: '25', baseSize: '', limitPrice: '' };

  const setOrderForm = (patch) => {
    setPrefs((prev) => ({ ...prev, orderForm: { ...(prev.orderForm || {}), ...patch } }));
  };
  const setSelectedProductId = (id) => {
    setPrefs((prev) => ({ ...prev, selectedProductId: id }));
  };
  const setRiskTolerance = (v) => setPrefs((prev) => ({ ...prev, riskTolerance: v }));

  // ---- Data loaders --------------------------------------------------
  const loadProducts = useCallback(async () => {
    setProductsLoading(true);
    const res = await connectedFetch.fetch(
      COINBASE_HOST + '/api/v3/brokerage/market/products?product_type=SPOT&limit=250'
    );
    setProductsLoading(false);
    if (!res.ok) {
      setProductsError(res.error && res.error.message ? res.error.message : 'Could not reach Coinbase.');
      return;
    }
    if (res.status && res.status >= 400) {
      setProductsError('Coinbase responded with an error (status ' + res.status + ').');
      return;
    }
    const parsed = parseBody(res.body);
    const list = (parsed && Array.isArray(parsed.products)) ? parsed.products : [];
    if (!list.length) {
      setProductsError('No products returned.');
      return;
    }
    setProductsError(null);
    setProducts(list.filter((p) => (p.quote_currency_id === 'USD' || p.quote_display_symbol === 'USD') && p.status !== 'delisted'));
  }, [connectedFetch]);

  const loadAccounts = useCallback(async () => {
    setAccountsLoading(true);
    const res = await connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/accounts?limit=250');
    setAccountsLoading(false);
    if (!res.ok) {
      setAccountsError(res.error && res.error.message ? res.error.message : 'Not connected to Coinbase yet.');
      return;
    }
    if (res.status && res.status >= 400) {
      setAccountsError('Coinbase rejected the accounts request (status ' + res.status + '). Check the connected API key’s permissions.');
      return;
    }
    const parsed = parseBody(res.body);
    const list = (parsed && Array.isArray(parsed.accounts)) ? parsed.accounts : [];
    setAccountsError(null);
    setAccounts(list.filter((a) => safeNum(a.available_balance && a.available_balance.value) > 0 || a.default));
  }, [connectedFetch]);

  const loadTickerAndBook = useCallback(async (productId) => {
    if (!productId || pollingRef.current.inFlight) return;
    if (document.visibilityState === 'hidden') return;
    pollingRef.current.inFlight = true;
    const [pRes, bRes] = await Promise.all([
      connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/market/products/' + encodeURIComponent(productId)),
      connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/market/product_book?product_id=' + encodeURIComponent(productId) + '&limit=14'),
    ]);
    pollingRef.current.inFlight = false;

    if (!pRes.ok || (pRes.status && pRes.status >= 400)) {
      setTickerError((pRes.error && pRes.error.message) || 'Live price feed unavailable — connect Coinbase to see market data.');
    } else {
      const parsed = parseBody(pRes.body);
      if (parsed && parsed.price != null) {
        setTickerError(null);
        setTicker(parsed);
        const hist = priceHistoryRef.current;
        const arr = hist[productId] || [];
        arr.push(safeNum(parsed.price));
        if (arr.length > 40) arr.shift();
        hist[productId] = arr;
        setHistoryTick((n) => n + 1);
      } else {
        setTickerError('Unexpected response shape from Coinbase.');
      }
    }

    if (!bRes.ok || (bRes.status && bRes.status >= 400)) {
      setBookError((bRes.error && bRes.error.message) || 'Order book unavailable — connect Coinbase to see live depth.');
    } else {
      const parsed = parseBody(bRes.body);
      const pb = parsed && parsed.pricebook;
      if (pb) {
        setBookError(null);
        setBook({ bids: Array.isArray(pb.bids) ? pb.bids : [], asks: Array.isArray(pb.asks) ? pb.asks : [] });
      } else {
        setBookError('Unexpected order book response.');
      }
    }
  }, [connectedFetch]);

  const loadWatchlist = useCallback(async () => {
    try {
      const { rows } = await db.exec('SELECT product_id FROM watchlist ORDER BY created_at ASC');
      setWatchlist((rows || []).map((r) => r[0]));
    } catch (e) { /* table not ready yet — ignore */ }
  }, [db]);

  const loadOrdersLog = useCallback(async () => {
    try {
      const { rows } = await db.exec(
        'SELECT created_at, product_id, side, order_type, base_size, quote_size, limit_price, status, coinbase_order_id FROM orders_log ORDER BY id DESC LIMIT 12'
      );
      setOrdersLog((rows || []).map((r) => ({
        createdAt: r[0], productId: r[1], side: r[2], orderType: r[3],
        baseSize: r[4], quoteSize: r[5], limitPrice: r[6], status: r[7], coinbaseOrderId: r[8],
      })));
    } catch (e) { /* ignore */ }
  }, [db]);

  const loadCopilotNotes = useCallback(async () => {
    try {
      const { rows } = await db.exec(
        'SELECT created_at, product_id, kind, sentiment, risk_level, message, suggestion FROM copilot_notes ORDER BY id DESC LIMIT 20'
      );
      setCopilotNotes((rows || []).map((r) => ({
        createdAt: r[0], productId: r[1], kind: r[2], sentiment: r[3], riskLevel: r[4], message: r[5], suggestion: r[6],
      })));
    } catch (e) { /* ignore */ }
  }, [db]);

  // ---- Effects ---------------------------------------------------------
  useEffect(() => {
    if (!isReady) return;
    loadProducts();
    loadAccounts();
    loadWatchlist();
    loadOrdersLog();
    loadCopilotNotes();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isReady]);

  useEffect(() => {
    if (!isReady || !selectedProductId) return;
    loadTickerAndBook(selectedProductId);
    const interval = setInterval(() => loadTickerAndBook(selectedProductId), 4000);
    return () => clearInterval(interval);
  }, [isReady, selectedProductId, loadTickerAndBook]);

  // ---- Actions ---------------------------------------------------------
  const addToWatchlist = async (productId) => {
    if (!productId || watchlist.includes(productId)) return;
    try {
      await db.exec('INSERT OR IGNORE INTO watchlist (product_id, created_at) VALUES (?, ?)', [productId, new Date().toISOString()]);
      loadWatchlist();
    } catch (e) { /* ignore */ }
  };
  const removeFromWatchlist = async (productId, e) => {
    if (e) e.stopPropagation();
    try {
      await db.exec('DELETE FROM watchlist WHERE product_id = ?', [productId]);
      loadWatchlist();
    } catch (e2) { /* ignore */ }
  };

  const totalPortfolioUsd = useMemo(() => {
    return accounts.reduce((sum, a) => {
      const ccy = a.currency;
      const bal = safeNum(a.available_balance && a.available_balance.value);
      if (ccy === 'USD' || ccy === 'USDC') return sum + bal;
      const prod = products.find((p) => p.base_currency_id === ccy && (p.quote_currency_id === 'USD'));
      const px = prod ? safeNum(prod.price) : (ccy === selectedProductId.split('-')[0] ? safeNum(ticker && ticker.price) : 0);
      return sum + bal * px;
    }, 0);
  }, [accounts, products, ticker, selectedProductId]);

  const validateOrder = () => {
    if (orderForm.orderType === 'MARKET') {
      if (orderForm.side === 'BUY' && safeNum(orderForm.quoteSize) <= 0) return 'Enter a USD amount to buy.';
      if (orderForm.side === 'SELL' && safeNum(orderForm.baseSize) <= 0) return 'Enter a quantity to sell.';
    } else {
      if (safeNum(orderForm.baseSize) <= 0) return 'Enter a quantity.';
      if (safeNum(orderForm.limitPrice) <= 0) return 'Enter a limit price.';
    }
    return null;
  };

  const buildOrderConfiguration = () => {
    if (orderForm.orderType === 'MARKET') {
      return orderForm.side === 'BUY'
        ? { market_market_ioc: { quote_size: String(safeNum(orderForm.quoteSize)) } }
        : { market_market_ioc: { base_size: String(safeNum(orderForm.baseSize)) } };
    }
    return { limit_limit_gtc: { base_size: String(safeNum(orderForm.baseSize)), limit_price: String(safeNum(orderForm.limitPrice)), post_only: false } };
  };

  const submitOrder = async () => {
    const err = validateOrder();
    if (err) { setOrderNotice({ type: 'error', text: err }); return; }
    setPlacingOrder(true);
    setOrderNotice(null);
    const orderBody = {
      client_order_id: crypto.randomUUID(),
      product_id: selectedProductId,
      side: orderForm.side,
      order_configuration: buildOrderConfiguration(),
    };
    const res = await connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderBody),
    });
    setPlacingOrder(false);

    let status = 'error';
    let coinbaseOrderId = null;
    let rawText = '';
    if (!res.ok) {
      setOrderNotice({ type: 'error', text: (res.error && res.error.message) || 'Order failed — Coinbase is not connected yet.' });
      rawText = JSON.stringify(res.error || {});
    } else {
      const parsed = parseBody(res.body);
      rawText = JSON.stringify(parsed || res.body || {});
      if (parsed && parsed.success) {
        status = 'submitted';
        coinbaseOrderId = (parsed.success_response && parsed.success_response.order_id) || parsed.order_id || null;
        setOrderNotice({ type: 'success', text: 'Order submitted to Coinbase' + (coinbaseOrderId ? ' (#' + String(coinbaseOrderId).slice(0, 8) + '…)' : '') + '.' });
      } else {
        status = 'rejected';
        const em = (parsed && parsed.error_response && (parsed.error_response.message || parsed.error_response.error)) || 'Coinbase rejected the order.';
        setOrderNotice({ type: 'error', text: em });
      }
    }

    try {
      await db.exec(
        'INSERT INTO orders_log (created_at, product_id, side, order_type, base_size, quote_size, limit_price, status, coinbase_order_id, raw_response) VALUES (?,?,?,?,?,?,?,?,?,?)',
        [new Date().toISOString(), selectedProductId, orderForm.side, orderForm.orderType,
         orderForm.baseSize || null, orderForm.quoteSize || null, orderForm.limitPrice || null,
         status, coinbaseOrderId, rawText.slice(0, 1800)]
      );
      loadOrdersLog();
    } catch (e) { /* ignore logging failure */ }

    // Ask the copilot for a take on this order, best-effort.
    setCopilotBusy(true);
    const result = await sendMessage('review_order', {
      order: orderBody,
      outcomeStatus: status,
      productId: selectedProductId,
      market: ticker ? { price: ticker.price, change24h: ticker.price_percentage_change_24h, volume24h: ticker.volume_24h } : null,
      portfolioUsd: totalPortfolioUsd,
      riskTolerance: prefs.riskTolerance,
    }, {
      state: { selectedProductId, orderForm, recentOrders: ordersLog.slice(0, 5), riskTolerance: prefs.riskTolerance },
      responseSchema: RESPONSE_SCHEMA,
    });
    setCopilotBusy(false);
    if (result.ok && result.data) {
      const d = result.data;
      try {
        await db.exec(
          'INSERT INTO copilot_notes (created_at, product_id, kind, sentiment, risk_level, message, suggestion) VALUES (?,?,?,?,?,?,?)',
          [new Date().toISOString(), selectedProductId, d.kind || 'order_check', d.sentiment || null, d.riskLevel || null, d.message || '', d.suggestion || null]
        );
        loadCopilotNotes();
      } catch (e) { /* ignore */ }
    } else if (!result.ok) {
      setCopilotNotice({ type: 'error', text: (result.error && result.error.message) || 'Copilot could not weigh in this time.' });
    }
  };

  const askPortfolioReview = async () => {
    setCopilotBusy(true);
    setCopilotNotice(null);
    const holdingsSummary = accounts.map((a) => ({
      currency: a.currency,
      balance: safeNum(a.available_balance && a.available_balance.value),
    }));
    const result = await sendMessage('review_portfolio', {
      holdings: holdingsSummary,
      totalPortfolioUsd,
      selectedProductId,
      market: ticker ? { price: ticker.price, change24h: ticker.price_percentage_change_24h } : null,
      riskTolerance: prefs.riskTolerance,
    }, {
      state: { holdings: holdingsSummary, totalPortfolioUsd, riskTolerance: prefs.riskTolerance },
      responseSchema: RESPONSE_SCHEMA,
    });
    setCopilotBusy(false);
    if (result.ok && result.data) {
      const d = result.data;
      try {
        await db.exec(
          'INSERT INTO copilot_notes (created_at, product_id, kind, sentiment, risk_level, message, suggestion) VALUES (?,?,?,?,?,?,?)',
          [new Date().toISOString(), null, d.kind || 'portfolio_review', d.sentiment || null, d.riskLevel || null, d.message || '', d.suggestion || null]
        );
        loadCopilotNotes();
      } catch (e) { /* ignore */ }
    } else if (!result.ok) {
      setCopilotNotice({ type: 'error', text: (result.error && result.error.message) || 'Copilot is unreachable right now.', retryable: result.error && result.error.retryable });
    }
  };

  const askMarketTake = async () => {
    setCopilotBusy(true);
    setCopilotNotice(null);
    const result = await sendMessage('market_take', {
      productId: selectedProductId,
      market: ticker ? { price: ticker.price, change24h: ticker.price_percentage_change_24h, volume24h: ticker.volume_24h } : null,
      book: { topBid: book.bids[0], topAsk: book.asks[0] },
      riskTolerance: prefs.riskTolerance,
    }, {
      state: { selectedProductId, ticker, riskTolerance: prefs.riskTolerance },
      responseSchema: RESPONSE_SCHEMA,
    });
    setCopilotBusy(false);
    if (result.ok && result.data) {
      const d = result.data;
      try {
        await db.exec(
          'INSERT INTO copilot_notes (created_at, product_id, kind, sentiment, risk_level, message, suggestion) VALUES (?,?,?,?,?,?,?)',
          [new Date().toISOString(), selectedProductId, d.kind || 'market_take', d.sentiment || null, d.riskLevel || null, d.message || '', d.suggestion || null]
        );
        loadCopilotNotes();
      } catch (e) { /* ignore */ }
    } else if (!result.ok) {
      setCopilotNotice({ type: 'error', text: (result.error && result.error.message) || 'Copilot is unreachable right now.', retryable: result.error && result.error.retryable });
    }
  };

  if (!isReady) return <div className="connecting">Connecting…</div>;

  const filteredProducts = search.trim()
    ? products.filter((p) => (p.product_id || '').toUpperCase().includes(search.trim().toUpperCase())).slice(0, 30)
    : [];

  const change24h = ticker ? safeNum(ticker.price_percentage_change_24h) : 0;
  const sparkPoints = priceHistoryRef.current[selectedProductId] || [];
  const maxBidSize = Math.max(1e-9, ...book.bids.map((b) => safeNum(b.size)));
  const maxAskSize = Math.max(1e-9, ...book.asks.map((a) => safeNum(a.size)));

  const isPortfolioConnected = !accountsError;

  return (

            <p>Portfolio, live markets &amp; order books, one-click trades.</p>
          </div>
        </div>
        <div className="topbar-right">
          <select className="risk-select" value={prefs.riskTolerance} onChange={(e) => setRiskTolerance(e.target.value)} title="Copilot risk tolerance">
            <option value="conservative">Conservative</option>
            <option value="balanced">Balanced</option>
            <option value="aggressive">Aggressive</option>
          </select>
          <div className="conn-dot">
            <span className={'dot ' + (isPortfolioConnected ? 'ok' : 'bad')}></span>
            Portfolio {isPortfolioConnected ? 'live' : 'offline'}
          </div>
          <div className="conn-dot">
            <span className={'dot ' + (isMarketConnected ? 'ok' : 'bad')}></span>
            Market {isMarketConnected ? 'live' : 'offline'}
          </div>
        </div>
      </div>

      <div className="grid">
        {/* PORTFOLIO PANEL */}
        <section className="panel">
          <h2>
            Portfolio
            <button className="refresh-btn" onClick={loadAccounts} disabled={accountsLoading}>
              {accountsLoading ? <span className="spinner" /> : '↻ refresh'}
            </button>
          </h2>

          {accountsError ? (
            <div className="empty-state">
              <span className="big-emoji">🔌</span>
              Not connected to Coinbase yet.
              <div className="connect-hint">
                Approve the Coinbase connection above the chat to load your real balances here. Everything else in this dashboard keeps working while you do.
              </div>
            </div>
          ) : accounts.length === 0 && !accountsLoading ? (
            <div className="empty-state">
              <span className="big-emoji">🪙</span>
              No balances found on this account yet.
            </div>
          ) : (
            <React.Fragment>
              <div className="portfolio-total">{fmtUSD(totalPortfolioUsd)}</div>
              <div className="portfolio-total-label">estimated total value</div>
              {accounts.map((a) => (
                <div className="holding-row" key={a.uuid || a.currency}>
                  <div>
                    <div className="holding-ccy">{a.currency}</div>
                    <div className="holding-sub">{a.name || a.currency}</div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div>{fmtQty(a.available_balance && a.available_balance.value)}</div>
                    <div className="holding-sub">{a.currency}</div>
                  </div>
                </div>
              ))}
            </React.Fragment>
          )}

          <div className="btn-row">
            <button className="btn secondary" onClick={askPortfolioReview} disabled={copilotBusy || accounts.length === 0}>
              {copilotBusy ? <span className="spinner" /> : '🤖 Ask copilot to review'}
            </button>
          </div>

          <div className="divider"></div>
          <h2 style={{ marginBottom: 8 }}>Watchlist</h2>
          {watchlist.length === 0 ? (
            <div className="muted-small">Add assets from the search box below to build a watchlist.</div>
          ) : (
            watchlist.map((id) => (
              <div key={id} className={'watchlist-item' + (id === selectedProductId ? ' active' : '')} onClick={() => setSelectedProductId(id)}>

              <div className="book-col">
                <h3>Bids</h3>
                {book.bids.slice(0, 10).map((b, i) => (
                  <div key={i} className="book-row bid">
                    <div className="bar" style={{ width: (safeNum(b.size) / maxBidSize * 100) + '%' }}></div>
                    <span>{fmtUSD(b.price, { decimals: 2 })}</span>
                    <span>{fmtQty(b.size)}</span>
                  </div>
                ))}
              </div>
              <div className="book-col">
                <h3>Asks</h3>
                {book.asks.slice(0, 10).map((a, i) => (
                  <div key={i} className="book-row ask">
                    <div className="bar" style={{ width: (safeNum(a.size) / maxAskSize * 100) + '%' }}></div>
                    <span>{fmtUSD(a.price, { decimals: 2 })}</span>
                    <span>{fmtQty(a.size)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div className="btn-row">
            <button className="btn secondary" onClick={askMarketTake} disabled={copilotBusy || !ticker}>
              {copilotBusy ? <span className="spinner" /> : '🤖 Ask for a market take'}
            </button>
          </div>
        </section>

        {/* TRADE PANEL */}
        <section className="panel">
          <h2>Trade {selectedProductId}</h2>

          <div className="side-toggle">
            <button className={'buy' + (orderForm.side === 'BUY' ? ' active' : '')} onClick={() => setOrderForm({ side: 'BUY' })}>Buy</button>
            <button className={'sell' + (orderForm.side === 'SELL' ? ' active' : '')} onClick={() => setOrderForm({ side: 'SELL' })}>Sell</button>
          </div>
          <div className="type-toggle">
            <button className={orderForm.orderType === 'MARKET' ? 'active' : ''} onClick={() => setOrderForm({ orderType: 'MARKET' })}>Market</button>
            <button className={orderForm.orderType === 'LIMIT' ? 'active' : ''} onClick={() => setOrderForm({ orderType: 'LIMIT' })}>Limit</button>
          </div>

          {orderForm.orderType === 'MARKET' && orderForm.side === 'BUY' && (
            <div className="form-row">
              <label>Amount to spend (USD)</label>
              <input type="number" min="0" value={orderForm.quoteSize} onChange={(e) => setOrderForm({ quoteSize: e.target.value })} placeholder="25.00" />
            </div>
          )}
          {orderForm.orderType === 'MARKET' && orderForm.side === 'SELL' && (
            <div className="form-row">
              <label>Quantity to sell ({selectedProductId.split('-')[0]})</label>
              <input type="number" min="0" value={orderForm.baseSize} onChange={(e) => setOrderForm({ baseSize: e.target.value })} placeholder="0.01" />
            </div>
          )}
          {orderForm.orderType === 'LIMIT' && (
            <React.Fragment>
              <div className="form-row">
                <label>Quantity ({selectedProductId.split('-')[0]})</label>
                <input type="number" min="0" value={orderForm.baseSize} onChange={(e) => setOrderForm({ baseSize: e.target.value })} placeholder="0.01" />
              </div>
              <div className="form-row">
                <label>Limit price (USD)</label>
                <input type="number" min="0" value={orderForm.limitPrice} onChange={(e) => setOrderForm({ limitPrice: e.target.value })} placeholder={ticker ? String(ticker.price) : '0.00'} />
              </div>
            </React.Fragment>
          )}

          <button className={'btn ' + (orderForm.side === 'BUY' ? 'buy' : 'sell')} style={{ width: '100%' }} onClick={submitOrder} disabled={placingOrder}>
            {placingOrder ? <span className="spinner" /> : (orderForm.side === 'BUY' ? 'Buy ' : 'Sell ') + selectedProductId.split('-')[0]}
          </button>
          {orderNotice && (
            <div className={'notice ' + (orderNotice.type === 'error' ? 'error' : 'success')}>{orderNotice.text}</div>
          )}
          <div className="muted-small" style={{ marginTop: 8 }}>
            Live trades hit your real Coinbase account. The host will ask you to confirm before anything is sent.
          </div>

          <div className="divider"></div>
          <h2 style={{ marginBottom: 8 }}>Recent orders</h2>
          {ordersLog.length === 0 ? (
            <div className="muted-small">No orders placed from this dashboard yet.</div>
          ) : (
            ordersLog.map((o, i) => (
              <div className="order-log-row" key={i}>
                <div className="order-log-top">
                  <span><span className={'order-log-side ' + (o.side === 'BUY' ? 'buy' : 'sell')}>{o.side}</span> {o.productId}</span>
                  <span className="order-log-status">{o.status}</span>
                </div>
                <div className="muted-small">
                  {o.orderType === 'MARKET' ? (o.side === 'BUY' ? '$' + o.quoteSize : (o.baseSize || '') + ' units') : (o.baseSize + ' @ $' + o.limitPrice)}
                  {' · ' + timeAgo(o.createdAt)}
                </div>
              </div>
            ))
          )}
        </section>

        {/* COPILOT PANEL */}
        <section className="panel copilot-panel">
          <h2>
            Copilot notes
            {isWaiting && <span className="muted-small"><span className="spinner" /> thinking…</span>}
          </h2>
          {copilotNotice && (
            <div className="notice error">{copilotNotice.text}</div>
          )}
          {copilotNotes.length === 0 ? (
            <div className="empty-state">
              <span className="big-emoji">🤖</span>
              No notes yet — ask for a portfolio review, a market take, or place a trade to hear from your copilot.
            </div>
          ) : (
            <div className="copilot-feed">
              {copilotNotes.map((n, i) => (
                <div className="copilot-note" key={i}>
                  <div className="copilot-avatar">{CopilotAvatarText()}</div>
                  <div className="copilot-body">
                    <div className="copilot-head">
                      <span className="copilot-name">Ledger</span>
                      <span className="copilot-time">{timeAgo(n.createdAt)}</span>
                      {n.productId && <span className="tag">{n.productId}</span>}
                      {n.sentiment && <span className={'tag sentiment-' + n.sentiment}>{n.sentiment}</span>}
                      {n.riskLevel && <span className={'tag risk-' + n.riskLevel}>{n.riskLevel} risk</span>}
                    </div>
                    <div className="copilot-msg">{n.message}</div>
                    {n.suggestion && <div className="copilot-suggestion">💡 {n.suggestion}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
