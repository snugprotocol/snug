<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coinbase Trade Copilot</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #17171f; --muted: #6b7280;
    --card: #f4f4f8; --border: #e2e2ea; --accent: #0052FF;
    --up: #17a673; --down: #e0455a; --warn: #b8860b;
    --card2: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #10121a; --fg: #ececf4; --muted: #9a9aad;
    --card: #191c26; --border: #2b2e3a; --accent: #4d8dff;
    --up: #34d399; --down: #f87171; --warn: #eab308;
    --card2: #1f2230;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button { min-width: 44px; min-height: 44px; cursor: pointer; font-family: inherit; }
  input, select { font-family: inherit; }

  .connecting { display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); font-size:15px; }

  .shell { max-width: 1320px; margin: 0 auto; padding: 16px 16px 40px; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: 10px 4px 18px; flex-wrap: wrap;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-icon {
    width:38px; height:38px; border-radius:10px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    flex-shrink:0;
  }
  .brand-text h1 { font-size:17px; margin:0; font-weight:700; }
  .brand-text p { font-size:12px; margin:0; color:var(--muted); }

  .topbar-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .risk-select {
    background:var(--card); color:var(--fg); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:12px;
  }

  .conn-dot { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); padding:6px 10px; border:1px solid var(--border); border-radius:20px; background:var(--card); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.ok { background: var(--up); }
  .dot.bad { background: var(--down); }

  .grid {
    display:grid; gap:14px;
    grid-template-columns: 300px 1fr 340px;
    align-items:start;
  }
  @media (max-width: 1080px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px; overflow:hidden;
  }
  .panel h2 {
    font-size:13px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted);
    margin:0 0 10px; display:flex; align-items:center; justify-content:space-between;
  }
  .panel h2 .refresh-btn {
    min-width:auto; min-height:auto; background:none; border:none; color:var(--accent);
    font-size:12px; padding:2px 4px;
  }

  .empty-state {
    text-align:center; padding: 22px 10px; color:var(--muted); font-size:13px; line-height:1.5;
  }
  .empty-state .big-emoji { font-size:28px; display:block; margin-bottom:8px; }
  .connect-hint {
    background: var(--card2); border:1px dashed var(--border); border-radius:10px;
    padding:12px; font-size:12px; color:var(--muted); margin-top:8px;
  }

  .holding-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .holding-row:last-child { border-bottom:none; }
  .holding-ccy { font-weight:600; }
  .holding-sub { font-size:11px; color:var(--muted); }
  .portfolio-total { font-size:22px; font-weight:700; margin-bottom:2px; }
  .portfolio-total-label { font-size:11px; color:var(--muted); margin-bottom:10px; }

  .btn {
    background: var(--accent); color:#fff; border:none; border-radius:9px;
    padding:9px 14px; font-size:13px; font-weight:600;
  }
  .btn.secondary { background: var(--card2); color:var(--fg); border:1px solid var(--border); }
  .btn.buy { background: var(--up); }
  .btn.sell { background: var(--down); }
  .btn:disabled { opacity:0.5; cursor:default; }
  .btn-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

  .watchlist-item {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 8px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .watchlist-item:hover { background: var(--card2); }
  .watchlist-item.active { background: var(--accent); color:#fff; }
  .watchlist-item .rm { opacity:0.5; font-size:11px; }

  .asset-search {
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
    background: var(--card2); color:var(--fg); font-size:13px; margin-bottom:8px;
  }
  .search-results {
    max-height:160px; overflow-y:auto; border:1px solid var(--border); border-radius:9px;
    margin-bottom:10px; background:var(--card2);
  }
  .search-result-row {
    display:flex; justify-content:space-between; padding:7px 10px; font-size:12px;
    cursor:pointer; border-bottom:1px solid var(--border);
  }
  .search-result-row:last-child { border-bottom:none; }
  .search-result-row:hover { background: var(--card); }

  .ticker-card { display:flex; flex-direction:column; gap:2px; margin-bottom:12px; }
  .ticker-symbol { font-size:13px; color:var(--muted); }
  .ticker-price { font-size:32px; font-weight:800; letter-spacing:-0.5px; }
  .ticker-change { font-size:13px; font-weight:600; }
  .ticker-change.up { color: var(--up); }
  .ticker-change.down { color: var(--down); }
  .ticker-meta { font-size:11px; color:var(--muted); margin-top:4px; }

  .sparkline-wrap { margin: 6px 0 12px; }

  .book-cols { display:flex; gap:10px; }
  .book-col { flex:1; min-width:0; }
  .book-col h3 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .book-row {
    position:relative; display:flex; justify-content:space-between; font-size:11.5px;
    padding:3px 6px; border-radius:4px; margin-bottom:2px; overflow:hidden; font-variant-numeric: tabular-nums;
  }
  .book-row .bar { position:absolute; top:0; bottom:0; right:0; z-index:0; opacity:0.18; }
  .book-row.bid .bar { background: var(--up); }
  .book-row.ask .bar { background: var(--down); }
  .book-row span { position:relative; z-index:1; }
  .book-row.bid { color: var(--up); }
  .book-row.ask { color: var(--down); }

  .form-row { margin-bottom:10px; }
  .form-row label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .form-row input, .form-row select {
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
    background: var(--card2); color:var(--fg); font-size:13px;
  }
  .side-toggle { display:flex; gap:6px; margin-bottom:10px; }
  .side-toggle button { flex:1; border-radius:9px; border:1px solid var(--border); background:var(--card2); color:var(--fg); font-size:13px; font-weight:600; padding:9px; }
  .side-toggle button.active.buy { background: var(--up); color:#fff; border-color:var(--up); }
  .side-toggle button.active.sell { background: var(--down); color:#fff; border-color:var(--down); }
  .type-toggle { display:flex; gap:6px; margin-bottom:10px; }
  .type-toggle button { flex:1; border-radius:9px; border:1px solid var(--border); background:var(--card2); color:var(--fg); font-size:12px; padding:7px; }
  .type-toggle button.active { background: var(--accent); color:#fff; border-color:var(--accent); }

  .notice { border-radius:9px; padding:9px 11px; font-size:12px; margin-top:8px; line-height:1.4; }
  .notice.error { background: rgba(224,69,90,0.12); color: var(--down); border:1px solid rgba(224,69,90,0.3); }
  .notice.success { background: rgba(23,166,115,0.12); color: var(--up); border:1px solid rgba(23,166,115,0.3); }
  .notice.info { background: rgba(77,141,255,0.1); color: var(--accent); border:1px solid rgba(77,141,255,0.3); }

  .order-log-row { font-size:11.5px; padding:7px 0; border-bottom:1px solid var(--border); }
  .order-log-row:last-child { border-bottom:none; }
  .order-log-top { display:flex; justify-content:space-between; }
  .order-log-side { font-weight:700; }
  .order-log-side.buy { color: var(--up); }
  .order-log-side.sell { color: var(--down); }
  .order-log-status { font-size:10px; color:var(--muted); }

  .copilot-panel { grid-column: 1 / -1; margin-top:2px; }
  .copilot-feed { display:flex; flex-direction:column; gap:10px; max-height: 360px; overflow-y:auto; padding-right:4px; }
  .copilot-note {
    display:flex; gap:10px; background: var(--card2); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px;
  }
  .copilot-avatar {
    width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
  }
  .copilot-body { flex:1; min-width:0; }
  .copilot-head { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
  .copilot-name { font-weight:700; font-size:12.5px; }
  .copilot-time { font-size:10.5px; color:var(--muted); }
  .tag { font-size:10px; padding:2px 7px; border-radius:20px; border:1px solid var(--border); color:var(--muted); }
  .tag.sentiment-bullish { color: var(--up); border-color: var(--up); }
  .tag.sentiment-bearish, .tag.sentiment-cautious { color: var(--down); border-color: var(--down); }
  .tag.risk-high { color: var(--down); border-color: var(--down); }
  .tag.risk-medium { color: var(--warn); border-color: var(--warn); }
  .tag.risk-low { color: var(--up); border-color: var(--up); }
  .copilot-msg { font-size:13px; line-height:1.5; }
  .copilot-suggestion { margin-top:6px; font-size:12px; padding:7px 9px; background:var(--card); border-radius:8px; border-left:3px solid var(--accent); }
  .copilot-flags { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .flag-chip { font-size:10.5px; padding:2px 8px; border-radius:20px; background: rgba(224,69,90,0.12); color:var(--down); }

  .spinner { display:inline-block; width:13px; height:13px; border-radius:50%; border:2px solid var(--border); border-top-color: var(--accent); animation: spin 0.7s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .muted-small { font-size:11px; color:var(--muted); }
  .divider { height:1px; background:var(--border); margin:12px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ============================================================
// 1. SNUG BRIDGE RUNTIME (MANDATORY — copy exactly, never edit)
// ============================================================
const SnugBridge = {
  instanceId: null,
  theme: 'light',
  capabilities: {},
  ready: false,
  pending: new Map(),    // requestId -> { resolve, onStream }
  dbPending: new Map(),  // requestId -> resolve
  netPending: new Map(), // requestId -> resolve
  listeners: new Set(),  // re-render triggers for hooks

  post(frame) {
    window.parent.postMessage({ v: 1, instanceId: this.instanceId, ...frame }, '*');
  },
  notify() { for (const fn of this.listeners) fn(); },
};

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.v !== 1) return;

  if (data.type === 'snug:host-ready') {
    SnugBridge.instanceId = data.instanceId;
    if (data.theme) SnugBridge.theme = data.theme;
    if (data.capabilities) SnugBridge.capabilities = data.capabilities;
    SnugBridge.ready = true;
    SnugBridge.notify();
    return;
  }

  if (data.type === 'snug:app-response') {
    const entry = SnugBridge.pending.get(data.requestId);
    if (!entry) return; // unknown or superseded requestId — ignore
    if (data.streaming) {
      // Cumulative provisional text — display only. NEVER resolve here.
      if (entry.onStream && typeof data.text === 'string') entry.onStream(data.text);
      return;
    }
    SnugBridge.pending.delete(data.requestId); // terminal — exactly one per requestId
    entry.resolve(data.ok ? { ok: true, data: data.data } : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:db-response') {
    const resolve = SnugBridge.dbPending.get(data.requestId);
    if (!resolve) return;
    SnugBridge.dbPending.delete(data.requestId);
    // Result fields (rows/columns/value/bytesBase64) live at the TOP LEVEL of the frame.
    resolve(data.ok
      ? { ok: true, rows: data.rows, columns: data.columns, value: data.value, bytesBase64: data.bytesBase64 }
      : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:net-response') {
    const resolve = SnugBridge.netPending.get(data.requestId);
    if (!resolve) return;
    SnugBridge.netPending.delete(data.requestId);
    // Result fields (status/headers/body/truncated) live at the TOP LEVEL of the frame.
    resolve(data.ok
      ? { ok: true, status: data.status, headers: data.headers, body: data.body, truncated: data.truncated }
      : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:host-event') {
    if (data.event === 'theme-change' && data.data && data.data.theme) {
      SnugBridge.theme = data.data.theme;
      SnugBridge.notify();
    }
    // Unknown host events MUST be ignored (the protocol is additive).
  }
});

function snugDbRequest(op, args) {
  return new Promise((resolve) => {
    const requestId = crypto.randomUUID();
    SnugBridge.dbPending.set(requestId, resolve);
    SnugBridge.post({ type: 'snug:db-request', requestId, op, ...args });
  });
}

function snugNetRequest(fields) {
  if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
  return new Promise((resolve) => {
    const requestId = crypto.randomUUID();
    SnugBridge.netPending.set(requestId, resolve);
    SnugBridge.post({ type: 'snug:net-request', requestId, ...fields });
  });
}

// ============================================================
// 2. useSnugApp (MANDATORY — copy exactly, never edit)
// ============================================================
function useSnugApp(meta) {
  const [, setTick] = useState(0);
  const [isWaiting, setIsWaiting] = useState(false);
  const [lastResponse, setLastResponse] = useState(null);
  const inFlight = useRef(0);
  const metaRef = useRef(meta);

  useEffect(() => {
    const rerender = () => setTick((n) => n + 1);
    SnugBridge.listeners.add(rerender);
    const m = metaRef.current;
    SnugBridge.post({
      type: 'snug:app-announce',
      appId: m.appId,
      displayName: m.displayName,
      description: m.description,
      iconEmoji: m.iconEmoji,
      iconColor: m.iconColor,
    });
    return () => SnugBridge.listeners.delete(rerender);
  }, []);

  const sendMessage = useCallback((action, payload, opts) => {
    if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
    const requestId = crypto.randomUUID(); // fresh per request — multiple in flight are legal
    inFlight.current += 1;
    setIsWaiting(true);
    return new Promise((resolve) => {
      SnugBridge.pending.set(requestId, {
        onStream: opts && opts.onStream,
        resolve: (result) => {
          inFlight.current -= 1;
          if (inFlight.current === 0) setIsWaiting(false);
          setLastResponse(result);
          resolve(result);
        },
      });
      SnugBridge.post({
        type: 'snug:app-message',
        requestId,
        appId: metaRef.current.appId,
        action,
        payload,
        state: opts && opts.state,
        responseSchema: opts && opts.responseSchema,
      });
    });
  }, []);

  return {
    isReady: SnugBridge.ready,
    theme: SnugBridge.theme,
    isWaiting,
    lastResponse,
    sendMessage,
  };
}

// ============================================================
// 3. usePersistedState (MANDATORY — copy exactly, never edit)
// Storage is HOST-BROKERED key-value. The sandboxed iframe has a
// null origin: no browser storage API works here.
// ============================================================
function usePersistedState(key, initialValue) {
  const [state, setState] = useState(initialValue);
  // Tracks WHICH key hydrated: a key change must re-hydrate before any write-back,
  // or the old key's state would overwrite the new key's stored value.
  const [hydratedKey, setHydratedKey] = useState(null);
  const initialRef = useRef(initialValue);

  useEffect(() => {
    let cancelled = false;
    const hydrate = async () => {
      const result = await snugDbRequest('kvGet', { key });
      if (cancelled) return;
      if (result.ok && result.value != null) {
        const stored = result.value;
        const init = initialRef.current;
        // Merge objects with defaults so fields added in newer code are never undefined.
        setState(
          stored && typeof stored === 'object' && !Array.isArray(stored) &&
          init && typeof init === 'object' && !Array.isArray(init)
            ? { ...init, ...stored }
            : stored
        );
      } else {
        setState(initialRef.current); // nothing stored under this key — back to defaults
      }
      setHydratedKey(key);
    };
    const onReady = () => {
      if (!SnugBridge.ready) return;
      SnugBridge.listeners.delete(onReady);
      hydrate();
    };
    if (SnugBridge.ready) hydrate();
    else SnugBridge.listeners.add(onReady);
    return () => { cancelled = true; SnugBridge.listeners.delete(onReady); };
  }, [key]);

  useEffect(() => {
    if (hydratedKey !== key) return;
    snugDbRequest('kvSet', { key, value: state }); // fire-and-forget; host acks via db-response
  }, [hydratedKey, key, state]);

  return [state, setState];
}

// ============================================================
// 4. useAppDB (copy exactly when the app needs SQL; omit otherwise)
// ============================================================
function useAppDB() {
  return useMemo(() => ({
    async exec(sql, params) {
      const result = await snugDbRequest('exec', { sql, params });
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db exec failed');
      return { rows: result.rows, columns: result.columns }; // { rows: unknown[][], columns: string[] }
    },
    async exportDb() {
      const result = await snugDbRequest('export', {});
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db export failed');
      return result.bytesBase64;
    },
    async importDb(bytesBase64) {
      const result = await snugDbRequest('import', { bytesBase64 });
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db import failed');
    },
  }), []);
}

// ============================================================
// 5. useConnectedFetch (copy exactly when the app calls an approved API; omit otherwise)
// The sandboxed app has NO network of its own. This reaches ONLY your app's APPROVED
// hosts THROUGH the host, which injects your saved credentials, caps sizes, asks you
// before any write, and scrubs the response. You never see a token.
// A connection whose host only the USER knows (a device on their network): address it as
// snug-connection://<slot>/<path> — the host resolves the approved address; you never learn it.
// ALWAYS resolves: { ok:true, status, headers, body } or { ok:false, error }.
// ============================================================
function useConnectedFetch() {
  return useMemo(() => ({
    fetch(url, opts) {
      return snugNetRequest({
        url,
        method: (opts && opts.method) || 'GET',
        headers: opts && opts.headers,
        body: opts && opts.body,
      });
    },
  }), []);
}

// ============================================================
// 5. RESPONSE SCHEMA — describe the JSON the agent must return
// ============================================================
const RESPONSE_SCHEMA = {
  kind: "string: 'portfolio_review' | 'order_check' | 'market_take' | 'twap_check'",
  message: "string: human-readable commentary in the copilot's voice (ALWAYS include)",
  sentiment: "string: 'bullish' | 'bearish' | 'neutral' | 'cautious'",
  riskLevel: "string: 'low' | 'medium' | 'high'",
  suggestion: "string (optional): one concrete, non-guaranteed suggestion",
  flags: "array of strings (optional): short risk warnings e.g. 'concentration risk', 'thin book'",
  assessment: "string (kind 'twap_check' only): 'looks_sound' | 'workable_with_care' | 'reconsider' — verdict on the TWAP plan as a whole",
  risks: "array of strings (kind 'twap_check' only): plan-specific risks, e.g. 'slices sit near the product minimum', 'four hours is long for a headline day'",
  adjustment: "string (optional, kind 'twap_check' only): ONE concrete change to the plan, e.g. 'stretch to 4h and drop to 8 slices' — advisory; the app never applies it automatically",
};

// ============================================================
// Helpers
// ============================================================
const COINBASE_HOST = 'https://api.coinbase.com';
const POPULAR_PRODUCTS = ['BTC-USD', 'ETH-USD', 'SOL-USD', 'DOGE-USD', 'XRP-USD', 'AVAX-USD'];

function safeNum(v, fallback) {
  const n = Number(v);
  return Number.isFinite(n) ? n : (fallback === undefined ? 0 : fallback);
}

function parseBody(body) {
  if (body == null) return null;
  if (typeof body === 'object') return body;
  if (typeof body === 'string') {
    try { return JSON.parse(body); } catch (e) { return null; }
  }
  return null;
}

function fmtUSD(n, opts) {
  const num = safeNum(n, 0);
  try {
    return new Intl.NumberFormat('en-US', {
      style: 'currency', currency: 'USD',
      minimumFractionDigits: opts && opts.decimals != null ? opts.decimals : (Math.abs(num) < 1 ? 4 : 2),
      maximumFractionDigits: opts && opts.decimals != null ? opts.decimals : (Math.abs(num) < 1 ? 6 : 2),
    }).format(num);
  } catch (e) {
    return '$' + num.toFixed(2);
  }
}

function fmtPct(n) {
  const num = safeNum(n, 0);
  return (num > 0 ? '+' : '') + num.toFixed(2) + '%';
}

function fmtQty(n) {
  const num = safeNum(n, 0);
  if (num === 0) return '0';
  if (Math.abs(num) < 1) return num.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  return num.toLocaleString('en-US', { maximumFractionDigits: 4 });
}

function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return '';
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function Sparkline({ points, up }) {
  if (!points || points.length < 2) {
    return <div className="muted-small">Collecting live samples…</div>;
  }
  const w = 260, h = 44, pad = 3;
  const min = Math.min(...points), max = Math.max(...points);
  const range = (max - min) || 1;
  const step = (w - pad * 2) / (points.length - 1);
  const path = points.map((p, i) => {
    const x = pad + i * step;
    const y = h - pad - ((p - min) / range) * (h - pad * 2);
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const color = up ? 'var(--up)' : 'var(--down)';
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} style={{ display: 'block' }}>
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function twapDurationLabel(minutes) {
  const d = TWAP_DURATIONS.find((x) => x.minutes === safeNum(minutes));
  return d ? d.label : safeNum(minutes) + 'm';
}

function decimalsOf(increment) {
  const s = String(increment);
  const i = s.indexOf('.');
  return i < 0 ? 0 : Math.min(8, s.length - i - 1);
}

/**
 * Equal slices computed in WHOLE INCREMENTS of the product's size increment, so every
 * slice is a size Coinbase will accept verbatim. The first slices absorb the remainder:
 * any two slices differ by at most one increment. Returns string sizes, or null when
 * the total cannot put at least one increment into every slice.
 */
function splitEqualSlices(total, count, increment) {
  const inc = safeNum(increment) > 0 ? safeNum(increment) : 0.00000001;
  const dp = safeNum(increment) > 0 ? decimalsOf(increment) : 8;
  const totalUnits = Math.floor(total / inc + 1e-9);
  if (totalUnits < count) return null;
  const per = Math.floor(totalUnits / count);
  const rem = totalUnits - per * count;
  return Array.from({ length: count }, (_, i) => ((per + (i < rem ? 1 : 0)) * inc).toFixed(dp));
}

function roundToIncrement(value, increment) {
  const inc = safeNum(increment);
  if (inc <= 0) return String(value);
  return (Math.floor(value / inc + 1e-9) * inc).toFixed(decimalsOf(increment));
}

function fmtOffset(totalSec) {
  const s = Math.max(0, Math.round(safeNum(totalSec)));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const two = (n) => String(n).padStart(2, '0');
  return h > 0 ? h + ':' + two(m) + ':' + two(sec) : m + ':' + two(sec);
}

function fmtClock(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  if (!Number.isFinite(t.getTime())) return '';
  try { return t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  catch (e) { return t.toTimeString().slice(0, 8); }
}

/**
 * The strict read of Ledger's TWAP verdict. Anything off-shape returns null and the
 * plan stands exactly as the user wrote it, with a "Ledger had no opinion" note —
 * the agent advises; it never edits, arms, or executes a plan.
 */
function parseTwapVerdict(data) {
  if (!data || typeof data !== 'object') return null;
  const assessment = typeof data.assessment === 'string' ? data.assessment.trim() : '';
  if (!assessment) return null;
  const risks = Array.isArray(data.risks)
    ? data.risks.filter((r) => typeof r === 'string' && r.trim()).slice(0, 6).map((r) => r.trim())
    : [];
  const adjustment = typeof data.adjustment === 'string' && data.adjustment.trim() ? data.adjustment.trim() : null;
  const message = typeof data.message === 'string' ? data.message.trim() : '';
  return { assessment, risks, adjustment, message };
}

function sampleTwapStats(plan) {
  let qty = 0;
  let cost = 0;
  for (const s of plan.slices) {
    const q = Number(s.size);

  }
  const avgFill = qty > 0 ? cost / qty : 0;
  return { qty, avgFill, saved: (plan.oneShotPrice - avgFill) * qty };
}

  // ---- Actions ---------------------------------------------------------

  const validateOrder = () => {

  // ---- Smart order (TWAP) ---------------------------------------------
  const twapProductId = twapForm.productId || selectedProductId;
  const twapIsQuoteSized = twapForm.execStyle === 'MARKET' && twapForm.side === 'BUY';
  const twapBaseCcy = (twapProductId || '').split('-')[0];
  const planLocked = !!activePlan && ['checking', 'ready', 'running', 'paused'].includes(activePlan.status);

  const twapProductOptions = useMemo(
    () => products.map((p) => p.product_id).sort(),
    [products]
  );

  /** Patch ONE slice of the active plan, synchronously, returning the patched slice. */
  const mutateSlice = (planId, index, patch) => {
    const cur = activePlanRef.current;
    if (!cur || cur.planId !== planId) return null;
    let updated = null;
    const slices = cur.slices.map((s) => (s.index === index ? (updated = { ...s, ...patch }) : s));
    if (updated) applyPlanUpdate({ ...cur, slices });
    return updated;
  };

  const persistTwapSlice = async (planId, s) => {
    try {
      await db.exec(
        'UPDATE twap_slices SET status = ?, limit_price = ?, coinbase_order_id = ?, detail = ?, executed_at = ? WHERE plan_id = ? AND slice_index = ?',
        [s.status, s.limitPrice, s.coinbaseOrderId, s.detail, s.executedAt, planId, s.index]
      );
    } catch (e) { /* journaling is best-effort */ }
  };

  /** Terminal settle: remaining queued slices are skipped, the plan closes, journal refreshes. */
  const settleTwapPlan = async (planId, status, skipDetail) => {
    const endedAt = new Date().toISOString();
    const cur = activePlanRef.current;
    if (cur && cur.planId === planId) {
      const slices = skipDetail
        ? cur.slices.map((s) => (s.status === 'pending' ? { ...s, status: 'skipped', detail: skipDetail } : s))
        : cur.slices;
      applyPlanUpdate({ ...cur, slices, status, endedAt });
    }
    try {
      if (skipDetail) {
        await db.exec("UPDATE twap_slices SET status = 'skipped', detail = ? WHERE plan_id = ? AND status = 'pending'", [skipDetail, planId]);
      }
      await db.exec('UPDATE twap_plans SET status = ?, ended_at = ? WHERE plan_id = ?', [status, endedAt, planId]);
    } catch (e) { /* ignore */ }
    loadTwapJournal();
  };

  /**
   * The run engine's single step: fire AT MOST ONE due slice. The `firing` guard
   * serializes slices — the host's confirm dialog can stay open arbitrarily long, and
   * confirms must never stack. A slice that comes due during that wait fires right
   * after (late, one at a time, still confirmed) — delays postpone, they never skip.
   */
  const fireDueTwapSlice = async () => {
    const plan = activePlanRef.current;
    if (!plan || plan.status !== 'running' || twapEngineRef.current.firing) return;
    const due = plan.slices.find((s) => s.status === 'pending' && s.dueAt && new Date(s.dueAt).getTime() <= Date.now());
    if (!due) return;
    twapEngineRef.current.firing = true;
    try {
      let s = mutateSlice(plan.planId, due.index, { status: 'sending' });
      if (s) await persistTwapSlice(plan.planId, s);

      let limitPrice = null;
      let priceFailed = false;
      if (plan.execStyle === 'LIMIT') {
        // Limit slices price at THIS interval's start: a fresh ticker read, floored
        // to the product's quote increment.
        const tRes = await connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/market/products/' + encodeURIComponent(plan.productId));
        const t = (tRes.ok && (!tRes.status || tRes.status < 400)) ? parseBody(tRes.body) : null;
        const px = t ? safeNum(t.price) : 0;
        if (px <= 0) {
          // NO early return: the completion check below must still run, or a plan
          // whose LAST slice fails pricing would sit "running" forever.
          s = mutateSlice(plan.planId, due.index, { status: 'error', detail: 'no live price to set the limit — slice not sent', executedAt: new Date().toISOString() });
          if (s) await persistTwapSlice(plan.planId, s);
          priceFailed = true;
        } else {
          limitPrice = roundToIncrement(px, plan.quoteIncrement);
        }
      }

      if (!priceFailed) {
        const orderConfiguration = plan.execStyle === 'MARKET'
          ? (plan.side === 'BUY'
              ? { market_market_ioc: { quote_size: due.size } }
              : { market_market_ioc: { base_size: due.size } })
          : { limit_limit_gtc: { base_size: due.size, limit_price: limitPrice, post_only: false } };

        const res = await connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            // Derived, not random: resending this slice can never double-fill.
            client_order_id: due.clientOrderId,
            product_id: plan.productId,
            side: plan.side,
            order_configuration: orderConfiguration,
          }),
        });

        const executedAt = new Date().toISOString();
        if (!res.ok) {
          s = mutateSlice(plan.planId, due.index, { status: 'error', limitPrice, detail: (res.error && res.error.message) || 'the request did not reach Coinbase', executedAt });
        } else {
          const parsed = parseBody(res.body);
          if (parsed && parsed.success) {
            const cbId = (parsed.success_response && parsed.success_response.order_id) || parsed.order_id || null;
            s = mutateSlice(plan.planId, due.index, { status: 'accepted', limitPrice, coinbaseOrderId: cbId, detail: null, executedAt });
          } else {
            const em = (parsed && parsed.error_response && (parsed.error_response.message || parsed.error_response.error)) || 'Coinbase rejected the slice';
            s = mutateSlice(plan.planId, due.index, { status: 'rejected', limitPrice, detail: em, executedAt });
          }
        }
        if (s) await persistTwapSlice(plan.planId, s);
      }
    } finally {
      twapEngineRef.current.firing = false;
    }
    const after = activePlanRef.current;
    if (after && after.planId === plan.planId) {
      const open = after.slices.some((s2) => s2.status === 'pending' || s2.status === 'sending');
      if (!open && after.status === 'running') await settleTwapPlan(plan.planId, 'done');
      else if (after.status !== 'running') loadTwapJournal(); // late outcome after pause/cancel — keep history true
    }
  };

  // Latest-ref pattern: the interval always calls THIS render's engine step.
  const fireDueTwapSliceRef = useRef(null);
  fireDueTwapSliceRef.current = fireDueTwapSlice;

  useEffect(() => {
    if (!activePlan || activePlan.status !== 'running') return;
    const tick = () => { if (fireDueTwapSliceRef.current) fireDueTwapSliceRef.current(); };
    const interval = setInterval(tick, 1000);
    const kick = setTimeout(tick, 50); // slice #1 is due at arm time — fire it now, not next second
    return () => { clearInterval(interval); clearTimeout(kick); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activePlan && activePlan.planId, activePlan && activePlan.status]);

  const runTwapSanityCheck = async (plan) => {
    // Fresh snapshot for the PLAN's product — it need not be the charted one.
    let market = null;
    const [pRes, bRes] = await Promise.all([
      connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/market/products/' + encodeURIComponent(plan.productId)),
      connectedFetch.fetch(COINBASE_HOST + '/api/v3/brokerage/market/product_book?product_id=' + encodeURIComponent(plan.productId) + '&limit=1'),
    ]);
    if (pRes.ok && (!pRes.status || pRes.status < 400)) {
      const t = parseBody(pRes.body);
      if (t && t.price != null) market = { price: t.price, change24h: t.price_percentage_change_24h, volume24h: t.volume_24h };
    }
    if (market && bRes.ok && (!bRes.status || bRes.status < 400)) {
      const b = parseBody(bRes.body);
      const pb = b && b.pricebook;
      if (pb) {
        market.topBid = (Array.isArray(pb.bids) && pb.bids[0]) || null;
        market.topAsk = (Array.isArray(pb.asks) && pb.asks[0]) || null;
      }
    }
    const result = await sendMessage('twap_sanity_check', {
      plan: {
        productId: plan.productId, side: plan.side, execStyle: plan.execStyle,
        totalSize: plan.totalSize, sizeUnit: plan.sizeUnit,
        durationMin: plan.durationMin, sliceCount: plan.sliceCount, intervalSec: plan.intervalSec,
        sliceSizes: plan.slices.map((s) => s.size),
      },
      market,
      portfolioUsd: totalPortfolioUsd,
      riskTolerance: prefs.riskTolerance,
    }, { responseSchema: RESPONSE_SCHEMA });
    const verdict = result.ok ? parseTwapVerdict(result.data) : null;
    applyPlanUpdate((prev) => (prev && prev.planId === plan.planId && prev.status === 'checking')
      ? { ...prev, status: 'ready', verdict: verdict || { none: true } }
      : prev);
    if (verdict && verdict.message) {
      try {
        await db.exec(
          'INSERT INTO copilot_notes (created_at, product_id, kind, sentiment, risk_level, message, suggestion) VALUES (?,?,?,?,?,?,?)',
          [new Date().toISOString(), plan.productId, 'twap_check',
           (result.data && result.data.sentiment) || null, (result.data && result.data.riskLevel) || null,
           verdict.message, verdict.adjustment]
        );
        loadCopilotNotes();
      } catch (e) { /* ignore */ }
    }
  };

  const draftTwapPlan = () => {
    setTwapFormError(null);
    if (planLocked) return;
    const prod = products.find((p) => p.product_id === twapProductId);
    if (!prod) { setTwapFormError('Pick a product first — the list needs the Coinbase connection.'); return; }
    const total = safeNum(twapForm.totalSize);
    if (total <= 0) { setTwapFormError('Enter a total size greater than zero.'); return; }
    const sliceCount = Math.min(TWAP_SLICE_MAX, Math.max(TWAP_SLICE_MIN, Math.round(safeNum(twapForm.sliceCount, 6))));
    const durationMin = TWAP_DURATIONS.some((d) => d.minutes === safeNum(twapForm.durationMin)) ? safeNum(twapForm.durationMin) : 60;
    const unit = twapIsQuoteSized ? 'USD' : twapBaseCcy;
    const increment = twapIsQuoteSized ? (prod.quote_increment || '0.01') : (prod.base_increment || '0.00000001');
    const minSize = twapIsQuoteSized ? safeNum(prod.quote_min_size, 1) : safeNum(prod.base_min_size);
    const sizes = splitEqualSlices(total, sliceCount, increment);
    if (!sizes) { setTwapFormError('That total cannot fill ' + sliceCount + ' slices — raise the total or reduce the slice count.'); return; }
    if (minSize > 0 && sizes.some((sz) => safeNum(sz) < minSize)) {
      setTwapFormError('Each slice would be about ' + sizes[sizes.length - 1] + ' ' + unit + ' — below the ' + twapProductId + ' minimum of ' + minSize + '. Raise the total or reduce the slice count.');
      return;
    }
    const planId = crypto.randomUUID();
    const plan = {
      planId,
      createdAt: new Date().toISOString(),
      productId: twapProductId,
      side: twapForm.side,
      execStyle: twapForm.execStyle,
      totalSize: String(total),
      sizeUnit: unit,
      durationMin,
      sliceCount,
      intervalSec: Math.round((durationMin * 60) / sliceCount),
      quoteIncrement: prod.quote_increment || '0.01',
      status: 'checking',
      verdict: undefined,
      startedAt: null,
      endedAt: null,
      slices: sizes.map((size, i) => ({
        index: i, size, status: 'planned', clientOrderId: planId + '-s' + i,
        dueAt: null, limitPrice: null, coinbaseOrderId: null, detail: null, executedAt: null,
      })),
    };
    setTwapNotice(null);
    applyPlanUpdate(plan);
    runTwapSanityCheck(plan);
  };

  const armTwapPlan = async () => {
    const plan = activePlanRef.current;
    if (!plan || plan.status !== 'ready') return;
    const start = Date.now();
    const startedAt = new Date(start).toISOString();
    const slices = plan.slices.map((s, i) => ({ ...s, status: 'pending', dueAt: new Date(start + i * plan.intervalSec * 1000).toISOString() }));
    const v = plan.verdict && !plan.verdict.none ? plan.verdict : null;
    try {
      await db.exec(
        'INSERT INTO twap_plans (plan_id, created_at, product_id, side, exec_style, total_size, size_unit, duration_min, slice_count, interval_sec, status, verdict_assessment, verdict_risks, verdict_adjustment, started_at, ended_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)',
        [plan.planId, plan.createdAt, plan.productId, plan.side, plan.execStyle, plan.totalSize, plan.sizeUnit,
         plan.durationMin, plan.sliceCount, plan.intervalSec, 'running',
         v ? v.assessment : null, v ? JSON.stringify(v.risks) : null, v ? v.adjustment : null, startedAt, null]
      );
      for (const s of slices) {
        await db.exec(
          'INSERT INTO twap_slices (plan_id, slice_index, due_at, size, status, client_order_id, limit_price, coinbase_order_id, detail, executed_at) VALUES (?,?,?,?,?,?,?,?,?,?)',
          [plan.planId, s.index, s.dueAt, s.size, 'pending', s.clientOrderId, null, null, null, null]
        );
      }
      // Distill, don't accumulate: the journal keeps the newest 20 plans.
      await db.exec('DELETE FROM twap_slices WHERE plan_id NOT IN (SELECT plan_id FROM twap_plans ORDER BY created_at DESC LIMIT 20)', []);
      await db.exec('DELETE FROM twap_plans WHERE plan_id NOT IN (SELECT plan_id FROM twap_plans ORDER BY created_at DESC LIMIT 20)', []);
    } catch (e) { /* journaling is best-effort — the run itself still starts */ }
    applyPlanUpdate({ ...plan, slices, status: 'running', startedAt });
    loadTwapJournal();
  };

  const pauseTwapPlan = async () => {
    const cur = activePlanRef.current;
    if (!cur || cur.status !== 'running') return;
    applyPlanUpdate({ ...cur, status: 'paused' });
    try { await db.exec("UPDATE twap_plans SET status = 'paused' WHERE plan_id = ?", [cur.planId]); } catch (e) { /* ignore */ }
  };

  const resumeTwapPlan = async () => {
    const cur = activePlanRef.current;
    if (!cur || cur.status !== 'paused') return;
    const nowIso = new Date().toISOString();
    // Slices that came due while paused are SKIPPED, never fired late in a burst —
    // catching up all at once is exactly what time-averaging exists to avoid.
    const missed = new Set(
      cur.slices.filter((s) => s.status === 'pending' && s.dueAt && s.dueAt <= nowIso).map((s) => s.index)
    );
    const next = applyPlanUpdate({
      ...cur,
      status: 'running',
      slices: cur.slices.map((s) => (missed.has(s.index) ? { ...s, status: 'skipped', detail: 'came due while paused' } : s)),
    });
    try {
      if (missed.size > 0) {
        await db.exec("UPDATE twap_slices SET status = 'skipped', detail = 'came due while paused' WHERE plan_id = ? AND status = 'pending' AND due_at <= ?", [cur.planId, nowIso]);
      }
      await db.exec("UPDATE twap_plans SET status = 'running' WHERE plan_id = ?", [cur.planId]);
    } catch (e) { /* ignore */ }
    if (!next.slices.some((s) => s.status === 'pending' || s.status === 'sending')) {
      await settleTwapPlan(cur.planId, 'done');
    }
  };

  const cancelTwapPlan = () => {
    const cur = activePlanRef.current;
    if (!cur || (cur.status !== 'running' && cur.status !== 'paused')) return;
    settleTwapPlan(cur.planId, 'cancelled', 'cancelled before this slice was due');

  if (!isReady) return <div className="connecting">Connecting…</div>;

          </div>

          </div>

                    </select>
                  </div>
                  <div className="side-toggle">
                    <button className={'buy' + (twapForm.side === 'BUY' ? ' active' : '')} onClick={() => setTwapForm({ side: 'BUY' })}>Buy</button>
                    <button className={'sell' + (twapForm.side === 'SELL' ? ' active' : '')} onClick={() => setTwapForm({ side: 'SELL' })}>Sell</button>
                  </div>
                  <div className="type-toggle">
                    <button className={twapForm.execStyle === 'MARKET' ? 'active' : ''} onClick={() => setTwapForm({ execStyle: 'MARKET' })}>Market IOC slices</button>
                    <button className={twapForm.execStyle === 'LIMIT' ? 'active' : ''} onClick={() => setTwapForm({ execStyle: 'LIMIT' })}>Limit at slice start</button>
                  </div>
                  <div className="form-row">
                    <label>
                      {twapIsQuoteSized
                        ? 'Total to spend (USD)'
                        : 'Total to ' + (twapForm.side === 'BUY' ? 'buy' : 'sell') + ' (' + twapBaseCcy + ')'}
                    </label>
                    <input type="number" min="0" value={twapForm.totalSize} onChange={(e) => setTwapForm({ totalSize: e.target.value })} placeholder={twapIsQuoteSized ? '100.00' : '0.05'} />
                  </div>
                  <div className="form-row">
                    <label>Duration</label>
                    <div className="type-toggle" style={{ marginBottom: 0 }}>
                      {TWAP_DURATIONS.map((d) => (
                        <button key={d.minutes} className={safeNum(twapForm.durationMin) === d.minutes ? 'active' : ''} onClick={() => setTwapForm({ durationMin: d.minutes })}>{d.label}</button>
                      ))}
                    </div>
                  </div>
                  <div className="form-row">
                    <label>Slices (4–12)</label>
                    <input type="number" min="4" max="12" step="1" value={twapForm.sliceCount} onChange={(e) => setTwapForm({ sliceCount: e.target.value })} />
                  </div>
                  <button className="btn" style={{ width: '100%' }} onClick={draftTwapPlan} disabled={planLocked}>
                    {planLocked ? 'A plan is already in motion' : 'Plan it — Ledger checks it first'}
                  </button>
                  {twapFormError && <div className="notice error">{twapFormError}</div>}
                  <div className="twap-note">
                    The plan is computed here, locally: equal slices at equal intervals, each slice a real order.
                    Arming it starts a timer in this open app, and the host asks you to confirm every slice before it is sent
                    — ticking &ldquo;remember for this session&rdquo; on the first confirm lets the rest of the run through without re-asking.
                    Nothing runs in the background: close the app and the run stops, honestly marked interrupted.
                  </div>
                </React.Fragment>
              )}
            </div>
            <div>
              {twapNotice && <div className={'notice ' + (twapNotice.type || 'info')}>{twapNotice.text}</div>}

              {activePlan ? (
                <div className="twap-plan-card">
                  <div className="twap-headline">
                    {activePlan.side === 'BUY' ? 'Buy' : 'Sell'} {activePlan.totalSize} {activePlan.sizeUnit} of {activePlan.productId}
                    {activePlan.execStyle === 'MARKET' ? ' · market IOC slices' : ' · limit slices, priced at each interval start'}
                  </div>
                  <div className="twap-subline">
                    {activePlan.sliceCount} slices over {twapDurationLabel(activePlan.durationMin)} — one every {fmtOffset(activePlan.intervalSec)}
                    {activePlan.startedAt ? ' · armed at ' + fmtClock(activePlan.startedAt) : ''}
                  </div>

                  {activePlan.status === 'checking' && (
                    <div className="twap-verdict"><span className="spinner" /> Ledger is reading the plan against the live market…</div>
                  )}
                  {activePlan.verdict && !activePlan.verdict.none && (
                    <div className={'twap-verdict' + (activePlan.verdict.assessment === 'reconsider' ? ' v-reconsider' : activePlan.verdict.assessment === 'workable_with_care' ? ' v-care' : '')}>
                      <strong>Ledger: {String(activePlan.verdict.assessment).replace(/_/g, ' ')}.</strong> {activePlan.verdict.message}
                      {activePlan.verdict.risks.length > 0 && (
                        <ul className="twap-verdict-risks">
                          {activePlan.verdict.risks.map((r, i) => <li key={i}>{r}</li>)}
                        </ul>
                      )}
                      {activePlan.verdict.adjustment && (
                        <div style={{ marginTop: 6 }}>Suggested tweak: {activePlan.verdict.adjustment} — your call; nothing is applied automatically.</div>
                      )}
                    </div>
                  )}
                  {activePlan.verdict && activePlan.verdict.none && (
                    <div className="twap-verdict">Ledger had no opinion this time — the plan stands exactly as you wrote it.</div>
                  )}

                  <div className="twap-rail">
                    <div className="twap-track">
                      {activePlan.slices.map((s) => (
                        <div key={s.index} className={'twap-slice s-' + s.status}>
                          <div className="twap-slice-head">
                            <span>#{s.index + 1}</span>
                            <span>{s.dueAt ? fmtClock(s.dueAt) : '+' + fmtOffset(s.index * activePlan.intervalSec)}</span>
                          </div>
                          <div className="twap-slice-size">
                            {s.size} {activePlan.sizeUnit}{s.limitPrice ? ' @ $' + s.limitPrice : ''}
                          </div>
                          <span className={'slice-chip s-' + s.status}>{TWAP_SLICE_STATUS_LABEL[s.status] || s.status}</span>
                          {s.detail && <div className="twap-slice-detail">{s.detail}</div>}
                        </div>
                      ))}
                    </div>
                  </div>

                  {(activePlan.status === 'running' || activePlan.status === 'paused') && (
                    <div className="twap-progress">
                      {twapSettled}/{activePlan.sliceCount} slices settled
                      {activePlan.status === 'running' && twapNextSlice ? ' · next at ' + fmtClock(twapNextSlice.dueAt) : ''}
                      {activePlan.status === 'paused' ? ' · paused — a slice that comes due while paused is skipped on resume, never fired late' : ''}
                    </div>
                  )}

                  <div className="btn-row">
                    {activePlan.status === 'ready' && (
                      <button className={'btn ' + (activePlan.side === 'BUY' ? 'buy' : 'sell')} onClick={armTwapPlan}>Arm &amp; run</button>
                    )}
                    {(activePlan.status === 'checking' || activePlan.status === 'ready') && (
                      <button className="btn secondary" onClick={discardTwapPlan}>Discard</button>
                    )}
                    {activePlan.status === 'running' && (
                      <button className="btn secondary" onClick={pauseTwapPlan}>Pause</button>
                    )}
                    {activePlan.status === 'paused' && (
                      <button className="btn" onClick={resumeTwapPlan}>Resume</button>
                    )}
                    {(activePlan.status === 'running' || activePlan.status === 'paused') && (
                      <button className="btn secondary" onClick={cancelTwapPlan}>Cancel rest</button>
                    )}
                    {(activePlan.status === 'done' || activePlan.status === 'cancelled' || activePlan.status === 'interrupted') && (
                      <button className="btn secondary" onClick={clearFinishedTwapPlan}>New plan</button>
                    )}
                  </div>

                  {activePlan.status === 'ready' && (
                    <div className="twap-note">
                      Arming starts immediately: slice #1 is sent right away, then one every {fmtOffset(activePlan.intervalSec)}.
                      Each send opens the host&rsquo;s confirm — declining affects only that slice; use Pause or Cancel to stop the rest.
                      A busy confirm dialog or a backgrounded tab postpones a slice, never skips it.
                      {activePlan.execStyle === 'LIMIT' ? ' Limit slices can rest unfilled on the book — tidy up leftovers in Coinbase if you change your mind.' : ''}
                    </div>
                  )}
                </div>
              ) : isSample ? (
                <div className="twap-plan-card">
                  <div className="sample-cap">sample smart order — what a finished run looks like</div>
                  <div className="twap-headline">
                    Buy {SAMPLE_TWAP_DONE.totalSize} {SAMPLE_TWAP_DONE.sizeUnit} of {SAMPLE_TWAP_DONE.productId} · market IOC slices
                  </div>
                  <div className="twap-subline">
                    {SAMPLE_TWAP_DONE.sliceCount} slices over {SAMPLE_TWAP_DONE.durationLabel} — one every {SAMPLE_TWAP_DONE.intervalLabel} · every slice confirmed before it was sent
                  </div>
                  <div className="twap-verdict">
                    <strong>Ledger: looks sound.</strong> The market dipped mid-run and the slices caught it: average
                    fill {fmtUSD(sampleTwapStats(SAMPLE_TWAP_DONE).avgFill)} against {fmtUSD(SAMPLE_TWAP_DONE.oneShotPrice)} for
                    a one-shot market buy at arm time — patience saved ≈ {fmtUSD(sampleTwapStats(SAMPLE_TWAP_DONE).saved)} on
                    the same {SAMPLE_TWAP_DONE.totalSize} {SAMPLE_TWAP_DONE.sizeUnit}.
                  </div>
                  <div className="twap-rail">
                    <div className="twap-track">
                      {SAMPLE_TWAP_DONE.slices.map((s, i) => (
                        <div key={i} className="twap-slice s-accepted">
                          <div className="twap-slice-head">
                            <span>#{i + 1}</span>
                            <span>{s.offset}</span>
                          </div>
                          <div className="twap-slice-size">{s.size} {SAMPLE_TWAP_DONE.sizeUnit} · filled {fmtUSD(s.fill, { decimals: 0 })}</div>
                          <span className="slice-chip s-accepted">accepted</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="divider"></div>
                  <h2 style={{ margin: '0 0 8px' }}>Run history</h2>
                  <div className="twap-journal-row">
                    <div className="twap-journal-top">
                      <span>
                        <span className="order-log-side sell">{SAMPLE_TWAP_RUNNING.side}</span>{' '}
                        {SAMPLE_TWAP_RUNNING.totalSize} {SAMPLE_TWAP_RUNNING.sizeUnit} · {SAMPLE_TWAP_RUNNING.productId}
                      </span>
                      <span className="plan-badge p-running">{SAMPLE_TWAP_RUNNING.status}</span>
                    </div>
                    <div className="muted-small">
                      {SAMPLE_TWAP_RUNNING.sliceCount} slices / {SAMPLE_TWAP_RUNNING.durationLabel} · market IOC · Ledger: looks sound · sample
                    </div>
                    <div className="slice-dots">
                      {SAMPLE_TWAP_RUNNING.sliceStatuses.map((st, i) => (
                        <span key={i} className={'slice-dot s-' + st} title={'#' + (i + 1) + ' ' + st}></span>
                      ))}
                    </div>
                    <div className="muted-small">{SAMPLE_TWAP_RUNNING.caption}</div>
                  </div>
                  <div className="twap-note">
                    This run is part of the sample book. Connect Coinbase, draft a plan on the left, and your own
                    journal starts here — every slice is a real order you confirm before it is sent.
                  </div>
                </div>
              ) : journalRows.length === 0 ? (
                <div className="empty-state">
                  <span className="big-emoji">🧭</span>
                  No smart orders yet. A TWAP plan splits one big order into equal, time-spaced slices, so you pay closer
                  to the period&rsquo;s average price instead of one moment&rsquo;s.
                  <div className="connect-hint">
                    Ledger can help from the provider chat too — try asking: &ldquo;place the next slice of my plan early&rdquo;. Writes always confirm first, chat included.
                  </div>
                </div>
              ) : null}

              {journalRows.length > 0 && (
                <React.Fragment>
                  {activePlan && <div className="divider"></div>}
                  <h2 style={{ margin: '0 0 8px' }}>Run history</h2>
                  {journalRows.map((p) => (
                    <div className="twap-journal-row" key={p.planId}>
                      <div className="twap-journal-top">
                        <span>
                          <span className={'order-log-side ' + (p.side === 'BUY' ? 'buy' : 'sell')}>{p.side}</span> {p.totalSize} {p.sizeUnit} · {p.productId}
                        </span>
                        <span className={'plan-badge p-' + p.status}>{p.status}</span>
                      </div>
                      <div className="muted-small">
                        {p.sliceCount} slices / {twapDurationLabel(p.durationMin)} · {p.execStyle === 'MARKET' ? 'market IOC' : 'limit'} · {timeAgo(p.createdAt)}
                        {p.verdictAssessment ? ' · Ledger: ' + String(p.verdictAssessment).replace(/_/g, ' ') : ''}
                      </div>
                      <div className="slice-dots">
                        {p.sliceStatuses.map((st, i) => (
                          <span key={i} className={'slice-dot s-' + st} title={'#' + (i + 1) + ' ' + st}></span>
                        ))}
                      </div>
                    </div>
                  ))}
                </React.Fragment>
              )}
            </div>
          </div>
        </section>

        {/* COPILOT PANEL */}
        <section className="panel copilot-panel">
          <h2>
            Copilot notes
            {isWaiting && <span className="muted-small"><span className="spinner" /> thinking…</span>}
          </h2>
          {copilotNotice && (
            <div className="notice error">{copilotNotice.text}</div>
          )}
          {isSample ? (
            <div className="copilot-feed">
              {SAMPLE_COPILOT_NOTES.map((n, i) => (
                <div className="copilot-note" key={i}>
                  <div className="copilot-avatar">{CopilotAvatarText()}</div>
                  <div className="copilot-body">
                    <div className="copilot-head">
                      <span className="copilot-name">Ledger</span>
                      <span className="copilot-time">{n.when}</span>
                      {n.productId && <span className="tag">{n.productId}</span>}
                      <span className={'tag sentiment-' + n.sentiment}>{n.sentiment}</span>
                      <span className={'tag risk-' + n.riskLevel}>{n.riskLevel} risk</span>
                    </div>
                    <div className="copilot-msg">{n.message}</div>
                    {n.suggestion && <div className="copilot-suggestion">💡 {n.suggestion}</div>}
                  </div>
                </div>
              ))}
            </div>
          ) : copilotNotes.length === 0 ? (
            <div className="empty-state">
              <span className="big-emoji">🤖</span>
              No notes yet — ask for a portfolio review, a market take, or place a trade to hear from your copilot.
            </div>
          ) : (
            <div className="copilot-feed">
              {copilotNotes.map((n, i) => (
                <div className="copilot-note" key={i}>
                  <div className="copilot-avatar">{CopilotAvatarText()}</div>
                  <div className="copilot-body">
                    <div className="copilot-head">
                      <span className="copilot-name">Ledger</span>
                      <span className="copilot-time">{timeAgo(n.createdAt)}</span>
                      {n.productId && <span className="tag">{n.productId}</span>}
                      {n.sentiment && <span className={'tag sentiment-' + n.sentiment}>{n.sentiment}</span>}
                      {n.riskLevel && <span className={'tag risk-' + n.riskLevel}>{n.riskLevel} risk</span>}
                    </div>
                    <div className="copilot-msg">{n.message}</div>
                    {n.suggestion && <div className="copilot-suggestion">💡 {n.suggestion}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
