<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standup</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <style>
    :root {
      --bg: #f5f2ea; --fg: #232633; --muted: #6b7182;
      --card: #fdfbf5; --inset: #f0ede3; --border: #e2ded0;
      --accent: #35618e; --accent-soft: #e2ebf3; --on-accent: #f7fafc;
      --good: #2f7d55; --warn: #a26d1c; --danger: #a94440;
      --chip: #edeadf;
      --skel-a: #eae6da; --skel-b: #f7f4eb;
      --shadow: 0 10px 30px rgba(46, 51, 68, 0.10);
    }
    :root[data-theme="dark"] {
      --bg: #14161d; --fg: #e7e6e0; --muted: #9aa0af;
      --card: #1c1f28; --inset: #171a22; --border: #2e323e;
      --accent: #82aad3; --accent-soft: #253547; --on-accent: #0f1723;
      --good: #5cbd8e; --warn: #d3a049; --danger: #d97b70;
      --chip: #262a35;
      --skel-a: #232733; --skel-b: #2b3040;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { min-width: 44px; min-height: 44px; cursor: pointer; font-family: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 18px 16px 48px; }
    header.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 {
      font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 600; letter-spacing: -0.01em;
      margin: 0; color: var(--fg);
    }
    h1 .mast { color: var(--accent); }
    .tag { color: var(--muted); font-size: 0.95rem; }
    .hello { margin-left: auto; color: var(--muted); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .refresh {
      border: 1px solid var(--border); background: var(--card); color: var(--fg);
      border-radius: 999px; padding: 8px 16px; font-size: 0.86rem;
      transition: border-color 160ms ease-out, color 160ms ease-out;
    }
    .refresh:hover { border-color: var(--accent); color: var(--accent); }
    .status {
      display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 4px;
      padding: 6px 14px; border-radius: 999px; background: var(--card);
      border: 1px solid var(--border); font-size: 0.9rem; color: var(--muted);
      transition: color 180ms ease-out, border-color 180ms ease-out;
    }
    .status.hot { color: var(--accent); border-color: var(--accent); }
    .status.bad { color: var(--danger); border-color: var(--danger); }
    .dots { display: inline-flex; gap: 4px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.1s ease-out infinite; }
    .dots i:nth-child(2) { animation-delay: 0.18s; } .dots i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%, 70%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    .tabs { display: flex; gap: 6px; margin: 12px 0 18px; flex-wrap: wrap; }
    .tab {
      border: 1px solid transparent; background: none; color: var(--muted);
      border-radius: 12px; padding: 10px 16px; font-size: 0.94rem; font-weight: 600;
      transition: color 150ms ease-out, background 150ms ease-out;
    }
    .tab:hover { color: var(--fg); }
    .tab.on { background: var(--card); border-color: var(--border); color: var(--accent); box-shadow: var(--shadow); }
    .tab .n {
      display: inline-block; min-width: 1.5em; padding: 1px 7px; margin-left: 6px;
      border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 0.76rem;
    }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
    @media (min-width: 940px) {

    .card h2 {

    }
    .card h2 .n { margin-left: auto; letter-spacing: 0; font-weight: 600; }
    .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; gap: 10px; align-items: flex-start;
      border: 1px solid var(--border); border-left: 3px solid var(--border);
      border-radius: 12px; padding: 10px 12px; background: var(--inset);
    }
    .row.aging { border-left-color: var(--accent); }
    .row.old { border-left-color: var(--warn); }
    .row.ancient { border-left-color: var(--danger); }
    .row-main { min-width: 0; flex: 1; }
    .row-title { margin: 0 0 4px; font-size: 0.94rem; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
    .row-kind { color: var(--muted); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.04em; }
    .row-meta { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.79rem; color: var(--muted); }
    .repo { font-weight: 600; }
    .age.old { color: var(--warn); font-weight: 700; }
    .age.ancient { color: var(--danger); font-weight: 700; }
    .lab { border: 1px solid var(--border); background: var(--chip); border-radius: 999px; padding: 2px 8px; font-size: 0.71rem; color: var(--muted); }
    .row-url {
      margin: 6px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.71rem; color: var(--muted);

    .copy {
      flex: none; border: 1px solid var(--border); background: var(--card); color: var(--muted);

    .copy.fail { color: var(--danger); border-color: var(--danger); }
    .soft-note { color: var(--muted); font-size: 0.86rem; line-height: 1.5; margin: 8px 0 0; }
    .warn-note { color: var(--warn); }
    .lane-note {
      color: var(--muted); font-size: 0.84rem; line-height: 1.5; margin: 16px auto 0;

    .rhythm { display: flex; align-items: flex-end; gap: 4px; height: 100px; padding-top: 6px; }

    .rhythm .bar { background: var(--accent); border-radius: 4px 4px 2px 2px; transition: height 240ms ease-out; }
    .rhythm .bar.zero { background: var(--chip); }
    .dlab { font-size: 0.62rem; color: var(--muted); }
    .story-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; margin: 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem; line-height: 1.45; }
    .story-row:last-child { border-bottom: none; }
    .story-dot { color: var(--accent); font-size: 0.6rem; flex: none; }
    .story-line { min-width: 0; overflow-wrap: anywhere; }

    .btn {
      border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);

    }

    .brief-lede { font-family: Georgia, 'Iowan Old Style', serif; font-size: 1.05rem; line-height: 1.55; margin: 14px 0 10px; }
    .prios { margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 10px; }
    .prio { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--inset); }
    .prio-why { color: var(--muted); font-size: 0.84rem; margin: 4px 0 0; line-height: 1.45; }
    .prio-act { color: var(--accent); font-weight: 600; font-size: 0.86rem; margin: 4px 0 0; }
    .defer { margin-top: 14px; }
    .defer h3 { margin: 0 0 6px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
    .defer-row { margin: 4px 0; font-size: 0.86rem; line-height: 1.45; color: var(--fg); }
    .journal-row { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.88rem; line-height: 1.45; }
    .journal-row:last-child { border-bottom: none; }
    .journal-when { color: var(--muted); font-size: 0.76rem; display: block; margin-bottom: 2px; }
    .watch-add { display: flex; gap: 8px; margin-bottom: 4px; }
    .winput {
      flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--border); border-radius: 12px;
      background: var(--inset); color: var(--fg); padding: 8px 12px; font-size: 0.94rem; font-family: inherit;
    }
    .winput:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .watch-grid { margin-top: 12px; }
    .wrepo { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--inset); }
    .wname { margin: 0 0 6px; font-weight: 700; font-size: 0.94rem; overflow-wrap: anywhere; }
    .wstats { margin: 0; color: var(--muted); font-size: 0.84rem; line-height: 1.5; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .wnum { color: var(--fg); font-weight: 700; font-size: 1.05rem; }
    .wdot { font-size: 0.62rem; }
    .wdot.hot { color: var(--good); }
    .wdot.warm { color: var(--warn); }
    .wdot.cold { color: var(--muted); }
    .wremove {
      margin-top: 10px; border: 1px solid var(--border); background: none; color: var(--muted);
      border-radius: 10px; padding: 6px 12px; font-size: 0.79rem;
      transition: color 150ms ease-out, border-color 150ms ease-out;
    }
    .wremove:hover { color: var(--danger); border-color: var(--danger); }
    .wremove.arm { color: var(--danger); border-color: var(--danger); }
    .steps { margin: 10px 0; padding-left: 20px; line-height: 1.6; font-size: 0.92rem; }
    .steps li { margin-bottom: 6px; }
    .story { line-height: 1.55; margin: 8px 0; font-size: 0.95rem; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); border-radius: 6px; padding: 1px 6px; font-size: 0.85em; }
    .connecting { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: var(--muted); font-style: italic; font-family: Georgia, serif; }
    @media (max-width: 420px) {
      .wrap { padding: 14px 10px 36px; }
      .card { padding: 12px; }
      .hello { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ============================================================
// 1. SNUG BRIDGE RUNTIME (MANDATORY — copy exactly, never edit)
// ============================================================
const SnugBridge = {
  instanceId: null,
  theme: 'light',
  capabilities: {},
  ready: false,
  pending: new Map(),    // requestId -> { resolve, onStream }
  dbPending: new Map(),  // requestId -> resolve
  netPending: new Map(), // requestId -> resolve
  listeners: new Set(),  // re-render triggers for hooks

  post(frame) {
    window.parent.postMessage({ v: 1, instanceId: this.instanceId, ...frame }, '*');
  },
  notify() { for (const fn of this.listeners) fn(); },
};

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.v !== 1) return;

  if (data.type === 'snug:host-ready') {
    SnugBridge.instanceId = data.instanceId;
    if (data.theme) SnugBridge.theme = data.theme;
    if (data.capabilities) SnugBridge.capabilities = data.capabilities;
    SnugBridge.ready = true;
    SnugBridge.notify();
    return;
  }

  if (data.type === 'snug:app-response') {
    const entry = SnugBridge.pending.get(data.requestId);
    if (!entry) return; // unknown or superseded requestId — ignore
    if (data.streaming) {
      // Cumulative provisional text — display only. NEVER resolve here.
      if (entry.onStream && typeof data.text === 'string') entry.onStream(data.text);
      return;
    }
    SnugBridge.pending.delete(data.requestId); // terminal — exactly one per requestId
    entry.resolve(data.ok ? { ok: true, data: data.data } : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:db-response') {
    const resolve = SnugBridge.dbPending.get(data.requestId);
    if (!resolve) return;
    SnugBridge.dbPending.delete(data.requestId);
    // Result fields (rows/columns/value/bytesBase64) live at the TOP LEVEL of the frame.
    resolve(data.ok
      ? { ok: true, rows: data.rows, columns: data.columns, value: data.value, bytesBase64: data.bytesBase64 }
      : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:net-response') {
    const resolve = SnugBridge.netPending.get(data.requestId);
    if (!resolve) return;
    SnugBridge.netPending.delete(data.requestId);
    // Result fields (status/headers/body/truncated) live at the TOP LEVEL of the frame.
    resolve(data.ok
      ? { ok: true, status: data.status, headers: data.headers, body: data.body, truncated: data.truncated }
      : { ok: false, error: data.error });
    return;
  }

  if (data.type === 'snug:host-event') {
    if (data.event === 'theme-change' && data.data && data.data.theme) {
      SnugBridge.theme = data.data.theme;
      SnugBridge.notify();
    }
    // Unknown host events MUST be ignored (the protocol is additive).
  }
});

function snugDbRequest(op, args) {
  return new Promise((resolve) => {
    const requestId = crypto.randomUUID();
    SnugBridge.dbPending.set(requestId, resolve);
    SnugBridge.post({ type: 'snug:db-request', requestId, op, ...args });
  });
}

function snugNetRequest(fields) {
  if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
  return new Promise((resolve) => {
    const requestId = crypto.randomUUID();
    SnugBridge.netPending.set(requestId, resolve);
    SnugBridge.post({ type: 'snug:net-request', requestId, ...fields });
  });
}

// ============================================================
// 2. useSnugApp (MANDATORY — copy exactly, never edit)
// ============================================================
function useSnugApp(meta) {
  const [, setTick] = useState(0);
  const [isWaiting, setIsWaiting] = useState(false);
  const [lastResponse, setLastResponse] = useState(null);
  const inFlight = useRef(0);
  const metaRef = useRef(meta);

  useEffect(() => {
    const rerender = () => setTick((n) => n + 1);
    SnugBridge.listeners.add(rerender);
    const m = metaRef.current;
    SnugBridge.post({
      type: 'snug:app-announce',
      appId: m.appId,
      displayName: m.displayName,
      description: m.description,
      iconEmoji: m.iconEmoji,
      iconColor: m.iconColor,
    });
    return () => SnugBridge.listeners.delete(rerender);
  }, []);

  const sendMessage = useCallback((action, payload, opts) => {
    if (!SnugBridge.ready) return Promise.resolve({ ok: false, error: { code: 'HOST_ERROR', message: 'not connected to host yet', retryable: true } });
    const requestId = crypto.randomUUID(); // fresh per request — multiple in flight are legal
    inFlight.current += 1;
    setIsWaiting(true);
    return new Promise((resolve) => {
      SnugBridge.pending.set(requestId, {
        onStream: opts && opts.onStream,
        resolve: (result) => {
          inFlight.current -= 1;
          if (inFlight.current === 0) setIsWaiting(false);
          setLastResponse(result);
          resolve(result);
        },
      });
      SnugBridge.post({
        type: 'snug:app-message',
        requestId,
        appId: metaRef.current.appId,
        action,
        payload,
        state: opts && opts.state,
        responseSchema: opts && opts.responseSchema,
      });
    });
  }, []);

  return {
    isReady: SnugBridge.ready,
    theme: SnugBridge.theme,
    isWaiting,
    lastResponse,
    sendMessage,
  };
}

// ============================================================
// 3. usePersistedState (MANDATORY — copy exactly, never edit)
// Storage is HOST-BROKERED key-value. The sandboxed iframe has a
// null origin: no browser storage API works here.
// ============================================================
function usePersistedState(key, initialValue) {
  const [state, setState] = useState(initialValue);
  // Tracks WHICH key hydrated: a key change must re-hydrate before any write-back,
  // or the old key's state would overwrite the new key's stored value.
  const [hydratedKey, setHydratedKey] = useState(null);
  const initialRef = useRef(initialValue);

  useEffect(() => {
    let cancelled = false;
    const hydrate = async () => {
      const result = await snugDbRequest('kvGet', { key });
      if (cancelled) return;
      if (result.ok && result.value != null) {
        const stored = result.value;
        const init = initialRef.current;
        // Merge objects with defaults so fields added in newer code are never undefined.
        setState(
          stored && typeof stored === 'object' && !Array.isArray(stored) &&
          init && typeof init === 'object' && !Array.isArray(init)
            ? { ...init, ...stored }
            : stored
        );
      } else {
        setState(initialRef.current); // nothing stored under this key — back to defaults
      }
      setHydratedKey(key);
    };
    const onReady = () => {
      if (!SnugBridge.ready) return;
      SnugBridge.listeners.delete(onReady);
      hydrate();
    };
    if (SnugBridge.ready) hydrate();
    else SnugBridge.listeners.add(onReady);
    return () => { cancelled = true; SnugBridge.listeners.delete(onReady); };
  }, [key]);

  useEffect(() => {
    if (hydratedKey !== key) return;
    snugDbRequest('kvSet', { key, value: state }); // fire-and-forget; host acks via db-response
  }, [hydratedKey, key, state]);

  return [state, setState];
}

// ============================================================
// 4. useAppDB (copy exactly when the app needs SQL; omit otherwise)
// ============================================================
function useAppDB() {
  return useMemo(() => ({
    async exec(sql, params) {
      const result = await snugDbRequest('exec', { sql, params });
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db exec failed');
      return { rows: result.rows, columns: result.columns }; // { rows: unknown[][], columns: string[] }
    },
    async exportDb() {
      const result = await snugDbRequest('export', {});
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db export failed');
      return result.bytesBase64;
    },
    async importDb(bytesBase64) {
      const result = await snugDbRequest('import', { bytesBase64 });
      if (!result.ok) throw new Error((result.error && result.error.message) || 'db import failed');
    },
  }), []);
}

// ============================================================
// 5. useConnectedFetch (copy exactly when the app calls an approved API; omit otherwise)
// The sandboxed app has NO network of its own. This reaches ONLY your app's APPROVED
// hosts THROUGH the host, which injects your saved credentials, caps sizes, asks you
// before any write, and scrubs the response. You never see a token.
// A connection whose host only the USER knows (a device on their network): address it as
// snug-connection://<slot>/<path> — the host resolves the approved address; you never learn it.
// ALWAYS resolves: { ok:true, status, headers, body } or { ok:false, error }.
// ============================================================
function useConnectedFetch() {
  return useMemo(() => ({
    fetch(url, opts) {
      return snugNetRequest({
        url,
        method: (opts && opts.method) || 'GET',
        headers: opts && opts.headers,
        body: opts && opts.body,
      });
    },
  }), []);
}
    // ============================================================
    // 5. RESPONSE SCHEMA — describe the JSON the agent must return
    // ============================================================
    const RESPONSE_SCHEMA = {
      briefing: 'string: two or three calm sentences describing what this morning looks like overall (ALWAYS include)',
      priorities: [{
        title: 'string: the queue item title, verbatim from the queue sent to you',
        repo: "string: the owner/repo it lives in, e.g. 'octocat/hello-world'",
        why: 'string: one short line on why this comes first',
        suggestedAction: "string: one concrete next step, e.g. 'review and approve' or 'answer the question in the thread'",
      }],
      deferrable: [{
        title: 'string: a queue item that can safely wait today, verbatim from the queue',
        repo: 'string: the owner/repo it lives in',
        why: 'string: one short line on why it can wait',
      }],
    };

    // ============================================================
    // 6. YOUR APP — Standup
    // ============================================================
    // The complement thesis: github.com already shows EVERYTHING; Standup shows
    // what needs YOU, in the two minutes before the day starts. Every number on
    // screen is wire truth from api.github.com through the governed seam — the
    // agent's ONLY surface is the morning briefing (ADR-0011 agent-driven), and
    // an off-schema reply is refused: the raw queue always stands, with a note.
    // Briefings journal into the app's own SQLite file; so does the watchlist.
    // Standup never writes to GitHub — writes belong to the chat lane, which
    // asks the user before anything changes.

    const API = 'https://api.github.com';
    const DAY_MS = 24 * 60 * 60 * 1000;

    const headerOf = (res, name) => {
      const headers = res && res.headers;
      if (!headers || typeof headers !== 'object') return null;
      const want = name.toLowerCase();
      for (const key of Object.keys(headers)) {
        if (key.toLowerCase() === want) return String(headers[key]);
      }
      return null;
    };

    const parseJson = (res) => {
      if (res && typeof res.body === 'object' && res.body !== null) return res.body;
      if (res && typeof res.body === 'string') {
        try { return JSON.parse(res.body); } catch (e) { return null; }
      }
      return null;
    };

    // 403/429 with X-RateLimit-Remaining: 0 is GitHub pacing us — a calm state, not an error.
    const rateLimited = (res) => (res.status === 403 || res.status === 429) && headerOf(res, 'x-ratelimit-remaining') === '0';
    const resetCopy = (res) => {
      const raw = Number(headerOf(res, 'x-ratelimit-reset'));
      if (!Number.isFinite(raw) || raw <= 0) return 'in a little while';
      return 'around ' + new Date(raw * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    };

    const ageDays = (iso) => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / DAY_MS));
    const relAge = (iso) => {
      const ms = Date.now() - new Date(iso).getTime();
      if (!Number.isFinite(ms) || ms < 60 * 60 * 1000) return 'just now';
      const h = Math.floor(ms / (60 * 60 * 1000));
      if (h < 24) return h + 'h';
      const d = Math.floor(h / 24);
      if (d < 14) return d + 'd';
      if (d < 63) return Math.floor(d / 7) + 'w';
      return Math.floor(d / 30) + 'mo';
    };
    const relAgo = (iso) => { const r = relAge(iso); return r === 'just now' ? r : r + ' ago'; };
    // Age-based visual weight: old items gently insist, they never shout.
    const weightOf = (iso) => {
      const d = ageDays(iso);
      return d >= 21 ? 'ancient' : d >= 7 ? 'old' : d >= 2 ? 'aging' : 'fresh';
    };

    const repoOf = (item) => {
      const tail = typeof item.repository_url === 'string' ? item.repository_url.split('/repos/')[1] : '';
      return tail || 'unknown/repo';
    };
    const slimItem = (item) => ({
      title: String(item.title || 'untitled'),
      repo: repoOf(item),
      url: String(item.html_url || ''),
      isPR: !!item.pull_request,
      created: item.created_at || new Date().toISOString(),
      labels: Array.isArray(item.labels)
        ? item.labels.map((l) => String((l && l.name) || '')).filter(Boolean).slice(0, 4)
        : [],
    });

    // The pulse is digested LOCALLY — the event feed never leaves the app except
    // as the compact summary the briefing request carries.
    const digestEvent = (e) => {
      const repo = (e.repo && e.repo.name) || 'somewhere';
      const p = e.payload || {};
      const num = (p.pull_request && p.pull_request.number) || (p.issue && p.issue.number) || '?';
      switch (e.type) {
        case 'PushEvent': {
          const n = Array.isArray(p.commits) ? p.commits.length : (p.size || 1);
          return 'pushed ' + n + (n === 1 ? ' commit to ' : ' commits to ') + repo;
        }
        case 'PullRequestEvent': {
          const verb = p.action === 'closed' && p.pull_request && p.pull_request.merged ? 'merged' : (p.action || 'touched');
          return verb + ' PR #' + num + ' in ' + repo;
        }
        case 'PullRequestReviewEvent': return 'reviewed PR #' + num + ' in ' + repo;
        case 'PullRequestReviewCommentEvent': return 'commented on PR #' + num + ' in ' + repo;
        case 'IssuesEvent': return (p.action || 'touched') + ' issue #' + num + ' in ' + repo;
        case 'IssueCommentEvent': return 'commented on #' + num + ' in ' + repo;
        case 'CreateEvent': return 'created ' + (p.ref_type || 'something') + (p.ref ? ' ' + p.ref : '') + ' in ' + repo;
        case 'ReleaseEvent': return 'released ' + ((p.release && p.release.tag_name) || 'a version') + ' of ' + repo;
        case 'ForkEvent': return 'forked ' + repo;
        case 'WatchEvent': return 'starred ' + repo;
        default: return null;
      }
    };
    const rhythmOf = (events) => {
      const days = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date(Date.now() - i * DAY_MS);
        days.push({ key: d.toISOString().slice(0, 10), label: 'SMTWTFS'[d.getDay()], count: 0 });
      }
      const byKey = new Map(days.map((d) => [d.key, d]));
      for (const e of events) {
        const row = byKey.get(String(e.created_at || '').slice(0, 10));
        if (row) row.count += 1;
      }
      return days;
    };

    // HARD validation of the agent's briefing. Anything off-schema returns null
    // and the raw queue stands — the model never gets to blur wire truth.
    const cleanStr = (v) => (typeof v === 'string' && v.trim() ? v.trim() : null);
    const validateBriefing = (raw) => {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
      const briefing = cleanStr(raw.briefing);
      if (!briefing || !Array.isArray(raw.priorities)) return null;
      const priorities = [];
      for (const p of raw.priorities.slice(0, 6)) {
        if (!p || typeof p !== 'object') return null;
        const title = cleanStr(p.title), repo = cleanStr(p.repo), why = cleanStr(p.why), act = cleanStr(p.suggestedAction);
        if (!title || !repo || !why || !act) return null;
        priorities.push({ title, repo, why, suggestedAction: act });
      }
      const deferrable = [];
      if (raw.deferrable !== undefined) {
        if (!Array.isArray(raw.deferrable)) return null;
        for (const p of raw.deferrable.slice(0, 6)) {
          if (!p || typeof p !== 'object') return null;
          const title = cleanStr(p.title), repo = cleanStr(p.repo), why = cleanStr(p.why);
          if (!title || !repo || !why) return null;
          deferrable.push({ title, repo, why });
        }
      }
      return { briefing, priorities, deferrable };
    };

    const DDL = [
      `CREATE TABLE IF NOT EXISTS standup_watchlist (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        repo TEXT NOT NULL UNIQUE,
        added_at TEXT NOT NULL
      )`,
      `CREATE TABLE IF NOT EXISTS standup_briefings (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        brief TEXT NOT NULL,
        priorities TEXT NOT NULL,
        deferred_items TEXT NOT NULL,
        queue_size INTEGER NOT NULL,
        at TEXT NOT NULL
      )`,
    ];

    const TABS = [
      ['queue', 'queue'],
      ['pulse', 'pulse'],
      ['briefing', 'briefing'],
      ['watchlist', 'watchlist'],
    ];
    const GROUPS = [
      ['reviews', '🔍', 'review requests'],
      ['assigned', '🧷', 'assigned to you'],
      ['mentions', '💬', 'mentions'],
    ];

    function App() {
      const { isReady, theme, isWaiting, sendMessage } = useSnugApp({
        appId: 'github-standup',
        displayName: 'Standup',
        description: 'Your GitHub morning: the review requests, assignments, and mentions that need you, a pulse of your recent activity, and an agent briefing that ranks the queue.',
        iconEmoji: '🗞',
        iconColor: '#35618e',
      });
      const gh = useConnectedFetch();
      const db = useAppDB();
      const [prefs, setPrefs] = usePersistedState('standup-prefs', { tab: 'queue' });

      const [conn, setConn] = useState({ phase: 'checking', detail: '' }); // checking | ok | unauthed | limited | down
      const [user, setUser] = useState(null);
      const [queue, setQueue] = useState(null);   // { reviews|assigned|mentions: {items|null, note}, at }
      const [pulse, setPulse] = useState(null);   // { list, note }
      const [watch, setWatch] = useState([]);     // [{ repo, stats|null, error }]
      const [watchInput, setWatchInput] = useState('');
      const [watchNote, setWatchNote] = useState('');
      const [armedRemove, setArmedRemove] = useState(null);
      const [briefing, setBriefing] = useState(null); // { data|null, note, at }
      const [history, setHistory] = useState([]);
      const [dbErr, setDbErr] = useState(null);
      const [copied, setCopied] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const busyRef = useRef(false);

      useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);

      const ghGet = (path) => gh.fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });

      const loadStored = async () => {
        const w = await db.exec('SELECT repo FROM standup_watchlist ORDER BY id', []);
        const repos = w.rows.map(([repo]) => repo);
        setWatch(repos.map((repo) => ({ repo, stats: null, error: '' })));
        const h = await db.exec('SELECT brief, queue_size, at FROM standup_briefings ORDER BY id DESC LIMIT 5', []);
        setHistory(h.rows.map(([brief, size, at]) => ({ brief, size, at })));
        return repos;
      };

      const loadGroup = async (qualifier) => {
        const res = await ghGet('/search/issues?q=is:open+' + qualifier + '&sort=updated&order=desc&per_page=25');
        if (!res.ok) return { items: null, note: 'the connection did not answer (' + ((res.error && res.error.message) || 'no reply') + ').' };
        if (rateLimited(res)) return { items: null, note: 'search is rate-limited — it resets ' + resetCopy(res) + '.' };
        if (res.status === 401) return { items: null, note: 'GitHub said the credential is not valid.' };
        if (res.status !== 200) return { items: null, note: 'GitHub answered ' + res.status + ' for this search.' };
        const json = parseJson(res);
        return { items: Array.isArray(json && json.items) ? json.items.map(slimItem) : [], note: '' };
      };

      const refreshWatch = async (repos) => {
        const out = [];
        for (const repo of repos) {
          const res = await ghGet('/repos/' + repo);
          if (res.ok && res.status === 200) {
            const j = parseJson(res) || {};
            out.push({ repo, stats: { open: Number(j.open_issues_count) || 0, pushed: j.pushed_at || null }, error: '' });
          } else if (res.ok && res.status === 404) {
            out.push({ repo, stats: null, error: 'not found — private, renamed, or gone' });
          } else if (res.ok && rateLimited(res)) {
            out.push({ repo, stats: null, error: 'rate-limited, resets ' + resetCopy(res) });
          } else {
            out.push({ repo, stats: null, error: 'did not answer this time' });
          }
        }
        setWatch(out);
      };

      const refresh = async (repos) => {
        if (busyRef.current) return;
        busyRef.current = true;
        setRefreshing(true);
        try {
          const me = await ghGet('/user');
          if (!me.ok) {
            setConn({ phase: 'down', detail: (me.error && me.error.message) || 'the connection did not answer' });
            return;
          }
          if (me.status === 401) { setConn({ phase: 'unauthed', detail: '' }); return; }
          if (rateLimited(me)) { setConn({ phase: 'limited', detail: resetCopy(me) }); return; }
          if (me.status !== 200) { setConn({ phase: 'down', detail: 'GitHub answered ' + me.status }); return; }
          const u = parseJson(me) || {};
          setUser({ login: u.login || 'you', name: u.name || '' });
          setConn({ phase: 'ok', detail: '' });

          const [reviews, assigned, mentions] = await Promise.all([
            loadGroup('review-requested:@me'),
            loadGroup('assignee:@me'),
            loadGroup('mentions:@me'),
          ]);
          // Dedupe across kinds (an assigned issue that also mentions you shows once):
          // review requests win, then assignments, then mentions. Calm, not complete —
          // completeness is github.com's job.
          const seen = new Set();
          const take = (group) => {
            if (!group.items) return group;
            const items = group.items.filter((it) => it.url && !seen.has(it.url));
            for (const it of items) seen.add(it.url);
            return { ...group, items };
          };
          setQueue({ reviews: take(reviews), assigned: take(assigned), mentions: take(mentions), at: new Date().toISOString() });

          if (u.login) {
            const ev = await ghGet('/users/' + encodeURIComponent(u.login) + '/events?per_page=100');
            if (ev.ok && ev.status === 200) {
              const list = parseJson(ev);
              setPulse({ list: Array.isArray(list) ? list : [], note: '' });
            } else if (ev.ok && rateLimited(ev)) {
              setPulse((p) => ({ list: (p && p.list) || [], note: 'the activity feed is rate-limited — it resets ' + resetCopy(ev) + '.' }));
            } else {
              setPulse((p) => ({ list: (p && p.list) || [], note: 'recent activity did not load this time.' }));
            }
          }
          await refreshWatch(repos);
        } finally {
          busyRef.current = false;
          setRefreshing(false);
        }
      };

      useEffect(() => {
        if (!isReady) return;
        let cancelled = false;
        (async () => {
          let repos = [];
          try {
            for (const stmt of DDL) await db.exec(stmt, []);
            repos = await loadStored();
          } catch (e) {
            if (!cancelled) setDbErr(String((e && e.message) || e));
          }
          if (!cancelled) await refresh(repos);
        })();
        return () => { cancelled = true; };
      }, [isReady]);

      // ── derived ──────────────────────────────────────────────
      const queueCount = queue
        ? GROUPS.reduce((n, [k]) => n + ((queue[k].items && queue[k].items.length) || 0), 0)
        : null;
      const storyLines = useMemo(() => {
        if (!pulse) return [];
        const out = [];
        for (const e of pulse.list) {
          const line = digestEvent(e);
          if (line) out.push({ line, at: e.created_at });
          if (out.length >= 8) break;
        }
        return out;
      }, [pulse]);
      const rhythm = useMemo(() => rhythmOf((pulse && pulse.list) || []), [pulse]);
      const maxRhythm = Math.max(1, ...rhythm.map((d) => d.count));
      const total14 = rhythm.reduce((a, d) => a + d.count, 0);
      const hour = new Date().getHours();
      const greeting = hour < 12 ? 'good morning' : hour < 18 ? 'good afternoon' : 'good evening';
      const tab = TABS.some(([t]) => t === prefs.tab) ? prefs.tab : 'queue';

      // ── actions ──────────────────────────────────────────────
      const copyUrl = async (url) => {
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(url); ok = true; }
        } catch (e) { ok = false; }
        if (!ok) {
          try {
            const ta = document.createElement('textarea');
            ta.value = url;
            ta.setAttribute('readonly', 'readonly');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            ok = document.execCommand('copy');
            document.body.removeChild(ta);
          } catch (e) { ok = false; }
        }
        const key = ok ? url : url + '!fail';
        setCopied(key);
        window.setTimeout(() => setCopied((c) => (c === key ? null : c)), 1800);
      };

      const brief = async () => {
        if (!queue || isWaiting) return;
        // LEAN REQUEST (ADR-0018): the situation rides `state` ONCE — a compact
        // queue (never raw API objects) and a digested pulse. The payload carries
        // only the two derived numbers the ranking pivots on.
        const compact = [];
        const push = (kind, group) => {
          if (!group.items) return;
          for (const it of group.items.slice(0, 10)) {
            compact.push({ kind, repo: it.repo, title: it.title, ageDays: ageDays(it.created), labels: it.labels.slice(0, 3) });
          }
        };
        push('review', queue.reviews); push('assigned', queue.assigned); push('mention', queue.mentions);
        const result = await sendMessage('morning_briefing', {
          queueSize: compact.length,
          oldestAgeDays: compact.reduce((m, it) => Math.max(m, it.ageDays), 0),
        }, {
          state: {
            queue: compact,
            pulse: { last14DayCounts: rhythm.map((d) => d.count), recent: storyLines.slice(0, 5).map((s) => s.line) },
          },
          responseSchema: RESPONSE_SCHEMA,
        });
        if (!result.ok) {
          setBriefing({ data: null, note: 'the agent went quiet (' + ((result.error && result.error.message) || 'no reply') + ') — your raw queue stands.', at: new Date().toISOString() });
          return;
        }
        const valid = validateBriefing(result.data);
        if (!valid) {
          setBriefing({ data: null, note: 'the agent answered off-script — your raw queue stands, unranked.', at: new Date().toISOString() });
          return;
        }
        setBriefing({ data: valid, note: '', at: new Date().toISOString() });
        try {
          await db.exec(
            'INSERT INTO standup_briefings (brief, priorities, deferred_items, queue_size, at) VALUES (?, ?, ?, ?, ?)',
            [valid.briefing, JSON.stringify(valid.priorities), JSON.stringify(valid.deferrable), compact.length, new Date().toISOString()],
          );
          const h = await db.exec('SELECT brief, queue_size, at FROM standup_briefings ORDER BY id DESC LIMIT 5', []);
          setHistory(h.rows.map(([b, size, at]) => ({ brief: b, size, at })));
        } catch (e) { setDbErr(String((e && e.message) || e)); }
      };

      const addWatch = async () => {
        const repo = watchInput.trim().replace(/^\/+|\/+$/g, '');
        if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { setWatchNote('use the owner/repo form, e.g. facebook/react'); return; }
        if (watch.length >= 6) { setWatchNote('six is plenty — this is a glance, not a dashboard.'); return; }
        if (watch.some((w) => w.repo.toLowerCase() === repo.toLowerCase())) { setWatchNote('already on the list.'); return; }
        setWatchNote('');
        try {
          await db.exec('INSERT INTO standup_watchlist (repo, added_at) VALUES (?, ?)', [repo, new Date().toISOString()]);
        } catch (e) { setDbErr(String((e && e.message) || e)); return; }
        setWatchInput('');
        const next = [...watch, { repo, stats: null, error: '' }];
        setWatch(next);
        refreshWatch(next.map((w) => w.repo));
      };

      const removeWatch = async (repo) => {
        if (armedRemove !== repo) { setArmedRemove(repo); return; }
        setArmedRemove(null);
        try {
          await db.exec('DELETE FROM standup_watchlist WHERE repo = ?', [repo]);
        } catch (e) { setDbErr(String((e && e.message) || e)); return; }
        setWatch((prev) => prev.filter((w) => w.repo !== repo));
      };

      const urlForTitle = (title) => {
        if (!queue) return null;
        for (const [k] of GROUPS) {
          const found = (queue[k].items || []).find((it) => it.title === title);
          if (found) return found.url;
        }
        return null;
      };

      // ── render helpers (plain functions, not components: inputs keep focus) ──
      const renderSkeletonRows = (n, keyPrefix) => (
        <div>
          {Array.from({ length: n }, (_, i) => (
            <div className="skel" key={keyPrefix + i}>
              <div className="b" style={{ width: (78 - i * 14) + '%' }} />
              <div className="b" style={{ width: (42 + i * 9) + '%', height: 8 }} />
            </div>
          ))}
        </div>
      );

      const renderRow = (it) => {
        const w = weightOf(it.created);
        const cState = copied === it.url ? 'done' : copied === it.url + '!fail' ? 'fail' : '';
        return (
          <li className={'row ' + w} key={it.url || it.title}>
            <div className="row-main">
              <p className="row-title">{it.isPR ? <span className="row-kind">PR · </span> : null}{it.title}</p>
              <p className="row-meta">
                <span className="repo">{it.repo}</span>
                <span className={'age ' + w}>open {relAge(it.created)}</span>
                {it.labels.slice(0, 3).map((l) => <span className="lab" key={l}>{l}</span>)}
              </p>
              <p className="row-url">{it.url}</p>
            </div>
            <button
              className={'copy' + (cState ? ' ' + cState : '')}
              onClick={() => copyUrl(it.url)}
              aria-label={'copy the address of ' + it.title}
            >
              {cState === 'done' ? 'copied' : cState === 'fail' ? 'select ↓' : 'copy'}
            </button>
          </li>
        );
      };

      const renderGroup = ([k, icon, title]) => {
        const group = queue[k];
        return (
          <section className="card" key={k}>
            <h2><span aria-hidden="true">{icon}</span> {title} <span className="n">{group.items ? group.items.length : '—'}</span></h2>
            {group.note ? <p className="soft-note warn-note">{group.note}</p> : null}
            {group.items && group.items.length === 0 && !group.note ? <p className="soft-note">nothing here — clear.</p> : null}
            {group.items && group.items.length > 0 ? <ul className="rows">{group.items.map(renderRow)}</ul> : null}
          </section>
        );
      };

      const renderQueue = () => {
        if (queue === null) {
          return (
            <div className="grid cols-3">
              {GROUPS.map(([k, icon, title]) => (
                <section className="card" key={k}>
                  <h2><span aria-hidden="true">{icon}</span> {title}</h2>
                  {renderSkeletonRows(3, k)}
                </section>
              ))}
            </div>
          );
        }
        const anyNote = GROUPS.some(([k]) => queue[k].note);
        if (queueCount === 0 && !anyNote) {
          return (
            <div className="card empty">
              <div className="big" aria-hidden="true">☕</div>
              <p className="empty-line">Nothing needs you right now.</p>
              <p className="empty-sub">
                Review requests, assignments, and mentions land here the moment they exist.
                Meanwhile, writes live in the chat lane — try asking:
                <em> “label my oldest assigned issue as blocked”</em>.
                The host confirms any write before it happens.
              </p>
            </div>
          );
        }
        return (
          <div>
            <div className="grid cols-3">{GROUPS.map(renderGroup)}</div>
            <p className="lane-note">
              Standup only reads. To act, ask the chat lane — e.g. “label my oldest assigned
              issue as blocked” — and the host will confirm before anything changes.
            </p>
          </div>
        );
      };

      const renderPulse = () => (
        <div className="grid cols-2">
          <section className="card">
            <h2><span aria-hidden="true">📈</span> 14-day rhythm <span className="n">{pulse ? total14 + ' actions' : '—'}</span></h2>
            {pulse === null ? renderSkeletonRows(3, 'rh') : (
              <div>
                <div className="rhythm" role="img" aria-label={'activity over the last 14 days: ' + total14 + ' actions'}>
                  {rhythm.map((d) => (
                    <div className="col" key={d.key} title={d.key + ': ' + d.count + (d.count === 1 ? ' action' : ' actions')}>
                      <div
                        className={'bar' + (d.count === 0 ? ' zero' : '')}
                        style={{ height: Math.max(4, Math.round((d.count / maxRhythm) * 72)) + 'px' }}
                      />
                      <span className="dlab" aria-hidden="true">{d.label}</span>
                    </div>
                  ))}
                </div>
                {pulse.note ? <p className="soft-note warn-note">{pulse.note}</p> : null}
                {total14 === 0 && !pulse.note ? <p className="soft-note">a quiet fortnight — the bars will fill as you work.</p> : null}
              </div>
            )}
          </section>
          <section className="card">
            <h2><span aria-hidden="true">🗒</span> the story so far</h2>
            {pulse === null ? renderSkeletonRows(4, 'st') : storyLines.length === 0
              ? <p className="soft-note">no recent activity in the feed yet — quiet keyboards make no noise. When you push, review, or comment, the story writes itself here.</p>
              : storyLines.map((s, i) => (
                  <p className="story-row" key={i}>
                    <span className="story-dot" aria-hidden="true">●</span>
                    <span className="story-line">{s.line}</span>
                    <span className="story-when">{relAge(s.at)}</span>
                  </p>
                ))}
          </section>
        </div>
      );

      const renderBriefing = () => (
        <div className="grid cols-2">
          <section className="card">
            <h2><span aria-hidden="true">🌤</span> morning briefing</h2>
            {!queue ? <p className="soft-note">the queue has to load first — the briefing ranks what is actually there.</p> : (
              <div>
                <button className="btn" onClick={brief} disabled={isWaiting}>
                  {isWaiting ? <span className="dots"><i /><i /><i /></span> : (briefing && briefing.data ? 'brief me again' : 'what needs me today?')}
                </button>
                {briefing && briefing.note ? <p className="soft-note warn-note">{briefing.note}</p> : null}
                {!briefing && !isWaiting ? (
                  <p className="soft-note">
                    One tap sends your queue and pulse to the agent; it answers with a ranked
                    briefing — what comes first, why, and one concrete next step each. Off-script
                    replies are refused: the raw queue always stands. Every briefing is journaled
                    into this app's own database file.
                  </p>
                ) : null}
                {briefing && briefing.data ? (
                  <div className="brief">
                    <p className="brief-lede">{briefing.data.briefing}</p>
                    {briefing.data.priorities.length > 0 ? (
                      <ol className="prios">
                        {briefing.data.priorities.map((p, i) => {
                          const u = urlForTitle(p.title);
                          return (
                            <li className="prio" key={i}>
                              <p className="row-title">{p.title}</p>
                              <p className="row-meta"><span className="repo">{p.repo}</span></p>
                              <p className="prio-why">{p.why}</p>
                              <p className="prio-act">→ {p.suggestedAction}</p>
                              {u ? <p className="row-url">{u}</p> : null}
                            </li>
                          );
                        })}
                      </ol>
                    ) : <p className="soft-note">it ranked nothing urgent — a good sign.</p>}
                    {briefing.data.deferrable.length > 0 ? (
                      <div className="defer">
                        <h3>can wait today</h3>
                        {briefing.data.deferrable.map((p, i) => (
                          <p className="defer-row" key={i}>
                            <span className="repo">{p.repo}</span> — {p.title} <span className="prio-why">({p.why})</span>
                          </p>
                        ))}
                      </div>
                    ) : null}
                  </div>
                ) : null}
              </div>
            )}
          </section>
          <section className="card">
            <h2><span aria-hidden="true">📓</span> standup journal</h2>
            {history.length === 0
              ? <p className="soft-note">past briefings are kept here, in your own database — a small history of what each morning looked like.</p>
              : history.map((h, i) => (
                  <div className="journal-row" key={i}>
                    <span className="journal-when">
                      {new Date(h.at).toLocaleDateString([], { month: 'short', day: 'numeric' })}
                      {' · '}
                      {new Date(h.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}
                      {' · '}{h.size} in the queue
                    </span>
                    {h.brief}
                  </div>
                ))}
          </section>
        </div>
      );

      const pushClass = (iso) => {
        if (!iso) return 'cold';
        const d = ageDays(iso);
        return d < 2 ? 'hot' : d < 14 ? 'warm' : 'cold';
      };

      const renderWatch = () => (
        <section className="card">
          <h2><span aria-hidden="true">🔭</span> watchlist <span className="n">{watch.length}/6</span></h2>
          <div className="watch-add">
            <input
              className="winput"
              value={watchInput}
              placeholder="owner/repo"
              aria-label="repository to watch"
              onChange={(e) => setWatchInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') addWatch(); }}
            />
            <button className="btn slim" onClick={addWatch}>watch</button>
          </div>
          {watchNote ? <p className="soft-note warn-note">{watchNote}</p> : null}
          {watch.length === 0 ? (
            <p className="soft-note">
              A few repos you care about, at a glance: open issues + PRs, and how fresh the last
              push is. GitHub already has the full dashboard — this is the glance before you ask
              the chat lane to dig in.
            </p>
          ) : (
            <div className="grid cols-3 watch-grid">
              {watch.map((w) => (
                <div className="wrepo" key={w.repo}>
                  <p className="wname">{w.repo}</p>
                  {w.stats ? (
                    <p className="wstats">
                      <span className="wnum">{w.stats.open}</span> open issues + PRs
                      <span className={'wdot ' + pushClass(w.stats.pushed)} aria-hidden="true">●</span>
                      {w.stats.pushed ? 'pushed ' + relAgo(w.stats.pushed) : 'no pushes yet'}
                    </p>
                  ) : (
                    <p className="wstats">{w.error || 'loading…'}</p>
                  )}
                  <button
                    className={'wremove' + (armedRemove === w.repo ? ' arm' : '')}
                    onClick={() => removeWatch(w.repo)}
                  >
                    {armedRemove === w.repo ? 'sure?' : 'unwatch'}
                  </button>
                </div>
              ))}
            </div>
          )}
        </section>
      );

      const renderConnect = () => (
        <div className="grid cols-2">
          <section className="card">
            <h2><span aria-hidden="true">🔌</span> connect github</h2>
            <p className="story">
              Standup reads GitHub <em>as you</em> — your review requests, assignments, and
              mentions — so it needs the <code>github</code> connection before it can show anything real.
            </p>
            <ol className="steps">
              <li>Open this app's <b>connection wizard</b> from the host.</li>
              <li>Pick either credential shape: a <b>fine-grained personal access token</b> (read access is enough) or an <b>OAuth app</b> sign-in.</li>
              <li>The credential stays with the host — it is injected on each call and never enters this page.</li>
            </ol>
            <p className="soft-note">
              Standup itself never writes. Anything that changes GitHub belongs to the chat lane,
              and the host asks you before any write happens.
            </p>
            <button className="btn slim" onClick={() => refresh(watch.map((w) => w.repo))} disabled={refreshing} style={{ marginTop: 10 }}>
              {refreshing ? 'checking…' : "i've connected — check again"}
            </button>
          </section>
          <section className="card">
            <h2><span aria-hidden="true">👀</span> what your queue will look like</h2>
            {renderSkeletonRows(4, 'cx')}
            <p className="soft-note">calm rows: repo, title, age, labels — the old ones gently insist.</p>
          </section>
        </div>
      );

      // ── top-level render ─────────────────────────────────────
      if (!isReady) return <div className="connecting">setting up your standup…</div>;

      const statusText =
        conn.phase === 'checking' ? 'waking up — checking your connection…'
        : conn.phase === 'unauthed' ? 'not connected yet — the queue shown is only a sketch.'
        : conn.phase === 'limited' ? 'GitHub is pacing us — the rate limit resets ' + conn.detail + '. Nothing is wrong.'
        : conn.phase === 'down' ? 'the connection didn’t answer: ' + conn.detail
        : refreshing ? 'refreshing your morning…'
        : queueCount === 0 ? 'all clear — nothing needs you.'
        : queueCount === null ? 'reading your queue…'
        : queueCount + (queueCount === 1 ? ' thing needs' : ' things need') + ' you.';

      return (
        <div className="wrap">
          <header className="brand">
            <h1><span className="mast">Stand</span>up</h1>
            <span className="tag">what needs you, before you ask</span>
            <span className="hello">
              {user ? greeting + ', ' + user.login : ''}
              <button className="refresh" onClick={() => refresh(watch.map((w) => w.repo))} disabled={refreshing}>
                {refreshing ? 'refreshing…' : 'refresh'}
              </button>
            </span>
          </header>
          <div className={'status' + (conn.phase === 'down' ? ' bad' : refreshing || conn.phase === 'checking' ? ' hot' : '')} role="status">
            {(refreshing || conn.phase === 'checking') && <span className="dots"><i /><i /><i /></span>}
            {statusText}
          </div>
          {dbErr ? <p className="soft-note warn-note">storage hiccup: {dbErr}</p> : null}
          {conn.phase === 'unauthed' || conn.phase === 'down' ? renderConnect() : (
            <div>
              <nav className="tabs" role="tablist" aria-label="surfaces">
                {TABS.map(([t, label]) => (
                  <button
                    key={t}
                    role="tab"
                    aria-selected={tab === t}
                    className={'tab' + (tab === t ? ' on' : '')}
                    onClick={() => setPrefs((p) => ({ ...p, tab: t }))}
                  >
                    {label}
                    {t === 'queue' && queueCount !== null ? <span className="n">{queueCount}</span> : null}
                  </button>
                ))}
              </nav>
              {tab === 'queue' ? renderQueue() : null}
              {tab === 'pulse' ? renderPulse() : null}
              {tab === 'briefing' ? renderBriefing() : null}
              {tab === 'watchlist' ? renderWatch() : null}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
