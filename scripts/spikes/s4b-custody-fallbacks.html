<title>S4b Custody Fallbacks</title>
<style>
:root{--bg:#f6f5f2;--fg:#1c1b19;--muted:#6a675f;--line:#d9d6ce;--card:#fff;--ok:#1a7f37;--bad:#b42318;--warn:#9a6700;--accent:#b4531b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--fg:#ebe8e1;--muted:#9c988e;--line:#33312c;--card:#1f1d1a;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--accent:#e8804a}}
:root[data-theme="dark"]{--bg:#151412;--fg:#ebe8e1;--muted:#9c988e;--line:#33312c;--card:#1f1d1a;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--accent:#e8804a}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;margin:0;padding:20px;max-width:1000px;margin-inline:auto}
h1{font-size:19px;margin:0 0 4px}h2{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ops{border-left:3px solid var(--accent);background:var(--card);padding:8px 12px;margin:8px 0 12px}.ops li{margin:3px 0}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid var(--accent)}
.row{margin:6px 0;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:6px;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.ok{border-color:var(--ok)}.bad{border-color:var(--bad)}.warn{border-color:var(--warn)}
pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:380px;font-size:11px}
.grid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
</style>
<div id="app"></div>
<script id="logic">
// S4b — TASK-20260905-host-bindings-spikes. S4 showed the FILES form of artifact.publish is disabled in this view
// (capability_disabled). This page measures the three fallbacks D3 names, in order of preference:
//   A  artifact-html : the SQLite bytes embedded base64 in the page + artifact.publish(html) (reloads every open view)
//   B  artifact-db   : the bytes as ≤200 000-char base64 chunks in db docs snugfile/c<i> + a manifest (org-internal only)
//   C  localStorage  : per-viewer, lossy — the last resort
// Everything is recorded to db doc results/s4b (sequential awaited sets — a handful of writes) and shown on screen.
// The page carries its OWN canonical source: the html this page republishes is rebuilt from the constants below
// (never from the live DOM), so a reloaded view runs exactly this logic again and can verify what it embedded.
const BUILD = 'b1';
const SIZE = 2 * 1024 * 1024, SEED = 0x534e5547, CHUNK = 200000;
const STYLE = (document.querySelector('style') && document.querySelector('style').textContent) || '';
const LOGIC = document.getElementById('logic').textContent;
const SS = 'snug-s4b', LS = 'snug-s4b-b64';
const PAGE_LOADED_AT = new Date().toISOString();
const $ = (id) => document.getElementById(id);
let R = {}, caps = { db: null, art: null }, bytes = null, b64 = null, sha = null;

// ---------- deterministic 2 MiB with the SQLite magic (mulberry32), sha256 via WebCrypto ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function generate() { const u = new Uint8Array(SIZE); const r = mulberry32(SEED); for (let i = 0; i < SIZE; i++) u[i] = (r() * 256) | 0; const magic = 'SQLite format 3\0'; for (let i = 0; i < 16; i++) u[i] = magic.charCodeAt(i); return u; }
async function sha256(u) { const h = await crypto.subtle.digest('SHA-256', u); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function toB64(u) { let s = ''; const step = 0x8000; for (let i = 0; i < u.length; i += step) s += String.fromCharCode.apply(null, u.subarray(i, i + step)); return btoa(s); }
function fromB64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
const now = () => new Date().toISOString();
const err = (e) => ({ code: e && e.code, message: String(e && e.message || e).slice(0, 300), name: e && e.name });

// ---------- the canonical page source (what A republishes) ----------
function esc(s) { return s.replace(/<\/script/gi, '<\\/script'); }
function pageHtml(embeddedB64) {
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S4b Custody Fallbacks</title><style>' + STYLE + '</style></head><body>'
    + '<div id="app"></div>'
    + (embeddedB64 ? '<script type="text/plain" id="snug-db" data-sha="' + sha + '" data-at="' + now() + '">' + embeddedB64 + '<\/script>' : '')
    + '<script id="logic">' + esc(LOGIC) + '<\/script></body></html>';
}

// ---------- persistence of the record ----------
async function save() {
  R.meta = Object.assign(R.meta || {}, { build: BUILD, lastSaveAt: now(), pageLoadedAt: PAGE_LOADED_AT, origin: location.origin, framed: window !== window.top, claudeUse: !!(window.claude && typeof window.claude.use === 'function') });
  const body = JSON.parse(JSON.stringify(R));
  try { sessionStorage.setItem(SS, JSON.stringify(body)); } catch (e) { R.meta.sessionStorageError = err(e); }
  $('json').textContent = JSON.stringify(body, null, 1);
  if (!caps.db) { $('dbs').textContent = 'db: unavailable — use copy JSON'; $('dbs').className = 'row warn'; return; }
  try { await caps.db.doc('results/s4b').set(body); $('dbs').textContent = 'db: wrote results/s4b at ' + R.meta.lastSaveAt; $('dbs').className = 'row ok'; }
  catch (e) { $('dbs').textContent = 'db: write FAILED ' + JSON.stringify(err(e)); $('dbs').className = 'row bad'; }
}
function show(id, obj, cls) { const el = $(id); el.textContent = JSON.stringify(obj); el.className = 'row ' + (cls || ''); }

// ---------- steps ----------
async function step1() {
  const t = performance.now(); bytes = generate(); const genMs = Math.round(performance.now() - t);
  sha = await sha256(bytes); const t2 = performance.now(); b64 = toB64(bytes); const b64Ms = Math.round(performance.now() - t2);
  R.generate = { at: now(), byteLength: bytes.length, sha256: sha, genMs, b64Chars: b64.length, b64Ms, head: 'SQLite format 3' };
  show('s1', R.generate, 'ok'); for (const b of ['b2a', 'b2b', 'b2c']) $(b).disabled = false; await save();
}
// A — html republish with the bytes embedded
async function step2a() {
  const rec = { at: now(), form: 'html', htmlChars: null, ms: null, ok: false, code: null, message: null, version: null };
  R.htmlPublish = rec; show('s2a', rec, 'warn'); await save();
  try { sessionStorage.setItem(SS + '-expect', JSON.stringify({ sha, publishedAt: rec.at, build: BUILD })); } catch (e) {}
  if (!caps.art) { rec.code = 'no_artifact_namespace'; rec.message = 'claude.use("artifact") resolved null'; show('s2a', rec, 'bad'); await save(); return; }
  const html = pageHtml(b64); rec.htmlChars = html.length;
  const t = performance.now();
  try { const r = await caps.art.publish(html); rec.ms = Math.round(performance.now() - t); rec.ok = true; rec.version = r && r.version; show('s2a', rec, 'ok'); }
  catch (e) { rec.ms = Math.round(performance.now() - t); Object.assign(rec, err(e)); show('s2a', rec, 'bad'); }
  await save(); // the shell reloads every open view on success — the reloaded page runs verifyEmbedded() at boot
}
async function verifyEmbedded() {
  const el = document.getElementById('snug-db');
  let expect = null; try { expect = JSON.parse(sessionStorage.getItem(SS + '-expect') || 'null'); } catch (e) {}
  const rec = { at: now(), found: !!el, expected: expect, chars: el ? el.textContent.length : 0, sha: null, equal: null, decodeMs: null, dataSha: el ? el.getAttribute('data-sha') : null, embeddedAt: el ? el.getAttribute('data-at') : null, pageLoadedAt: PAGE_LOADED_AT, loadedAfterPublish: expect ? PAGE_LOADED_AT > expect.publishedAt : null };
  if (el) { const t = performance.now(); try { const u = fromB64(el.textContent); rec.sha = await sha256(u); rec.byteLength = u.length; rec.decodeMs = Math.round(performance.now() - t); rec.equal = expect ? rec.sha === expect.sha : (rec.sha === rec.dataSha); } catch (e) { rec.error = err(e); } }
  R.htmlVerify = rec; show('s3a', rec, rec.equal ? 'ok' : (el ? 'bad' : 'warn')); await save();
}
// B — db chunks
async function step2b() {
  const rec = { at: now(), chunkChars: CHUNK, n: Math.ceil(b64.length / CHUNK), writes: [], totalMs: null, maxChunkMs: null, ok: false, errors: [] };
  R.dbChunks = rec; show('s2b', { n: rec.n, status: 'writing…' }, 'warn');
  if (!caps.db) { rec.errors.push({ code: 'no_db' }); show('s2b', rec, 'bad'); await save(); return; }
  const t0 = performance.now();
  for (let i = 0; i < rec.n; i++) {
    const t = performance.now(); const data = b64.slice(i * CHUNK, (i + 1) * CHUNK);
    try { await caps.db.doc('snugfile/c' + i).set({ i, n: rec.n, chars: data.length, data }); rec.writes.push({ i, ms: Math.round(performance.now() - t), ok: true }); }
    catch (e) { rec.writes.push({ i, ms: Math.round(performance.now() - t), ok: false, ...err(e) }); rec.errors.push({ i, ...err(e) }); if (rec.errors.length >= 2) break; }
    show('s2b', { n: rec.n, written: rec.writes.filter(w => w.ok).length, errors: rec.errors.length }, 'warn');
  }
  try { await caps.db.doc('snugfile/manifest').set({ n: rec.n, sha256: sha, totalChars: b64.length, byteLength: bytes.length, at: now(), chunkChars: CHUNK }); rec.manifestOk = true; } catch (e) { rec.manifestOk = false; rec.errors.push({ manifest: true, ...err(e) }); }
  rec.totalMs = Math.round(performance.now() - t0); rec.maxChunkMs = Math.max(...rec.writes.map(w => w.ms)); rec.ok = rec.errors.length === 0 && rec.manifestOk;
  show('s2b', rec, rec.ok ? 'ok' : 'bad'); await save();
}
async function verifyChunks() {
  const rec = { at: now(), readMs: null, n: null, sha: null, equal: null, errors: [] };
  if (!caps.db) { rec.errors.push({ code: 'no_db' }); R.dbVerify = rec; show('s3b', rec, 'bad'); await save(); return; }
  const t0 = performance.now();
  try {
    const m = await caps.db.doc('snugfile/manifest').get(); const man = m && m.exists ? m.data() : null;
    if (!man) { rec.errors.push({ code: 'no_manifest' }); } else {
      rec.n = man.n; let s = '';
      for (let i = 0; i < man.n; i++) { const c = await caps.db.doc('snugfile/c' + i).get(); if (!c || !c.exists) { rec.errors.push({ i, code: 'missing_chunk' }); break; } s += c.data().data; }
      if (!rec.errors.length) { const u = fromB64(s); rec.sha = await sha256(u); rec.byteLength = u.length; rec.equal = rec.sha === man.sha256; rec.manifestSha = man.sha256; }
    }
  } catch (e) { rec.errors.push(err(e)); }
  rec.readMs = Math.round(performance.now() - t0); R.dbVerify = rec; show('s3b', rec, rec.equal ? 'ok' : 'bad'); await save();
}
// C — localStorage
async function step2c() {
  const rec = { at: now(), chars: b64.length, ms: null, ok: false };
  const t = performance.now();
  try { localStorage.setItem(LS, b64); localStorage.setItem(LS + '-sha', sha); rec.ms = Math.round(performance.now() - t); rec.ok = true; } catch (e) { rec.ms = Math.round(performance.now() - t); Object.assign(rec, err(e)); }
  R.localStorage = rec; show('s2c', rec, rec.ok ? 'ok' : 'bad'); await save();
}
async function verifyLocal() {
  const rec = { at: now(), found: false, sha: null, equal: null };
  try { const s = localStorage.getItem(LS); const want = localStorage.getItem(LS + '-sha'); if (s) { rec.found = true; rec.chars = s.length; const u = fromB64(s); rec.sha = await sha256(u); rec.equal = rec.sha === want; rec.want = want; } } catch (e) { rec.error = err(e); }
  R.localVerify = rec; show('s3c', rec, rec.equal ? 'ok' : (rec.found ? 'bad' : 'warn')); await save();
}
async function env() {
  R.env = { at: now(), href: location.href.slice(0, 160), origin: location.origin, ancestors: (() => { try { return [...(location.ancestorOrigins || [])]; } catch (e) { return null; } })(), ua: navigator.userAgent.slice(0, 120), storageEstimate: null };
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); R.env.storageEstimate = { quota: e.quota, usage: e.usage }; } } catch (e) {}
  show('s4', R.env, 'ok'); await save();
}

// ---------- boot ----------
function render() {
  $('app').innerHTML = `
<h1>S4b — custody fallbacks <small style="font-weight:normal;color:var(--muted)">html republish · db chunks · localStorage — build ${BUILD}, loaded ${PAGE_LOADED_AT}</small></h1>
<div class="ops"><b>Operator walk</b><ol>
<li>Wait for the capabilities line. Click <b>1 generate</b>.</li>
<li>Click <b>2A publish as html</b>. The view reloads by itself (that is the html form's contract). After the reload, row <b>3A</b> fills in on its own — it says whether the embedded bytes came back byte-identical. Then click <b>1 generate</b> again (the reload cleared the in-memory bytes) before the next step.</li>
<li>Click <b>2B write db chunks</b> (14 writes of ~200 KB; ~10–60 s), then <b>3B verify db chunks</b>. Reload the page and click <b>3B</b> again.</li>
<li>Click <b>2C write localStorage</b>, then <b>3C verify localStorage</b>; reload and click <b>3C</b> again.</li>
<li>Click <b>4 env</b>. Say "done". Nothing to paste — every step is written to <code>results/s4b</code>.</li></ol></div>
<div id="caps" class="row warn">capabilities: resolving…</div>
<div id="dbs" class="row">db: not attempted yet</div>
<h2>steps</h2>
<div class="grid">
<button id="b1">1 generate</button><div id="s1" class="row">—</div>
<button id="b2a" disabled>2A publish as html</button><div id="s2a" class="row">—</div>
<button id="b3a" disabled>3A verify embedded</button><div id="s3a" class="row">— (runs by itself after the reload)</div>
<button id="b2b" disabled>2B write db chunks</button><div id="s2b" class="row">—</div>
<button id="b3b">3B verify db chunks</button><div id="s3b" class="row">—</div>
<button id="b2c" disabled>2C write localStorage</button><div id="s2c" class="row">—</div>
<button id="b3c">3C verify localStorage</button><div id="s3c" class="row">—</div>
<button id="b4">4 env</button><div id="s4" class="row">—</div>
</div>
<h2>result JSON (results/s4b) <button id="copy">copy JSON</button></h2>
<pre id="json">{}</pre>`;
  $('b1').onclick = step1; $('b2a').onclick = step2a; $('b3a').onclick = verifyEmbedded; $('b2b').onclick = step2b; $('b3b').onclick = verifyChunks; $('b2c').onclick = step2c; $('b3c').onclick = verifyLocal; $('b4').onclick = env;
  $('copy').onclick = async () => { try { await navigator.clipboard.writeText($('json').textContent); $('copy').textContent = 'copied'; } catch (e) { $('copy').textContent = 'select the box by hand'; } };
}
async function boot() {
  render();
  try { const prev = JSON.parse(sessionStorage.getItem(SS) || 'null'); if (prev && typeof prev === 'object') { R = prev; R.meta = R.meta || {}; R.meta.reloads = (R.meta.reloads || 0) + 1; } } catch (e) {}
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { $('caps').textContent = 'capabilities: no claude.use — plain file or chat runtime; db + artifact unavailable'; $('caps').className = 'row bad'; }
  else {
    const [db, art] = await Promise.all([c.use('db'), c.use('artifact')]);
    caps.db = db; caps.art = art;
    $('caps').textContent = 'capabilities: db=' + (db ? 'yes' : 'null') + ' artifact=' + (art ? 'yes' : 'null'); $('caps').className = 'row ' + (db && art ? 'ok' : 'warn');
  }
  if (document.getElementById('snug-db')) { $('b3a').disabled = false; await verifyEmbedded(); }
  else if (R.htmlPublish && R.htmlPublish.ok && !R.htmlVerify) { R.htmlVerify = { at: now(), found: false, note: 'reloaded after an accepted html publish but no #snug-db element is present — the served page is not the one published?', pageLoadedAt: PAGE_LOADED_AT }; show('s3a', R.htmlVerify, 'bad'); }
  await save();
}
boot();
</script>
