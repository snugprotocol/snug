<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Snug Runtime Probe</title>
<style>
/* one column of facts and two tables; a diagnostic, not a product surface */
:root{--bg:#fbfaf7;--fg:#201c17;--muted:#6f675c;--line:#ddd6c9;--accent:#b4541a;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171310;--fg:#f1eadf;--muted:#a99d8b;--line:#3a2f24;--accent:#f0a05c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171310;--fg:#f1eadf;--muted:#a99d8b;--line:#3a2f24;--accent:#f0a05c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);max-width:820px;margin:0 auto;padding-block:16px;padding-inline:16px;font:14px/1.5 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
p{color:var(--muted);margin:8px 0}
.t{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:8px 0;font:12px/1.45 var(--mono)}
td{padding:3px 6px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
td:first-child{width:1%;white-space:nowrap;color:var(--muted)}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
textarea{box-sizing:border-box;width:100%;height:96px;background:transparent;color:var(--fg);border:1px solid var(--line);font:12px var(--mono)}
#saved{color:var(--accent)}
</style>
<h1>Snug Runtime Probe</h1>
<p>Loading this page is free. Only "measure the prompt limit" spends your Claude usage.</p>
<div class="t"><table id="facts"></table></div>
<div class="t"><table id="caps"></table></div>
<p id="plan"></p>
<button id="measure">measure the prompt limit</button> <button id="cancel" disabled>cancel</button>
<div class="t"><table id="rungs"></table></div>
<p>These two are free.</p>
<button id="source">read my own source</button> <button id="save">test download</button>
<div class="t"><table id="extras"></table></div>
<button id="copy">copy report</button> <span id="copied"></span> <span id="saved"></span>
<textarea id="out" readonly></textarea>
<script>
(() => {
const CAPS = ['sample', 'artifact', 'downloads', 'db', 'user', 'assets', 'files', 'mcp', 'room', 'comments', 'permissions'];
const RUN = Date.now().toString(36);
let LADDER = [8192, 65536, 65537], NS = {};
const FILL = 'The quick brown fox jumps over the lazy dog. ';
const JSON_ASK = 'Reply with exactly this JSON and nothing else: {"move":{"from":"e2","to":"e4"},"message":"ok"}';
const plan = () => `up to ${LADDER.length + 1} calls, ${LADDER.reduce((a, b) => a + b, 0)} bytes of prompt in all (a size over the limit is refused at once and costs nothing); stops at the first size that fails.`;
const KEY = 'snug-probe';
const LATE = {}, GONE = {};
const R = { schema: 'snug-chat-probe/3', at: '', ua: '', facts: {}, caps: {}, limits: null, permissions: null, ladder: [], json: null, source: null, download: null };
const $ = (id) => document.getElementById(id);
const errName = (e) => (e && e.name) || 'Error';
const attempt = (fn) => { try { return fn(); } catch (e) { return errName(e); } };
const say = (id, text) => { $(id).textContent = text; };
const rows = (id, obj) => {
  const t = $(id);
  t.textContent = '';
  for (const k in obj) {
    const r = t.insertRow();
    r.insertCell().textContent = k;
    r.insertCell().textContent = JSON.stringify(obj[k]);
  }
};
const bounded = (p, ms, late) => {
  let t;
  return Promise.race([p, new Promise((r) => { t = setTimeout(r, ms, late); })]).finally(() => clearTimeout(t));
};
const timed = async (fn, limit) => {
  const t0 = Date.now(), o = {};
  try {
    o.r = await bounded(Promise.resolve().then(fn), limit, LATE);
  } catch (e) {
    o.error = errName(e);
    o.message = String((e && e.message) || e).slice(0, 120);
  }
  o.ms = Date.now() - t0;
  return o;
};
const bare = (u) => u.split(/[?#]/)[0];
const shape = (o, known) => {
  if (Object(o) !== o) return String(o);
  const out = {}, names = Object.getOwnPropertyNames, p = Object.getPrototypeOf(o);
  for (const k of [...names(o), ...(p && Object.getPrototypeOf(p) ? names(p) : []), ...known]) {
    if (k !== 'constructor') out[k] = attempt(() => typeof o[k]);
  }
  return out;
};
const FACTS = {
  href: () => bare(location.href),
  origin: () => location.origin,
  ancestors: () => Array.from(location.ancestorOrigins),
  baseURI: () => bare(document.baseURI),
  compatMode: () => document.compatMode,
  isSecureContext: () => isSecureContext,
  cryptoSubtle: () => typeof crypto.subtle,
  claude: () => shape(window.claude, ['complete']),
  storage: () => shape(window.storage, ['get', 'set', 'delete', 'list']),
  scripts: () => Array.from(document.scripts, (s) => bare(s.src).slice(0, 120)),
  popup: () => {
    const w = window.open('about:blank');
    if (!w) return 'blocked';
    w.close();
    return 'ok';
  },
  form: () => {
    let fired = 'blocked';
    const f = document.createElement('form');
    f.onsubmit = (e) => { fired = 'ok'; e.preventDefault(); };
    document.body.append(f);
    f.requestSubmit();
    f.remove();
    return fired;
  },
};
const idb = () => new Promise((ok, no) => {
  const q = indexedDB.open(KEY);
  q.onsuccess = () => { q.result.close(); indexedDB.deleteDatabase(KEY); ok('ok'); };
  q.onerror = () => no(q.error);
});
const kid = () => {
  let spv = 0, own = 0;
  addEventListener('securitypolicyviolation', (e) => { spv++; if (e.originalPolicy === "connect-src 'none'") own++; });
  const tell = (fetched) => setTimeout(() => {
    let reach = 'ok';
    try { void parent.document.title; } catch (e) { reach = e.name; }
    parent.postMessage({ snugProbe: 1, origin: self.origin, spv, own, fetched, reach }, '*');
  }, 300);
  fetch('https://example.com').then(() => tell('ok'), (e) => tell(e.name));
};
const nested = () => new Promise((ok) => {
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');
  f.hidden = true;
  f.srcdoc = `<meta http-equiv="Content-Security-Policy" content="connect-src 'none'"><script>(${kid})()<\/script>`;
  addEventListener('message', (e) => { if (e.source === f.contentWindow && e.data && e.data.snugProbe) ok(e.data); });
  document.body.append(f);
});
const boot = async () => {
  const f = R.facts, here = attempt(() => location.href);
  R.ua = attempt(() => navigator.userAgent);
  for (const k in FACTS) f[k] = attempt(FACTS[k]);
  for (const k of ['localStorage', 'sessionStorage']) f[k] = attempt(() => { window[k].setItem(KEY, '1'); window[k].removeItem(KEY); return 'ok'; });
  for (const k of ['replaceState', 'pushState']) f[k] = attempt(() => { history[k](null, '', '#/x'); return 'ok'; });
  attempt(() => history.replaceState(null, '', here));
  rows('facts', f);
  f.runs = attempt(() => { const n = (+localStorage.getItem(KEY + '-runs') || 0) + 1; localStorage.setItem(KEY + '-runs', n); return n; });
  f.indexedDB = await bounded(idb(), 3e3, 'timeout').catch(errName);
  f.nested = await bounded(nested(), 5e3, 'no-reply').catch(errName);
  rows('facts', f);
  if (typeof (window.claude && window.claude.use) === 'function') {
    await Promise.all(CAPS.map(async (name) => {
      const ns = await bounded(Promise.resolve().then(() => window.claude.use(name)), 12e3, LATE).catch(errName);
      R.caps[name] = ns === LATE ? 'timeout' : typeof ns === 'string' ? ns : ns === null ? 'null' : typeof ns;
      if (Object(ns) === ns) NS[name] = ns;
    }));
    if (NS.sample) R.limits = await bounded(Promise.resolve().then(() => NS.sample.limits()), 12e3, 'timeout').catch(errName);
    if (NS.permissions) R.permissions = await bounded(Promise.resolve().then(() => NS.permissions.state()), 12e3, 'timeout').catch(errName);
    const max = R.limits && R.limits.maxPromptBytes;
    if (max > 0) LADDER = [...new Set([8192, 65536, max, max + 1])].sort((a, b) => a - b);
  }
  rows('caps', { ...R.caps, limits: R.limits, permissions: R.permissions });
  say('plan', plan());
  keep();
};
const nonce = () => Math.random().toString(36).slice(2, 12).padEnd(10, '0');
const buildPrompt = (n) => {
  const h = 'HEAD-' + nonce(), t = 'TAIL-' + nonce();
  const lead = `This message is a length test for a web page. It has a code word on its first line and a code word on its last line; everything between them is filler. Please answer with just the two code words.\nFirst code word: ${h}\n`;
  const end = `\nLast code word: ${t}`;
  const k = n - lead.length - end.length;
  return { p: lead + FILL.repeat(Math.ceil(k / FILL.length)).slice(0, k) + end, h, t };
};
const classify = (reply, h, t) => {
  const s = typeof reply === 'string' ? reply : '';
  return !s.includes(h) ? 'unproven' : s.includes(t) ? 'ok' : 'truncated';
};
const jsonForm = (reply) => {
  const s = typeof reply === 'string' ? reply.trim() : '';
  const isObject = (x) => { try { return JSON.stringify(JSON.parse(x))[0] === '{'; } catch { return false; } };
  const m = /^\x60{3}(?:json)?\s*([\s\S]*?)\s*\x60{3}$/.exec(s);
  return { form: isObject(s) ? 'bare' : m && isObject(m[1]) ? 'fenced' : 'prose' };
};
const ask = async (prompt, gone, read) => {
  const ac = new AbortController(), t0 = Date.now();
  let first, more = {};
  gone.then(() => ac.abort());
  const call = NS.sample
    ? () => NS.sample(prompt, { modelTier: 'quick', cache: false, signal: ac.signal, onText: () => { first = first || Date.now() - t0; } })
        .then((x) => { more = { truncatedFlag: x.truncated, tier: x.modelTierApplied }; return x.text; }, (e) => { more = { code: e && e.code }; throw e; })
    : () => window.claude.complete(prompt);
  const { r, ...rec } = await timed(() => Promise.race([call(), gone]), 12e4);
  Object.assign(rec, more, first ? { firstMs: first } : {});
  if (rec.error || rec.code) rec.outcome = rec.code === 'cancelled' ? 'cancelled' : 'rejected';
  else if (r === LATE) rec.outcome = 'timeout';
  else if (r === GONE) rec.outcome = 'cancelled';
  else Object.assign(rec, { len: typeof r === 'string' ? r.length : -1, reply: String(r).slice(0, 700), replyEnd: String(r).slice(-160) }, read(r));
  return rec;
};
const keep = async () => {
  if (!NS.db) return;
  R.at = new Date().toISOString();
  const ok = await bounded(Promise.resolve().then(() => NS.db.doc('reports/' + RUN).set(JSON.parse(JSON.stringify(R)))), 15e3, LATE).then((x) => x !== LATE, () => false);
  say('saved', ok ? 'report saved for Claude to read' : 'could not save the report - use copy');
};
const measure = async () => {
  const go = $('measure'), stop = $('cancel');
  if (go.disabled) return;
  if (!NS.sample && typeof (window.claude && window.claude.complete) !== 'function') return say('plan', 'no brain here (neither the sample capability nor window.claude.complete) - nothing to measure');
  go.disabled = true;
  stop.disabled = false;
  const gone = new Promise((r) => { stop.onclick = () => r(GONE); });
  const draw = () => rows('rungs', R.ladder.concat(R.json || []));
  R.ladder = [];
  R.json = null;
  try {
    let rec;
    for (const n of LADDER) {
      say('plan', `asking with ${n} bytes...`);
      const { p, h, t } = buildPrompt(n);
      rec = await ask(p, gone, (r) => ({ outcome: classify(r, h, t) }));
      R.ladder.push({ bytes: n, ...rec });
      draw();
      if (rec.outcome !== 'ok') break;
    }
    if (rec.outcome !== 'cancelled') {
      say('plan', 'asking for a small JSON reply...');
      R.json = await ask(JSON_ASK, gone, jsonForm);
      draw();
    }
  } finally {
    say('plan', 'done - ' + plan());
    keep();
    go.disabled = false;
    stop.disabled = true;
  }
};
const extra = async (key, fn) => {
  const { r, error, message, ms, ...rest } = await timed(fn, 3e4);
  R[key] = error || r === LATE ? { ok: false, error: r === LATE ? 'no answer in 30 s' : message, ...rest, ms } : { ok: true, ...r, ms };
  rows('extras', { source: R.source, download: R.download });
  keep();
};
const source = () => extra('source', async () => {
  const res = await fetch(location.href, { cache: 'no-store' });
  const s = await res.text(), low = s.toLowerCase(), count = (x) => low.split(x).length - 1;
  return { status: res.status, bytes: s.length, doctypes: count('<!doctype'), scripts: count('<script'), scriptsBeforeProbe: low.slice(0, low.indexOf('<title>snug runtime probe')).split('<script').length - 1, hasProbe: s.includes(R.schema) };
});
const save = () => extra('download', async () => {
  if (!NS.downloads) throw new Error('the downloads capability did not resolve');
  const r = await NS.downloads.save({ filename: 'snug-probe.json', data: JSON.stringify({ probe: R.schema }) }).catch((e) => { throw new Error(String((e && e.code) || e)); });
  return { result: Object(r) === r ? Object.keys(r).join() : typeof r };
});
const copy = () => {
  const o = $('out');
  R.at = new Date().toISOString();
  o.value = JSON.stringify(R);
  o.select();
  say('copied', attempt(() => document.execCommand('copy')) === true ? 'copied' : 'not copied - copy it by hand from the box below');
};
const on = (id, fn) => { $(id).onclick = () => fn(); };
try {
  window.__probe = { buildPrompt, classify, jsonForm, kid };
  on('measure', measure);
  on('source', source);
  on('save', save);
  on('copy', copy);
  say('plan', plan());
  boot().catch((e) => { R.facts.error = errName(e); });
} catch (e) { attempt(() => document.body.append('probe failed: ' + errName(e))); }
})();
</script>

</body></html>
